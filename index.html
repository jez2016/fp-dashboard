      </div>
    </div>
  );
}


// ─── AI Assistant ─────────────────────────────────────────────────────────────
function buildFinancialContext(uploads, cfUploads, effectiveOwnerMode) {
  if (!uploads.length) return null;

  const clinics = ["Mt Evelyn","Olinda","Chirnside Park"];
  const quarters = [...new Set(uploads.map(d=>d.quarter))].sort((a,b)=>qKey(a).localeCompare(qKey(b)));

  // Build P&L summary table
  let plLines = ["=== QUARTERLY P&L (all figures in AUD) ===\n"];
  plLines.push(["Quarter","Clinic","Revenue","Gross Profit","OpEx","Net Profit","Adj EBITDA","EBITDA Margin%","Wages","Owner Salary","Owner Super","D&A","Interest"].join("\t"));
  for (const q of quarters) {
    for (const c of clinics) {
      const d = uploads.find(u=>u.clinic===c&&u.quarter===q);
      if (!d) continue;
      const m = computeMetrics(d.accounts, c);
      plLines.push([q,c,
        Math.round(m.revenue), Math.round(m.grossProfit), Math.round(m.opex||0),
        Math.round(m.netProfit), Math.round(m.adjEbitda),
        m.ebitdaMargin.toFixed(1), Math.round(m.wages),
        Math.round(m.ownerSalary), Math.round(m.ownerSuper),
        Math.round(m.da), Math.round(m.interest)
      ].join("\t"));
    }
  }

  // Group totals
  plLines.push("\n=== GROUP QUARTERLY TOTALS ===");
  plLines.push(["Quarter","Total Revenue","Total Adj EBITDA","Group Margin%"].join("\t"));
  for (const q of quarters) {
    let rev=0, ebitda=0;
    for (const c of clinics) {
      const d = uploads.find(u=>u.clinic===c&&u.quarter===q);
      if (!d) continue;
      const m = computeMetrics(d.accounts, c);
      rev+=m.revenue; ebitda+=m.adjEbitda;
    }
    plLines.push([q, Math.round(rev), Math.round(ebitda), rev?(ebitda/rev*100).toFixed(1):"—"].join("\t"));
  }

  // Trailing 4Q annualised per clinic
  plLines.push("\n=== TRAILING 4 QUARTERS (ANNUALISED) ===");
  const last4Q = quarters.slice(-4);
  for (const c of clinics) {
    const t4 = last4Q.reduce((s,q)=>{
      const d=uploads.find(u=>u.clinic===c&&u.quarter===q);
      if(!d) return s;
      const m=computeMetrics(d.accounts,c);
      return {rev:s.rev+m.revenue, ebitda:s.ebitda+m.adjEbitda, ownerCash:s.ownerCash+(m.ownerSalary+m.ownerSuper)};
    },{rev:0,ebitda:0,ownerCash:0});
    plLines.push(`${c}: Revenue $${Math.round(t4.rev).toLocaleString()} | Adj EBITDA $${Math.round(t4.ebitda).toLocaleString()} | Owner drawings $${Math.round(t4.ownerCash).toLocaleString()}`);
  }

  // Owner earnings note
  const totalOwnerSalary = quarters.slice(-4).reduce((s,q)=>{
    return s+clinics.reduce((cs,c)=>{
      const d=uploads.find(u=>u.clinic===c&&u.quarter===q); if(!d) return cs;
      const m=computeMetrics(d.accounts,c); return cs+m.ownerSalary+m.ownerSuper;
    },0);
  },0);
  plLines.push(`\nAnnual owner salary + super (last 4Q): $${Math.round(totalOwnerSalary).toLocaleString()}`);
  plLines.push("Note: Adj EBITDA adds back owner salary, super, D&A, and interest to net profit");
  plLines.push("Note: 'Owner Earnings' = Net Profit + Owner Salary + Owner Super (cash available to owners after tax)");

  // Cash flow section
  let cashLines = ["\n=== CASH FLOW MANAGER (daily, from Xero) ==="];
  if (cfUploads.length) {
    const today = new Date().toISOString().slice(0,10);
    for (const cf of cfUploads) {
      const todayRow = cf.days.find(d=>d.date===today||d.isToday);
      const lastRow = cf.days[cf.days.length-1];
      cashLines.push(`\n${cf.clinic}:`);
      cashLines.push(`  Today's balance: $${Math.round(todayRow?.closeBal||0).toLocaleString()}`);
      cashLines.push(`  Projection end (${lastRow?.date}): $${Math.round(lastRow?.closeBal||0).toLocaleString()}`);
      // Monthly closing balances
      cashLines.push("  Monthly closing balances:");
      const months = {};
      for (const d of cf.days) {
        const mo = d.date.slice(0,7);
        months[mo] = d.closeBal;
      }
      for (const [mo,bal] of Object.entries(months)) {
        cashLines.push(`    ${mo}: $${Math.round(bal).toLocaleString()}`);
      }
      // Big outflow days
      const bigOut = cf.days.filter(d=>d.cashOut>8000).slice(0,10);
      if (bigOut.length) {
        cashLines.push("  Large outflow days (wages/BAS/other):");
        for (const d of bigOut) cashLines.push(`    ${d.date}: $${Math.round(d.cashOut).toLocaleString()} out → balance $${Math.round(d.closeBal).toLocaleString()}`);
      }
    }
    // Combined totals by month
    cashLines.push("\n  === COMBINED GROUP CASH BY MONTH ===");
    const allDates = [...new Set(cfUploads.flatMap(cf=>cf.days.map(d=>d.date)))].sort();
    const groupByMonth = {};
    for (const date of allDates) {
      const mo = date.slice(0,7);
      let total = 0;
      for (const cf of cfUploads) {
        const row = cf.days.find(d=>d.date===date);
        if (row) total += row.closeBal;
      }
      groupByMonth[mo] = total;
    }
    for (const [mo,bal] of Object.entries(groupByMonth)) {
      cashLines.push(`  ${mo}: $${Math.round(bal).toLocaleString()}`);
    }
  } else {
    cashLines.push("No cash flow data loaded.");
  }

  // Business context
  const context = `
You are a financial analyst assistant for Form & Practice, an Australian physiotherapy and Pilates business with three clinic locations: Mt Evelyn, Olinda, and Chirnside Park (Victoria, Australia).

Business structure:
- Mt Evelyn and Chirnside Park operate under the same legal entity (Form & Practice Mt Evelyn Pty Ltd). Chirnside Park only became profitable in FY26.
- Olinda operates as a separate entity (Form & Practice Olinda Pty Ltd)
- Owner operators: Jerry Higgins and Kate Rae. Owner salaries are drawn from Mt Evelyn and Olinda only (not Chirnside).
- General Manager: Ben Croxford
- Accountant: Peter Gillis at ROCG Business Services
- Medfin loans of ~$167k net (studio fit-outs) held under associated entity DRAH — not on F&P books, but relevant for net proceeds in any sale scenario
- Australian financial year: July–September = Q1, October–December = Q2, January–March = Q3, April–June = Q4
- BAS quarters due approximately 28 Oct, 28 Jan, 28 Apr, 28 Jul
- Wages paid fortnightly

Valuation context: Allied health practices typically sell at 3–5× trailing 12-month Adj. EBITDA for an asset sale. Any sale would require repaying Medfin (~$167k) from proceeds.

When answering questions:
- Be direct and specific — use actual dollar figures from the data
- When asked about projections, clearly distinguish between Xero-derived cash flow projections (near-term, based on scheduled transactions) and trend-based estimates (longer-term)
- When asked about EBITDA "adjusted for owner incomes", this means Adj EBITDA which already adds back owner salary and super
- Flag any data limitations clearly (e.g. if cash flow data only goes to a certain date)
- Keep answers concise — 2–4 short paragraphs maximum unless a table is genuinely helpful
- Use Australian dollar formatting

${plLines.join("\n")}
${cashLines.join("\n")}
`.trim();

  return context;
}

function AIAssistant({uploads, cfUploads, ownerMode}) {
  const [messages, setMessages] = useState([]);
  const [input, setInput]       = useState("");
  const [loading, setLoading]   = useState(false);
  const [apiKey, setApiKey]     = useState(()=>localStorage.getItem("fp_ai_key")||"");
  const [showKeyInput, setShowKeyInput] = useState(false);
  const [error, setError]       = useState(null);
  const bottomRef               = useRef();

  const saveKey = k => { setApiKey(k); localStorage.setItem("fp_ai_key",k); };

  const SUGGESTED = [
    "What is our projected group cash balance in July 2026?",
    "What is our predicted EBITDA adjusted for owner salaries across all three clinics?",
    "Which clinic has the best EBITDA margin trend?",
    "What would our indicative business valuation be at 3× and 4× EBITDA?",
    "Where are the biggest cash flow risks in the next 90 days?",
    "How much CAPEX could we service if we were acquiring a new site?",
  ];

  const send = async (text) => {
    const q = (text||input).trim();
    if (!q || loading) return;
    if (!apiKey) { setShowKeyInput(true); return; }

    const context = buildFinancialContext(uploads, cfUploads, effectiveOwnerMode);
    if (!context) { setError("Load your Xero files first, then ask questions."); return; }

    setInput("");
    setError(null);
    const newMessages = [...messages, {role:"user",content:q}];
    setMessages(newMessages);
    setLoading(true);

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body: JSON.stringify({
          model:"claude-opus-4-5",
          max_tokens:1024,
          system: context,
          messages: newMessages.map(m=>({role:m.role,content:m.content})),
        })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const reply = data.content?.[0]?.text || "No response";
      setMessages(prev=>[...prev,{role:"assistant",content:reply}]);
    } catch(e) {
      setError("API error: "+e.message);
      setMessages(prev=>prev.slice(0,-1));
    } finally {
      setLoading(false);
      setTimeout(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),100);
    }
  };

  const hasData = uploads.length > 0;

  return (
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 180px)",minHeight:500}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:16,fontWeight:700,color:P.text}}>AI Financial Assistant</div>
          <div style={{fontSize:12,color:P.muted,marginTop:2}}>
            Ask questions about your loaded data in plain English
            {!hasData&&<span style={{color:P.gold,marginLeft:6}}>— load your Xero files first</span>}
          </div>
        </div>
        <button onClick={()=>setShowKeyInput(v=>!v)}
          style={{background:apiKey?`${P.green}15`:P.alt,border:`1px solid ${apiKey?P.green:P.border}`,color:apiKey?P.green:P.muted,borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:12,fontWeight:600}}>
          {apiKey?"✓ API key set":"⚙ Set API key"}
        </button>
      </div>

      {/* API key input */}
      {showKeyInput&&(
        <div style={{background:P.alt,border:`1px solid ${P.border}`,borderRadius:10,padding:"16px 18px",marginBottom:14}}>
          <div style={{fontSize:12,color:P.muted,marginBottom:8,lineHeight:1.6}}>
            Enter your <strong style={{color:P.text}}>Anthropic API key</strong> — stored locally in your browser, never sent anywhere except Anthropic's API.<br/>
            Get one at <span style={{color:P.blue}}>console.anthropic.com</span> → API Keys → Create key. Usage billed at standard rates (~$0.01–0.03 per question).
          </div>
          <div style={{display:"flex",gap:8}}>
            <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)}
              placeholder="sk-ant-..."
              style={{flex:1,background:P.surface,border:`1px solid ${P.border}`,color:P.text,borderRadius:7,padding:"8px 12px",fontSize:13,outline:"none",fontFamily:"monospace"}}/>
            <button onClick={()=>{saveKey(apiKey);setShowKeyInput(false);}}
              style={{background:P.blue,border:"none",color:"white",borderRadius:7,padding:"8px 16px",cursor:"pointer",fontSize:13,fontWeight:600}}>
              Save
            </button>
          </div>
        </div>
      )}

      {/* Suggested questions */}
      {messages.length===0&&(
        <div style={{marginBottom:16}}>
          <div style={{fontSize:11,color:P.muted,marginBottom:8,textTransform:"uppercase",letterSpacing:1,fontWeight:600}}>Suggested questions</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {SUGGESTED.map((s,i)=>(
              <button key={i} onClick={()=>send(s)}
                style={{background:P.surface,border:`1px solid ${P.border}`,color:P.text,borderRadius:20,padding:"7px 14px",cursor:"pointer",fontSize:12,textAlign:"left",transition:"all 0.15s"}}
                onMouseOver={e=>e.currentTarget.style.borderColor=P.gold}
                onMouseOut={e=>e.currentTarget.style.borderColor=P.border}>
                {s}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Message thread */}
      <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:12,paddingRight:4,marginBottom:12}}>
        {messages.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
            <div style={{
              maxWidth:"80%",
              background: m.role==="user"?P.blue:P.surface,
              color: m.role==="user"?"white":P.text,
              border: m.role==="assistant"?`1px solid ${P.border}`:"none",
              borderRadius: m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px",
              padding:"12px 16px",fontSize:13,lineHeight:1.65,
              whiteSpace:"pre-wrap",
            }}>
              {m.role==="assistant"&&(
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6,paddingBottom:6,borderBottom:`1px solid ${P.border}`}}>
                  <div style={{width:20,height:20,borderRadius:"50%",background:P.gold,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"white",fontWeight:700}}>AI</div>
                  <span style={{fontSize:11,color:P.muted,fontWeight:600}}>F&P Financial Assistant</span>
                </div>
              )}
              {m.content}
            </div>
          </div>
        ))}
        {loading&&(
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 16px",background:P.surface,border:`1px solid ${P.border}`,borderRadius:"16px 16px 16px 4px",width:"fit-content"}}>
            <div style={{display:"flex",gap:4}}>
              {[0,1,2].map(i=>(
                <div key={i} style={{width:6,height:6,borderRadius:"50%",background:P.gold,
                  animation:`pulse 1.2s ease-in-out ${i*0.2}s infinite`}}/>
              ))}
            </div>
            <span style={{fontSize:12,color:P.muted}}>Analysing your data…</span>
          </div>
        )}
        {error&&(
          <div style={{background:`${P.red}10`,border:`1px solid ${P.red}44`,borderRadius:10,padding:"10px 14px",fontSize:12,color:P.red}}>
            {error}
          </div>
        )}
        <div ref={bottomRef}/>
      </div>

      {/* Input */}
      <div style={{display:"flex",gap:8,background:P.surface,border:`1px solid ${P.border}`,borderRadius:12,padding:"8px 8px 8px 14px",alignItems:"flex-end"}}>
        <textarea value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
          placeholder={hasData?"Ask anything about your financials — cash, EBITDA, trends, valuations…":"Load your Xero P&L files first, then ask questions"}
          rows={2} disabled={!hasData||loading}
          style={{flex:1,background:"transparent",border:"none",color:P.text,fontSize:13,resize:"none",outline:"none",lineHeight:1.5,padding:"4px 0",fontFamily:"inherit"}}/>
        <button onClick={()=>send()} disabled={!input.trim()||loading||!hasData}
          style={{background:input.trim()&&!loading&&hasData?P.gold:"#E2E2DC",border:"none",color:input.trim()&&!loading&&hasData?"white":P.muted,borderRadius:8,padding:"9px 16px",cursor:input.trim()&&!loading&&hasData?"pointer":"not-allowed",fontSize:13,fontWeight:700,transition:"all 0.15s",flexShrink:0}}>
          {loading?"…":"Ask →"}
        </button>
      </div>
      {messages.length>0&&(
        <button onClick={()=>setMessages([])} style={{background:"none",border:"none",color:P.muted,fontSize:11,cursor:"pointer",marginTop:8,textAlign:"center"}}>
          Clear conversation
        </button>
      )}
      <style>{`@keyframes pulse{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1)}}`}</style>
    </div>
  );
}

function CashFlowView({cfUploads, loadedClinics}) {
  const [fwdDays,    setFwdDays]   = useState(30);
  const [viewMode,   setViewMode]  = useState("combined"); // "combined"|"clinics"
  const [chBalance,  setChBalance] = useState(()=>Number(localStorage.getItem("fp_ch_bal")||16873));
  const [showChInput,setShowChInput]= useState(false);

  const saveChBal = v => { setChBalance(v); localStorage.setItem("fp_ch_bal",v); };

  // Find today row (date === today or isToday flag)
  const todayStr = new Date().toISOString().slice(0,10);

  // Build combined daily data
  const combined = useMemo(()=>{
    if (cfUploads.length===0) return [];
    // Get all unique dates
    const allDates = [...new Set(cfUploads.flatMap(cf=>cf.days.map(d=>d.date)))].sort();
    return allDates.map(date=>{
      let totalIn=0, totalOut=0, totalClose=0, totalOpen=0;
      const byClinic = {};
      let bigOutflow = false;
      for (const cf of cfUploads) {
        const day = cf.days.find(d=>d.date===date);
        if (day) {
          totalIn    += day.cashIn;
          totalOut   += day.cashOut;
          totalClose += day.closeBal;
          totalOpen  += day.openBal;
          byClinic[cf.clinic] = day;
          if (day.cashOut > 5000) bigOutflow = true;
        }
      }
      // Add Chirnside if missing but we have a manual balance for offset
      const hasCh = cfUploads.some(cf=>cf.clinic==="Chirnside Park");
      if (!hasCh) {
        // Use the screenshot balance as today's known value; project flat (no other data)
        totalClose += chBalance;
      }
      const isToday = date === todayStr || cfUploads.some(cf=>cf.days.find(d=>d.date===date&&d.isToday));
      return { date, totalIn, totalOut, totalClose, totalOpen, byClinic, isToday, bigOutflow };
    });
  },[cfUploads, chBalance, todayStr]);

  // Slice to today + fwdDays
  const todayIdx  = combined.findIndex(d=>d.isToday||d.date>=todayStr);
  const startIdx  = Math.max(0, todayIdx-7); // show 1 week of actuals before today
  const endIdx    = Math.min(combined.length-1, todayIdx + fwdDays);
  const chartData = combined.slice(startIdx, endIdx+1).map(d=>({
    ...d,
    label: new Date(d.date+"T00:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short"}),
    isFuture: d.date > todayStr,
  }));

  // KPI numbers
  const todayRow   = combined.find(d=>d.isToday||d.date===todayStr);
  const fwdRow     = combined[Math.min(combined.length-1, todayIdx+fwdDays)];

    return cf?.days.find(d=>d.isToday||d.date===todayStr)?.closeBal || 0;
  };

  if (cfUploads.length===0) return (
    <div>

        <div style={{fontSize:32}}>💵</div>
        <div>
          <div style={{fontSize:15,fontWeight:600,color:P.text,marginBottom:8}}>Drop your Xero Cash Flow Manager exports here</div>
          <div style={{fontSize:13,color:P.muted,lineHeight:1.9,marginBottom:12}}>
            In Xero for each clinic:<br/>
            <strong style={{color:P.text}}>Accounting → Cash Flow Manager</strong> → set to 30 or 90 days<br/>
            Click <strong style={{color:P.text}}>Export → New (Excel)</strong> — the "New" button next to Export<br/>
            Name each file with the clinic name and "cash" e.g. <code style={{color:P.teal}}>MtEvelyn-cash.xlsx</code><br/>
            Drop all three here — the dashboard combines them into one view
          </div>
          <div style={{fontSize:11,color:P.dim}}>Files are detected automatically by the word "cash" in the filename.</div>
        </div>
      </div>
      {/* Chirnside manual balance input */}
      <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:10,padding:"16px 20px"}}>
        <div style={{fontSize:12,color:P.muted,marginBottom:8}}>If Chirnside Park file is unavailable, enter today's balance manually:</div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <input type="number" value={chBalance} onChange={e=>saveChBal(Number(e.target.value))}
            style={{background:P.alt,border:`1px solid ${P.border}`,color:P.text,borderRadius:6,padding:"7px 12px",fontSize:14,width:140,outline:"none"}}/>
          <span style={{fontSize:11,color:P.dim}}>Saved locally · used as static offset in combined view</span>
        </div>
      </div>
    </div>
  );

            {cfUploads.map(cf=>cf.clinic).join(" · ")}
            {!hasCh&&<span style={{color:P.gold}}> · Chirnside ${chBalance.toLocaleString()} (manual)</span>}
            {" · "}combined view
          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <span style={{fontSize:11,color:P.muted}}>Show ahead:</span>
          {[7,14,30,60,90].map(d=>(
            <button key={d} onClick={()=>setFwdDays(d)}
              style={{background:fwdDays===d?`${P.teal}22`:"transparent",border:`1px solid ${fwdDays===d?P.teal:P.border}`,color:fwdDays===d?P.teal:P.muted,borderRadius:6,padding:"5px 11px",cursor:"pointer",fontSize:11}}>
              {d}d
            </button>
          ))}
        </div>
      </div>

      {/* KPI strip */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:20}}>
        {/* Per-clinic today */}
        {["Mt Evelyn","Olinda","Chirnside Park"].map(c=>{
          const bal = clinicToday(c);
          const isMissing = c==="Chirnside Park" && !hasCh;
          return (
            <div key={c} style={{background:P.surface,border:`1px solid ${CC[c]}44`,borderRadius:10,padding:"13px 16px"}}>
              <div style={{fontSize:9,color:CC[c],textTransform:"uppercase",letterSpacing:1.2,fontFamily:"monospace",marginBottom:4}}>{c}</div>
              <div style={{fontSize:18,fontWeight:700,color:P.text,fontFamily:"'DM Serif Display',serif"}}>{fmtK(bal)}</div>
              <div style={{fontSize:10,color:P.muted,marginTop:2}}>today{isMissing?" (manual)":""}</div>
            </div>
          );
        })}
        {/* Combined */}
        <div style={{background:P.surface,border:`1px solid ${P.gold}44`,borderRadius:10,padding:"13px 16px"}}>
          <div style={{fontSize:9,color:P.gold,textTransform:"uppercase",letterSpacing:1.2,fontFamily:"monospace",marginBottom:4}}>Group Total Today</div>
          <div style={{fontSize:22,fontWeight:700,color:P.gold,fontFamily:"'DM Serif Display',serif"}}>{fmtK(todayRow?.totalClose||0)}</div>

function buildFinancialContext(uploads, cfUploads, effectiveOwnerMode) {
  if (!uploads.length) return null;

  const clinics = ["Mt Evelyn","Olinda","Chirnside Park"];
  const quarters = [...new Set(uploads.map(d=>d.quarter))].sort((a,b)=>qKey(a).localeCompare(qKey(b)));

  // Build P&L summary table
  let plLines = ["=== QUARTERLY P&L (all figures in AUD) ===\n"];
  plLines.push(["Quarter","Clinic","Revenue","Gross Profit","OpEx","Net Profit","Adj EBITDA","EBITDA Margin%","Wages","Owner Salary","Owner Super","D&A","Interest"].join("\t"));
  for (const q of quarters) {
    for (const c of clinics) {
      const d = uploads.find(u=>u.clinic===c&&u.quarter===q);
      if (!d) continue;
      const m = computeMetrics(d.accounts, c);
      plLines.push([q,c,
        Math.round(m.revenue), Math.round(m.grossProfit), Math.round(m.opex||0),
        Math.round(m.netProfit), Math.round(m.adjEbitda),
        m.ebitdaMargin.toFixed(1), Math.round(m.wages),
        Math.round(m.ownerSalary), Math.round(m.ownerSuper),
        Math.round(m.da), Math.round(m.interest)
      ].join("\t"));
    }
  }

  // Group totals
  plLines.push("\n=== GROUP QUARTERLY TOTALS ===");
  plLines.push(["Quarter","Total Revenue","Total Adj EBITDA","Group Margin%"].join("\t"));
  for (const q of quarters) {
    let rev=0, ebitda=0;
    for (const c of clinics) {
      const d = uploads.find(u=>u.clinic===c&&u.quarter===q);
      if (!d) continue;
      const m = computeMetrics(d.accounts, c);
      rev+=m.revenue; ebitda+=m.adjEbitda;
    }
    plLines.push([q, Math.round(rev), Math.round(ebitda), rev?(ebitda/rev*100).toFixed(1):"—"].join("\t"));
  }

  // Trailing 4Q annualised per clinic
  plLines.push("\n=== TRAILING 4 QUARTERS (ANNUALISED) ===");
  const last4Q = quarters.slice(-4);
  for (const c of clinics) {
    const t4 = last4Q.reduce((s,q)=>{
      const d=uploads.find(u=>u.clinic===c&&u.quarter===q);
      if(!d) return s;
      const m=computeMetrics(d.accounts,c);
      return {rev:s.rev+m.revenue, ebitda:s.ebitda+m.adjEbitda, ownerCash:s.ownerCash+(m.ownerSalary+m.ownerSuper)};
    },{rev:0,ebitda:0,ownerCash:0});
    plLines.push(`${c}: Revenue $${Math.round(t4.rev).toLocaleString()} | Adj EBITDA $${Math.round(t4.ebitda).toLocaleString()} | Owner drawings $${Math.round(t4.ownerCash).toLocaleString()}`);
  }

  // Owner earnings note
  const totalOwnerSalary = quarters.slice(-4).reduce((s,q)=>{
    return s+clinics.reduce((cs,c)=>{
      const d=uploads.find(u=>u.clinic===c&&u.quarter===q); if(!d) return cs;
      const m=computeMetrics(d.accounts,c); return cs+m.ownerSalary+m.ownerSuper;
    },0);
  },0);
  plLines.push(`\nAnnual owner salary + super (last 4Q): $${Math.round(totalOwnerSalary).toLocaleString()}`);
  plLines.push("Note: Adj EBITDA adds back owner salary, super, D&A, and interest to net profit");
  plLines.push("Note: 'Owner Earnings' = Net Profit + Owner Salary + Owner Super (cash available to owners after tax)");

  // Cash flow section
  let cashLines = ["\n=== CASH FLOW MANAGER (daily, from Xero) ==="];
  if (cfUploads.length) {
    const today = new Date().toISOString().slice(0,10);
    for (const cf of cfUploads) {
      const todayRow = cf.days.find(d=>d.date===today||d.isToday);
      const lastRow = cf.days[cf.days.length-1];
      cashLines.push(`\n${cf.clinic}:`);
      cashLines.push(`  Today's balance: $${Math.round(todayRow?.closeBal||0).toLocaleString()}`);
      cashLines.push(`  Projection end (${lastRow?.date}): $${Math.round(lastRow?.closeBal||0).toLocaleString()}`);
      // Monthly closing balances
      cashLines.push("  Monthly closing balances:");
      const months = {};
      for (const d of cf.days) {
        const mo = d.date.slice(0,7);
        months[mo] = d.closeBal;
      }
      for (const [mo,bal] of Object.entries(months)) {
        cashLines.push(`    ${mo}: $${Math.round(bal).toLocaleString()}`);
      }
      // Big outflow days
      const bigOut = cf.days.filter(d=>d.cashOut>8000).slice(0,10);
      if (bigOut.length) {
        cashLines.push("  Large outflow days (wages/BAS/other):");
        for (const d of bigOut) cashLines.push(`    ${d.date}: $${Math.round(d.cashOut).toLocaleString()} out → balance $${Math.round(d.closeBal).toLocaleString()}`);
      }
    }
    // Combined totals by month
    cashLines.push("\n  === COMBINED GROUP CASH BY MONTH ===");
    const allDates = [...new Set(cfUploads.flatMap(cf=>cf.days.map(d=>d.date)))].sort();
    const groupByMonth = {};
    for (const date of allDates) {
      const mo = date.slice(0,7);
      let total = 0;
      for (const cf of cfUploads) {
        const row = cf.days.find(d=>d.date===date);
        if (row) total += row.closeBal;
      }
      groupByMonth[mo] = total;
    }
    for (const [mo,bal] of Object.entries(groupByMonth)) {
      cashLines.push(`  ${mo}: $${Math.round(bal).toLocaleString()}`);
    }
  } else {
    cashLines.push("No cash flow data loaded.");
  }

  // Business context
  const context = `
You are a financial analyst assistant for Form & Practice, an Australian physiotherapy and Pilates business with three clinic locations: Mt Evelyn, Olinda, and Chirnside Park (Victoria, Australia).

Business structure:
- Mt Evelyn and Chirnside Park operate under the same legal entity (Form & Practice Mt Evelyn Pty Ltd). Chirnside Park only became profitable in FY26.
- Olinda operates as a separate entity (Form & Practice Olinda Pty Ltd)
- Owner operators: Jerry Higgins and Kate Rae. Owner salaries are drawn from Mt Evelyn and Olinda only (not Chirnside).
- General Manager: Ben Croxford
- Accountant: Peter Gillis at ROCG Business Services
- Medfin loans of ~$167k net (studio fit-outs) held under associated entity DRAH — not on F&P books, but relevant for net proceeds in any sale scenario
- Australian financial year: July–September = Q1, October–December = Q2, January–March = Q3, April–June = Q4
- BAS quarters due approximately 28 Oct, 28 Jan, 28 Apr, 28 Jul
- Wages paid fortnightly

Valuation context: Allied health practices typically sell at 3–5× trailing 12-month Adj. EBITDA for an asset sale. Any sale would require repaying Medfin (~$167k) from proceeds.

When answering questions:
- Be direct and specific — use actual dollar figures from the data
- When asked about projections, clearly distinguish between Xero-derived cash flow projections (near-term, based on scheduled transactions) and trend-based estimates (longer-term)
- When asked about EBITDA "adjusted for owner incomes", this means Adj EBITDA which already adds back owner salary and super
- Flag any data limitations clearly (e.g. if cash flow data only goes to a certain date)
- Keep answers concise — 2–4 short paragraphs maximum unless a table is genuinely helpful
- Use Australian dollar formatting

${plLines.join("\n")}
${cashLines.join("\n")}
`.trim();

  return context;
}

function AIAssistant({uploads, cfUploads, ownerMode}) {
  const [messages, setMessages] = useState([]);
  const [input, setInput]       = useState("");
  const [loading, setLoading]   = useState(false);
  const [apiKey, setApiKey]     = useState(()=>localStorage.getItem("fp_ai_key")||"");
  const [showKeyInput, setShowKeyInput] = useState(false);
  const [error, setError]       = useState(null);
  const bottomRef               = useRef();

  const saveKey = k => { setApiKey(k); localStorage.setItem("fp_ai_key",k); };

  const SUGGESTED = [
    "What is our projected group cash balance in July 2026?",
    "What is our predicted EBITDA adjusted for owner salaries across all three clinics?",
    "Which clinic has the best EBITDA margin trend?",
    "What would our indicative business valuation be at 3× and 4× EBITDA?",
    "Where are the biggest cash flow risks in the next 90 days?",
    "How much CAPEX could we service if we were acquiring a new site?",
  ];

  const send = async (text) => {
    const q = (text||input).trim();
    if (!q || loading) return;

    setInput("");
    setError(null);
    const newMessages = [...messages, {role:"user",content:q}];
    setMessages(newMessages);
    setLoading(true);

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body: JSON.stringify({
          model:"claude-opus-4-5",
          max_tokens:1024,
          system: context,
          messages: newMessages.map(m=>({role:m.role,content:m.content})),
        })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const reply = data.content?.[0]?.text || "No response";
      setMessages(prev=>[...prev,{role:"assistant",content:reply}]);
    } catch(e) {
      setError("API error: "+e.message);
      setMessages(prev=>prev.slice(0,-1));
    } finally {
      setLoading(false);
      setTimeout(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),100);
    }
  };

  const hasData = uploads.length > 0;

  return (
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 180px)",minHeight:500}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:16,fontWeight:700,color:P.text}}>AI Financial Assistant</div>
          <div style={{fontSize:12,color:P.muted,marginTop:2}}>
            Ask questions about your loaded data in plain English
            {!hasData&&<span style={{color:P.gold,marginLeft:6}}>— load your Xero files first</span>}
          </div>
        </div>
        <button onClick={()=>setShowKeyInput(v=>!v)}
          style={{background:apiKey?`${P.green}15`:P.alt,border:`1px solid ${apiKey?P.green:P.border}`,color:apiKey?P.green:P.muted,borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:12,fontWeight:600}}>
          {apiKey?"✓ API key set":"⚙ Set API key"}
        </button>
      </div>

      {/* API key input */}
      {showKeyInput&&(
        <div style={{background:P.alt,border:`1px solid ${P.border}`,borderRadius:10,padding:"16px 18px",marginBottom:14}}>
          <div style={{fontSize:12,color:P.muted,marginBottom:8,lineHeight:1.6}}>
            Enter your <strong style={{color:P.text}}>Anthropic API key</strong> — stored locally in your browser, never sent anywhere except Anthropic's API.<br/>
            Get one at <span style={{color:P.blue}}>console.anthropic.com</span> → API Keys → Create key. Usage billed at standard rates (~$0.01–0.03 per question).
          </div>
          <div style={{display:"flex",gap:8}}>
            <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)}
              placeholder="sk-ant-..."
              style={{flex:1,background:P.surface,border:`1px solid ${P.border}`,color:P.text,borderRadius:7,padding:"8px 12px",fontSize:13,outline:"none",fontFamily:"monospace"}}/>
            <button onClick={()=>{saveKey(apiKey);setShowKeyInput(false);}}
              style={{background:P.blue,border:"none",color:"white",borderRadius:7,padding:"8px 16px",cursor:"pointer",fontSize:13,fontWeight:600}}>
              Save
            </button>
          </div>
        </div>
      )}

      {/* Suggested questions */}
      {messages.length===0&&(
        <div style={{marginBottom:16}}>
          <div style={{fontSize:11,color:P.muted,marginBottom:8,textTransform:"uppercase",letterSpacing:1,fontWeight:600}}>Suggested questions</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {SUGGESTED.map((s,i)=>(
              <button key={i} onClick={()=>send(s)}
                style={{background:P.surface,border:`1px solid ${P.border}`,color:P.text,borderRadius:20,padding:"7px 14px",cursor:"pointer",fontSize:12,textAlign:"left",transition:"all 0.15s"}}
                onMouseOver={e=>e.currentTarget.style.borderColor=P.gold}
                onMouseOut={e=>e.currentTarget.style.borderColor=P.border}>
                {s}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Message thread */}
      <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:12,paddingRight:4,marginBottom:12}}>
        {messages.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
            <div style={{
              maxWidth:"80%",
              background: m.role==="user"?P.blue:P.surface,
              color: m.role==="user"?"white":P.text,
              border: m.role==="assistant"?`1px solid ${P.border}`:"none",
              borderRadius: m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px",
              padding:"12px 16px",fontSize:13,lineHeight:1.65,
              whiteSpace:"pre-wrap",
            }}>
              {m.role==="assistant"&&(
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6,paddingBottom:6,borderBottom:`1px solid ${P.border}`}}>
                  <div style={{width:20,height:20,borderRadius:"50%",background:P.gold,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"white",fontWeight:700}}>AI</div>
                  <span style={{fontSize:11,color:P.muted,fontWeight:600}}>F&P Financial Assistant</span>
                </div>
              )}
              {m.content}
            </div>
          </div>
        ))}
        {loading&&(
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 16px",background:P.surface,border:`1px solid ${P.border}`,borderRadius:"16px 16px 16px 4px",width:"fit-content"}}>
            <div style={{display:"flex",gap:4}}>
              {[0,1,2].map(i=>(
                <div key={i} style={{width:6,height:6,borderRadius:"50%",background:P.gold,
                  animation:`pulse 1.2s ease-in-out ${i*0.2}s infinite`}}/>
              ))}
            </div>
            <span style={{fontSize:12,color:P.muted}}>Analysing your data…</span>
          </div>
        )}
        {error&&(
          <div style={{background:`${P.red}10`,border:`1px solid ${P.red}44`,borderRadius:10,padding:"10px 14px",fontSize:12,color:P.red}}>
            {error}
          </div>
        )}
        <div ref={bottomRef}/>
      </div>

      {/* Input */}
      <div style={{display:"flex",gap:8,background:P.surface,border:`1px solid ${P.border}`,borderRadius:12,padding:"8px 8px 8px 14px",alignItems:"flex-end"}}>
        <textarea value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
          placeholder={hasData?"Ask anything about your financials — cash, EBITDA, trends, valuations…":"Load your Xero P&L files first, then ask questions"}
          rows={2} disabled={!hasData||loading}
          style={{flex:1,background:"transparent",border:"none",color:P.text,fontSize:13,resize:"none",outline:"none",lineHeight:1.5,padding:"4px 0",fontFamily:"inherit"}}/>
        <button onClick={()=>send()} disabled={!input.trim()||loading||!hasData}
          style={{background:input.trim()&&!loading&&hasData?P.gold:"#E2E2DC",border:"none",color:input.trim()&&!loading&&hasData?"white":P.muted,borderRadius:8,padding:"9px 16px",cursor:input.trim()&&!loading&&hasData?"pointer":"not-allowed",fontSize:13,fontWeight:700,transition:"all 0.15s",flexShrink:0}}>
          {loading?"…":"Ask →"}
        </button>
      </div>
      {messages.length>0&&(
        <button onClick={()=>setMessages([])} style={{background:"none",border:"none",color:P.muted,fontSize:11,cursor:"pointer",marginTop:8,textAlign:"center"}}>
          Clear conversation
        </button>
      )}
      <style>{`@keyframes pulse{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1)}}`}</style>
    </div>
  );
}

// ─── Cash Flow View ───────────────────────────────────────────────────────────
function CashFlowView({cfUploads, loadedClinics}) {
  const [fwdDays,    setFwdDays]   = useState(30);
  const [viewMode,   setViewMode]  = useState("combined"); // "combined"|"clinics"
  const [chBalance,  setChBalance] = useState(()=>Number(localStorage.getItem("fp_ch_bal")||16873));
  const [showChInput,setShowChInput]= useState(false);

  const saveChBal = v => { setChBalance(v); localStorage.setItem("fp_ch_bal",v); };

  // Find today row (date === today or isToday flag)
  const todayStr = new Date().toISOString().slice(0,10);

  // Build combined daily data
  const combined = useMemo(()=>{
    if (cfUploads.length===0) return [];
    // Get all unique dates
    const allDates = [...new Set(cfUploads.flatMap(cf=>cf.days.map(d=>d.date)))].sort();
    return allDates.map(date=>{
      let totalIn=0, totalOut=0, totalClose=0, totalOpen=0;
      const byClinic = {};
      let bigOutflow = false;
      for (const cf of cfUploads) {
        const day = cf.days.find(d=>d.date===date);
        if (day) {
          totalIn    += day.cashIn;
          totalOut   += day.cashOut;
          totalClose += day.closeBal;
          totalOpen  += day.openBal;
          byClinic[cf.clinic] = day;
          if (day.cashOut > 5000) bigOutflow = true;
        }
      }
      // Add Chirnside if missing but we have a manual balance for offset
      const hasCh = cfUploads.some(cf=>cf.clinic==="Chirnside Park");
      if (!hasCh) {
        // Use the screenshot balance as today's known value; project flat (no other data)
        totalClose += chBalance;
      }
      const isToday = date === todayStr || cfUploads.some(cf=>cf.days.find(d=>d.date===date&&d.isToday));
      return { date, totalIn, totalOut, totalClose, totalOpen, byClinic, isToday, bigOutflow };
    });
  },[cfUploads, chBalance, todayStr]);

  // Slice to today + fwdDays
  const todayIdx  = combined.findIndex(d=>d.isToday||d.date>=todayStr);
  const startIdx  = Math.max(0, todayIdx-7); // show 1 week of actuals before today
  const endIdx    = Math.min(combined.length-1, todayIdx + fwdDays);
  const chartData = combined.slice(startIdx, endIdx+1).map(d=>({
    ...d,
    label: new Date(d.date+"T00:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short"}),
    isFuture: d.date > todayStr,
  }));

  // KPI numbers
  const todayRow   = combined.find(d=>d.isToday||d.date===todayStr);
  const fwdRow     = combined[Math.min(combined.length-1, todayIdx+fwdDays)];
  const next7      = combined.slice(todayIdx, todayIdx+7);
  const next7net   = next7.reduce((s,d)=>s+d.totalIn-d.totalOut,0);
  const hasCh      = cfUploads.some(cf=>cf.clinic==="Chirnside Park");
  const clinicToday = (c) => {
    if (c==="Chirnside Park" && !hasCh) return chBalance;
    const cf = cfUploads.find(x=>x.clinic===c);
    return cf?.days.find(d=>d.isToday||d.date===todayStr)?.closeBal || 0;
  };
  const minFwd     = chartData.filter(d=>d.isFuture).reduce((m,d)=>Math.min(m,d.totalClose), Infinity);

  if (cfUploads.length===0) return (
    <div>
      <div style={{display:"flex",alignItems:"flex-start",gap:20,background:P.surface,border:`1px solid ${P.border}`,borderRadius:14,padding:"28px 32px",marginBottom:20}}>
        <div style={{fontSize:32}}>💵</div>
        <div>
          <div style={{fontSize:15,fontWeight:600,color:P.text,marginBottom:8}}>Drop your Xero Cash Flow Manager exports here</div>
          <div style={{fontSize:13,color:P.muted,lineHeight:1.9,marginBottom:12}}>
            In Xero for each clinic:<br/>
            <strong style={{color:P.text}}>Accounting → Cash Flow Manager</strong> → set to 30 or 90 days<br/>
            Click <strong style={{color:P.text}}>Export → New (Excel)</strong> — the "New" button next to Export<br/>
            Name each file with the clinic name and "cash" e.g. <code style={{color:P.teal}}>MtEvelyn-cash.xlsx</code><br/>
            Drop all three here — the dashboard combines them into one view
          </div>
          <div style={{fontSize:11,color:P.dim}}>Files are detected automatically by the word "cash" in the filename.</div>
        </div>
      </div>
      {/* Chirnside manual balance input */}
      <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:10,padding:"16px 20px"}}>
        <div style={{fontSize:12,color:P.muted,marginBottom:8}}>If Chirnside Park file is unavailable, enter today's balance manually:</div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <input type="number" value={chBalance} onChange={e=>saveChBal(Number(e.target.value))}
            style={{background:P.alt,border:`1px solid ${P.border}`,color:P.text,borderRadius:6,padding:"7px 12px",fontSize:14,width:140,outline:"none"}}/>
          <span style={{fontSize:11,color:P.dim}}>Saved locally · used as static offset in combined view</span>
        </div>
      </div>
    </div>
  );

  return (
    <div>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18,flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:16,fontWeight:600,color:P.text,marginBottom:3}}>Cash Flow Manager</div>
          <div style={{fontSize:12,color:P.muted}}>
            {cfUploads.map(cf=>cf.clinic).join(" · ")}
            {!hasCh&&<span style={{color:P.gold}}> · Chirnside ${chBalance.toLocaleString()} (manual)</span>}
            {" · "}combined view
          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <span style={{fontSize:11,color:P.muted}}>Show ahead:</span>
          {[7,14,30,60,90].map(d=>(
            <button key={d} onClick={()=>setFwdDays(d)}
              style={{background:fwdDays===d?`${P.teal}22`:"transparent",border:`1px solid ${fwdDays===d?P.teal:P.border}`,color:fwdDays===d?P.teal:P.muted,borderRadius:6,padding:"5px 11px",cursor:"pointer",fontSize:11}}>
              {d}d
            </button>
          ))}
        </div>
      </div>

      {/* KPI strip */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:20}}>
        {/* Per-clinic today */}
        {["Mt Evelyn","Olinda","Chirnside Park"].map(c=>{
          const bal = clinicToday(c);
          const isMissing = c==="Chirnside Park" && !hasCh;
          return (
            <div key={c} style={{background:P.surface,border:`1px solid ${CC[c]}44`,borderRadius:10,padding:"13px 16px"}}>
              <div style={{fontSize:9,color:CC[c],textTransform:"uppercase",letterSpacing:1.2,fontFamily:"monospace",marginBottom:4}}>{c}</div>
              <div style={{fontSize:18,fontWeight:700,color:P.text,fontFamily:"'DM Serif Display',serif"}}>{fmtK(bal)}</div>
              <div style={{fontSize:10,color:P.muted,marginTop:2}}>today{isMissing?" (manual)":""}</div>
            </div>
          );
        })}
        {/* Combined */}
        <div style={{background:P.surface,border:`1px solid ${P.gold}44`,borderRadius:10,padding:"13px 16px"}}>
          <div style={{fontSize:9,color:P.gold,textTransform:"uppercase",letterSpacing:1.2,fontFamily:"monospace",marginBottom:4}}>Group Total Today</div>
          <div style={{fontSize:22,fontWeight:700,color:P.gold,fontFamily:"'DM Serif Display',serif"}}>{fmtK(todayRow?.totalClose||0)}</div>
        </div>
        <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:10,padding:"13px 16px"}}>
          <div style={{fontSize:9,color:P.muted,textTransform:"uppercase",letterSpacing:1.2,fontFamily:"monospace",marginBottom:4}}>Next 7 Days Net</div>
          <div style={{fontSize:22,fontWeight:700,color:next7net>=0?P.green:P.red,fontFamily:"'DM Serif Display',serif"}}>{next7net>=0?"+":""}{fmtK(next7net)}</div>
        </div>
        <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:10,padding:"13px 16px"}}>
          <div style={{fontSize:9,color:P.muted,textTransform:"uppercase",letterSpacing:1.2,fontFamily:"monospace",marginBottom:4}}>Balance in {fwdDays}d</div>
          <div style={{fontSize:22,fontWeight:700,color:P.teal,fontFamily:"'DM Serif Display',serif"}}>{fmtK(fwdRow?.totalClose||0)}</div>
        </div>
        {minFwd < Infinity && (
          <div style={{background:P.surface,border:`1px solid ${minFwd<15000?P.red:minFwd<30000?P.gold:P.border}`,borderRadius:10,padding:"13px 16px"}}>
            <div style={{fontSize:9,color:P.muted,textTransform:"uppercase",letterSpacing:1.2,fontFamily:"monospace",marginBottom:4}}>Lowest Group Balance</div>
            <div style={{fontSize:22,fontWeight:700,color:minFwd<15000?P.red:minFwd<30000?P.gold:P.text,fontFamily:"'DM Serif Display',serif"}}>{fmtK(minFwd)}</div>
            <div style={{fontSize:10,color:P.muted,marginTop:2}}>next {fwdDays} days</div>
          </div>
        )}
        {/* Per-clinic low balance warnings */}
        {cfUploads.map(cf=>{
          const futureDays = cf.days.filter(d=>d.date>todayStr).slice(0,fwdDays);
          if (!futureDays.length) return null;
          const minBal = Math.min(...futureDays.map(d=>d.closeBal));
          const minDay = futureDays.find(d=>d.closeBal===minBal);
          if (minBal > 5000) return null;
          return (
            <div key={cf.clinic} style={{background:P.surface,border:`1px solid ${minBal<2000?P.red:P.gold}`,borderRadius:10,padding:"13px 16px"}}>
              <div style={{fontSize:9,color:CC[cf.clinic],textTransform:"uppercase",letterSpacing:1.2,fontFamily:"monospace",marginBottom:4}}>{cf.clinic} — Low Balance Alert</div>
              <div style={{fontSize:22,fontWeight:700,color:minBal<2000?P.red:P.gold,fontFamily:"'DM Serif Display',serif"}}>{fmtK(minBal)}</div>
              <div style={{fontSize:10,color:P.muted,marginTop:2}}>{minDay?.date} — {minBal<2000?"⚠ critically low":"watch this date"}</div>
            </div>
          );
        })}
      </div>

      {/* Main chart */}
      <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:12,padding:"18px 12px 12px",marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:16,paddingLeft:8,marginBottom:10,flexWrap:"wrap"}}>
          <span style={{fontSize:12,fontWeight:600,color:P.text}}>Combined Group Cash Position</span>
          <span style={{fontSize:11,color:P.muted}}>Solid = actuals · Dashed = projected · ↓ = large payment day</span>
          <div style={{marginLeft:"auto",display:"flex",gap:6}}>
            {["combined","clinics"].map(m=>(
              <button key={m} onClick={()=>setViewMode(m)}
                style={{background:viewMode===m?P.alt:"transparent",border:`1px solid ${viewMode===m?P.border:P.dim}`,color:viewMode===m?P.text:P.muted,borderRadius:6,padding:"5px 12px",cursor:"pointer",fontSize:11}}>
                {m==="combined"?"Combined":"Per Clinic"}
              </button>
            ))}
          </div>
        </div>
        <ResponsiveContainer width="100%" height={300}>
          <AreaChart data={chartData} margin={{top:5,right:10,bottom:5,left:10}}>
            <defs>
              <linearGradient id="cashGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="5%" stopColor={P.teal} stopOpacity={0.25}/>
                <stop offset="95%" stopColor={P.teal} stopOpacity={0.03}/>
              </linearGradient>
              {["Mt Evelyn","Olinda","Chirnside Park"].map(c=>(
                <linearGradient key={c} id={`grad_${c.replace(/\s/g,"")}`} x1="0" y1="0" x2="0" y2="1">
                  <stop offset="5%" stopColor={CC[c]} stopOpacity={0.2}/>
                  <stop offset="95%" stopColor={CC[c]} stopOpacity={0}/>
                </linearGradient>
              ))}
            </defs>
            <CartesianGrid strokeDasharray="3 3" stroke={P.border} vertical={false}/>
            <XAxis dataKey="label" tick={{fill:P.muted,fontSize:9}} interval={Math.max(1,Math.floor(chartData.length/12))} axisLine={false} tickLine={false}/>
            <YAxis tickFormatter={fmtK} tick={{fill:P.muted,fontSize:10}} width={60} axisLine={false} tickLine={false}/>
            <Tooltip content={({active,payload,label})=>{
              if(!active||!payload?.length) return null;
              const d = chartData.find(r=>r.label===label);
              return <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:8,padding:"10px 14px",minWidth:200}}>
                <div style={{color:P.muted,fontSize:11,marginBottom:6}}>{d?.date} {d?.isFuture?"(projected)":"(actual)"}</div>
                {viewMode==="combined"?(
                  <div style={{color:P.teal,fontWeight:700,fontSize:14,marginBottom:4}}>Group: {fmtK(d?.totalClose||0)}</div>
                ):(
                  ["Mt Evelyn","Olinda","Chirnside Park"].map(c=>{
                    const v = d?.byClinic?.[c]?.closeBal || (c==="Chirnside Park"?chBalance:0);
                    return <div key={c} style={{color:CC[c],fontSize:12,marginBottom:2}}>{c}: {fmtK(v)}</div>;
                  })
                )}
                {d?.totalIn>0&&<div style={{color:P.green,fontSize:11,marginTop:4}}>↑ In: {fmtK(d.totalIn)}</div>}
                {d?.totalOut>0&&(
                  <div style={{color:P.red,fontSize:11}}>
                    ↓ Out: {fmtK(d.totalOut)}
                    {d.totalOut>15000&&<span style={{color:P.gold,marginLeft:4}}>(wages/BAS?)</span>}
                  </div>
                )}
              </div>;
            }}/>
            {viewMode==="combined"?(
              <Area type="monotone" dataKey="totalClose" name="Group Cash"
                stroke={P.teal} fill="url(#cashGrad)" strokeWidth={2}
                strokeDasharray="none"
                dot={(props)=>{
                  const d = chartData[props.index];
                  if (d?.isFuture) return <circle key={props.key} cx={props.cx} cy={props.cy} r={1.5} fill={P.teal} opacity={0.4}/>;
                  if (d?.bigOutflow) return <circle key={props.key} cx={props.cx} cy={props.cy} r={4} fill={P.red} opacity={0.8}/>;
                  return <circle key={props.key} cx={props.cx} cy={props.cy} r={1.5} fill={P.teal} opacity={0.7}/>;
                }}
              />
            ):(
              ["Mt Evelyn","Olinda","Chirnside Park"].map(c=>{
                const key = c==="Chirnside Park"&&!hasCh ? null : `byClinic.${c}.closeBal`;
                const dataKey = c.replace(/\s+/g,"_")+"_close";
                // We need flat data keys; add them
                return (
                  <Area key={c} type="monotone"
                    dataKey={d => {
                      if (c==="Chirnside Park"&&!hasCh) return chBalance;
                      return d?.byClinic?.[c]?.closeBal||null;
                    }}
                    name={c} stroke={CC[c]} fill={`url(#grad_${c.replace(/\s/g,"")})`}
                    strokeWidth={1.5} strokeDasharray="none" dot={false} connectNulls
                  />
                );
              })
            )}
            {/* Today reference line */}
            {todayRow&&<ReferenceLine x={chartData.find(d=>d.isToday||d.date===todayStr)?.label}
              stroke={P.gold} strokeDasharray="4 4"
              label={{value:"Today",fill:P.gold,fontSize:9,position:"insideTopRight"}}/>}
            <ReferenceLine y={0} stroke={P.dim}/>
          </AreaChart>
        </ResponsiveContainer>
      </div>

      {/* Weekly summary table */}
      {(()=>{
        // Group combined data into weeks (Mon–Sun)
        const weeks = [];
        let wk = null;
        for (const d of combined.slice(todayIdx-1, todayIdx+fwdDays+7)) {
          if (!wk || new Date(d.date+"T00:00:00").getDay()===1) {
            if (wk) weeks.push(wk);
            wk = {start:d.date, end:d.date, totalIn:0, totalOut:0, endClose:0};
          }
          wk.end = d.date;
          wk.totalIn  += d.totalIn;
          wk.totalOut += d.totalOut;

        }

                <tbody>
                  {weeks.slice(0,10).map((w,i)=>{
                    const net = w.totalIn - w.totalOut;
                    const fmtD = s => new Date(s+"T00:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short"});
                    const isPast = w.end < todayStr;
                    return (
                      <tr key={i} style={{borderBottom:`1px solid ${P.border}22`,background:isPast?`${P.dim}22`:i%2?`${P.alt}44`:"transparent"}}>

                        <td style={{padding:"9px 14px",textAlign:"right",color:P.red,fontVariantNumeric:"tabular-nums"}}>{fmtK(w.totalOut)}</td>
                        <td style={{padding:"9px 14px",textAlign:"right",color:net>=0?P.green:P.red,fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{net>=0?"+":""}{fmtK(net)}</td>
                        <td style={{padding:"9px 14px",textAlign:"right",color:P.text,fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{fmtK(w.endClose)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </>
        );
      })()}

      {/* Export length mismatch warning */}
      {(()=>{
        if (cfUploads.length < 2) return null;
        const lengths = cfUploads.map(cf=>cf.days.length);
        const maxLen  = Math.max(...lengths);
        const shortClinics = cfUploads.filter(cf=>cf.days.length < maxLen * 0.6);
        if (!shortClinics.length) return null;
        return (
          <div style={{background:`${P.blue}10`,border:`1px solid ${P.blue}44`,borderRadius:10,padding:"12px 16px",display:"flex",alignItems:"flex-start",gap:12,marginBottom:12}}>
            <span style={{color:P.blue,fontSize:14,marginTop:1}}>ℹ</span>
            <div style={{fontSize:12,color:P.muted,lineHeight:1.7}}>
              <strong style={{color:P.text}}>Export range mismatch:</strong>{" "}
              {shortClinics.map(cf=>`${cf.clinic} (${cf.days.length} days)`).join(", ")} {shortClinics.length===1?"has":"have"} a shorter projection window than the other clinics.{" "}
              Re-export from Xero Cash Flow Manager with a <strong style={{color:P.text}}>6-month / 180-day range</strong> to align all three.
              This matters for BAS quarters — a 90–180 day window captures the next 1–2 BAS payments which are your largest irregular cash events.
            </div>
          </div>
        );
      })()}

      {/* Missing clinic notice */}
      {!hasCh&&(
        <div style={{background:`${P.gold}10`,border:`1px solid ${P.gold}44`,borderRadius:10,padding:"12px 16px",display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
          <span style={{color:P.gold,fontSize:14}}>⚠</span>
          <div style={{flex:1,fontSize:12,color:P.muted}}>
            Chirnside Park cash file not loaded — using manual balance of <strong style={{color:P.gold}}>{fmtK(chBalance)}</strong>.
            This is a static offset (no daily projection for Chirnside). Export and drop the Chirnside Cash Flow Manager file to get the full combined view.
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <span style={{fontSize:11,color:P.dim}}>Update balance:</span>
            <input type="number" value={chBalance} onChange={e=>saveChBal(Number(e.target.value))}
              style={{width:90,background:P.alt,border:`1px solid ${P.border}`,color:P.gold,borderRadius:6,padding:"5px 8px",fontSize:12,outline:"none"}}/>
          </div>
        </div>
      )}
      {/* BAS timing reminder */}
      {(()=>{
        const BAS_MONTHS = [1,4,7,10]; // Jan, Apr, Jul, Oct — due ~28th each
        const today = new Date();
        const upcoming = [];
        for (let m=0; m<6; m++) {
          const d = new Date(today.getFullYear(), today.getMonth()+m, 28);
          if (BAS_MONTHS.includes(d.getMonth()+1) && d > today) {
            upcoming.push(d.toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"}));
            if (upcoming.length>=2) break;
          }
        }
        if (!upcoming.length) return null;
        return (
          <div style={{background:`${P.gold}08`,border:`1px solid ${P.gold}33`,borderRadius:10,padding:"12px 16px",marginBottom:12,display:"flex",gap:12,alignItems:"flex-start"}}>
            <span style={{color:P.gold,fontSize:14,marginTop:1}}>📅</span>
            <div style={{fontSize:12,color:P.muted,lineHeight:1.7}}>
              <strong style={{color:P.gold}}>BAS/IAS reminder:</strong>{" "}
              Next BAS due dates: <strong style={{color:P.text}}>{upcoming.join(" · ")}</strong>.{" "}
              These are your largest irregular outflows — ensure a 90–180 day export window so Xero's projection captures them.
              If BAS isn't showing in your cash projection, it hasn't been entered as a bill in Xero — do this manually for an accurate forecast.
            </div>
          </div>
        );
      })()}
      <div style={{fontSize:11,color:P.dim,lineHeight:1.7}}>
        ℹ Data sourced from Xero Cash Flow Manager exports — re-export weekly (90–180 day range) for best accuracy. Red dots on the chart = large outflow days (wages, BAS). Xero projects based on scheduled invoices, bills, and repeating transactions. If BAS isn't reflected in the projection, add it as a bill in Xero.
      </div>
    </div>
  );
}


// ─── AI Assistant ─────────────────────────────────────────────────────────────
function buildFinancialContext(uploads, cfUploads, effectiveOwnerMode) {
  if (!uploads.length) return null;

  const clinics = ["Mt Evelyn","Olinda","Chirnside Park"];
  const quarters = [...new Set(uploads.map(d=>d.quarter))].sort((a,b)=>qKey(a).localeCompare(qKey(b)));

  // Build P&L summary table
  let plLines = ["=== QUARTERLY P&L (all figures in AUD) ===\n"];
  plLines.push(["Quarter","Clinic","Revenue","Gross Profit","OpEx","Net Profit","Adj EBITDA","EBITDA Margin%","Wages","Owner Salary","Owner Super","D&A","Interest"].join("\t"));
  for (const q of quarters) {
    for (const c of clinics) {
      const d = uploads.find(u=>u.clinic===c&&u.quarter===q);
      if (!d) continue;
      const m = computeMetrics(d.accounts, c);
      plLines.push([q,c,
        Math.round(m.revenue), Math.round(m.grossProfit), Math.round(m.opex||0),
        Math.round(m.netProfit), Math.round(m.adjEbitda),
        m.ebitdaMargin.toFixed(1), Math.round(m.wages),
        Math.round(m.ownerSalary), Math.round(m.ownerSuper),
        Math.round(m.da), Math.round(m.interest)
      ].join("\t"));
    }
  }

  // Group totals
  plLines.push("\n=== GROUP QUARTERLY TOTALS ===");
  plLines.push(["Quarter","Total Revenue","Total Adj EBITDA","Group Margin%"].join("\t"));
  for (const q of quarters) {
    let rev=0, ebitda=0;
    for (const c of clinics) {
      const d = uploads.find(u=>u.clinic===c&&u.quarter===q);
      if (!d) continue;
      const m = computeMetrics(d.accounts, c);
      rev+=m.revenue; ebitda+=m.adjEbitda;
    }
    plLines.push([q, Math.round(rev), Math.round(ebitda), rev?(ebitda/rev*100).toFixed(1):"—"].join("\t"));
  }

  // Trailing 4Q annualised per clinic
  plLines.push("\n=== TRAILING 4 QUARTERS (ANNUALISED) ===");
  const last4Q = quarters.slice(-4);
  for (const c of clinics) {
    const t4 = last4Q.reduce((s,q)=>{
      const d=uploads.find(u=>u.clinic===c&&u.quarter===q);
      if(!d) return s;
      const m=computeMetrics(d.accounts,c);
      return {rev:s.rev+m.revenue, ebitda:s.ebitda+m.adjEbitda, ownerCash:s.ownerCash+(m.ownerSalary+m.ownerSuper)};
    },{rev:0,ebitda:0,ownerCash:0});
    plLines.push(`${c}: Revenue $${Math.round(t4.rev).toLocaleString()} | Adj EBITDA $${Math.round(t4.ebitda).toLocaleString()} | Owner drawings $${Math.round(t4.ownerCash).toLocaleString()}`);
  }

  // Owner earnings note
  const totalOwnerSalary = quarters.slice(-4).reduce((s,q)=>{
    return s+clinics.reduce((cs,c)=>{
      const d=uploads.find(u=>u.clinic===c&&u.quarter===q); if(!d) return cs;
      const m=computeMetrics(d.accounts,c); return cs+m.ownerSalary+m.ownerSuper;
    },0);
  },0);
  plLines.push(`\nAnnual owner salary + super (last 4Q): $${Math.round(totalOwnerSalary).toLocaleString()}`);
  plLines.push("Note: Adj EBITDA adds back owner salary, super, D&A, and interest to net profit");
  plLines.push("Note: 'Owner Earnings' = Net Profit + Owner Salary + Owner Super (cash available to owners after tax)");

  // Cash flow section
  let cashLines = ["\n=== CASH FLOW MANAGER (daily, from Xero) ==="];
  if (cfUploads.length) {
    const today = new Date().toISOString().slice(0,10);
    for (const cf of cfUploads) {
      const todayRow = cf.days.find(d=>d.date===today||d.isToday);
      const lastRow = cf.days[cf.days.length-1];
      cashLines.push(`\n${cf.clinic}:`);
      cashLines.push(`  Today's balance: $${Math.round(todayRow?.closeBal||0).toLocaleString()}`);
      cashLines.push(`  Projection end (${lastRow?.date}): $${Math.round(lastRow?.closeBal||0).toLocaleString()}`);
      // Monthly closing balances
      cashLines.push("  Monthly closing balances:");
      const months = {};
      for (const d of cf.days) {
        const mo = d.date.slice(0,7);
        months[mo] = d.closeBal;
      }
      for (const [mo,bal] of Object.entries(months)) {
        cashLines.push(`    ${mo}: $${Math.round(bal).toLocaleString()}`);
      }
      // Big outflow days
      const bigOut = cf.days.filter(d=>d.cashOut>8000).slice(0,10);
      if (bigOut.length) {
        cashLines.push("  Large outflow days (wages/BAS/other):");
        for (const d of bigOut) cashLines.push(`    ${d.date}: $${Math.round(d.cashOut).toLocaleString()} out → balance $${Math.round(d.closeBal).toLocaleString()}`);
      }
    }
    // Combined totals by month
    cashLines.push("\n  === COMBINED GROUP CASH BY MONTH ===");
    const allDates = [...new Set(cfUploads.flatMap(cf=>cf.days.map(d=>d.date)))].sort();
    const groupByMonth = {};
    for (const date of allDates) {
      const mo = date.slice(0,7);
      let total = 0;
      for (const cf of cfUploads) {
        const row = cf.days.find(d=>d.date===date);
        if (row) total += row.closeBal;
      }
      groupByMonth[mo] = total;
    }
    for (const [mo,bal] of Object.entries(groupByMonth)) {
      cashLines.push(`  ${mo}: $${Math.round(bal).toLocaleString()}`);
    }
  } else {
    cashLines.push("No cash flow data loaded.");
  }

  // Business context
  const context = `
You are a financial analyst assistant for Form & Practice, an Australian physiotherapy and Pilates business with three clinic locations: Mt Evelyn, Olinda, and Chirnside Park (Victoria, Australia).

Business structure:
- Mt Evelyn and Chirnside Park operate under the same legal entity (Form & Practice Mt Evelyn Pty Ltd). Chirnside Park only became profitable in FY26.
- Olinda operates as a separate entity (Form & Practice Olinda Pty Ltd)
- Owner operators: Jerry Higgins and Kate Rae. Owner salaries are drawn from Mt Evelyn and Olinda only (not Chirnside).
- General Manager: Ben Croxford
- Accountant: Peter Gillis at ROCG Business Services
- Medfin loans of ~$167k net (studio fit-outs) held under associated entity DRAH — not on F&P books, but relevant for net proceeds in any sale scenario
- Australian financial year: July–September = Q1, October–December = Q2, January–March = Q3, April–June = Q4
- BAS quarters due approximately 28 Oct, 28 Jan, 28 Apr, 28 Jul
- Wages paid fortnightly

Valuation context: Allied health practices typically sell at 3–5× trailing 12-month Adj. EBITDA for an asset sale. Any sale would require repaying Medfin (~$167k) from proceeds.

When answering questions:
- Be direct and specific — use actual dollar figures from the data
- When asked about projections, clearly distinguish between Xero-derived cash flow projections (near-term, based on scheduled transactions) and trend-based estimates (longer-term)
- When asked about EBITDA "adjusted for owner incomes", this means Adj EBITDA which already adds back owner salary and super
- Flag any data limitations clearly (e.g. if cash flow data only goes to a certain date)
- Keep answers concise — 2–4 short paragraphs maximum unless a table is genuinely helpful
- Use Australian dollar formatting

${plLines.join("\n")}
${cashLines.join("\n")}
`.trim();

  return context;
}

function AIAssistant({uploads, cfUploads, ownerMode}) {
  const [messages, setMessages] = useState([]);
  const [input, setInput]       = useState("");
  const [loading, setLoading]   = useState(false);
  const [apiKey, setApiKey]     = useState(()=>localStorage.getItem("fp_ai_key")||"");
  const [showKeyInput, setShowKeyInput] = useState(false);
  const [error, setError]       = useState(null);
  const bottomRef               = useRef();

  const saveKey = k => { setApiKey(k); localStorage.setItem("fp_ai_key",k); };

  const SUGGESTED = [
    "What is our projected group cash balance in July 2026?",
    "What is our predicted EBITDA adjusted for owner salaries across all three clinics?",
    "Which clinic has the best EBITDA margin trend?",
    "What would our indicative business valuation be at 3× and 4× EBITDA?",
    "Where are the biggest cash flow risks in the next 90 days?",
    "How much CAPEX could we service if we were acquiring a new site?",
  ];

  const send = async (text) => {
    const q = (text||input).trim();
    if (!q || loading) return;
    if (!apiKey) { setShowKeyInput(true); return; }

    const context = buildFinancialContext(uploads, cfUploads, effectiveOwnerMode);
    if (!context) { setError("Load your Xero files first, then ask questions."); return; }

    setInput("");
    setError(null);
    const newMessages = [...messages, {role:"user",content:q}];
    setMessages(newMessages);
    setLoading(true);

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body: JSON.stringify({
          model:"claude-opus-4-5",
          max_tokens:1024,
          system: context,
          messages: newMessages.map(m=>({role:m.role,content:m.content})),
        })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const reply = data.content?.[0]?.text || "No response";
      setMessages(prev=>[...prev,{role:"assistant",content:reply}]);
    } catch(e) {
      setError("API error: "+e.message);
      setMessages(prev=>prev.slice(0,-1));
    } finally {
      setLoading(false);
      setTimeout(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),100);
    }
  };

  const hasData = uploads.length > 0;

  return (
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 180px)",minHeight:500}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:16,fontWeight:700,color:P.text}}>AI Financial Assistant</div>
          <div style={{fontSize:12,color:P.muted,marginTop:2}}>
            Ask questions about your loaded data in plain English
            {!hasData&&<span style={{color:P.gold,marginLeft:6}}>— load your Xero files first</span>}
          </div>
        </div>
        <button onClick={()=>setShowKeyInput(v=>!v)}
          style={{background:apiKey?`${P.green}15`:P.alt,border:`1px solid ${apiKey?P.green:P.border}`,color:apiKey?P.green:P.muted,borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:12,fontWeight:600}}>
          {apiKey?"✓ API key set":"⚙ Set API key"}
        </button>
      </div>

      {/* API key input */}
      {showKeyInput&&(
        <div style={{background:P.alt,border:`1px solid ${P.border}`,borderRadius:10,padding:"16px 18px",marginBottom:14}}>
          <div style={{fontSize:12,color:P.muted,marginBottom:8,lineHeight:1.6}}>
            Enter your <strong style={{color:P.text}}>Anthropic API key</strong> — stored locally in your browser, never sent anywhere except Anthropic's API.<br/>
            Get one at <span style={{color:P.blue}}>console.anthropic.com</span> → API Keys → Create key. Usage billed at standard rates (~$0.01–0.03 per question).
          </div>
          <div style={{display:"flex",gap:8}}>
            <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)}
              placeholder="sk-ant-..."
              style={{flex:1,background:P.surface,border:`1px solid ${P.border}`,color:P.text,borderRadius:7,padding:"8px 12px",fontSize:13,outline:"none",fontFamily:"monospace"}}/>
            <button onClick={()=>{saveKey(apiKey);setShowKeyInput(false);}}
              style={{background:P.blue,border:"none",color:"white",borderRadius:7,padding:"8px 16px",cursor:"pointer",fontSize:13,fontWeight:600}}>
              Save
            </button>
          </div>
        </div>
      )}

      {/* Suggested questions */}
      {messages.length===0&&(
        <div style={{marginBottom:16}}>
          <div style={{fontSize:11,color:P.muted,marginBottom:8,textTransform:"uppercase",letterSpacing:1,fontWeight:600}}>Suggested questions</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {SUGGESTED.map((s,i)=>(
              <button key={i} onClick={()=>send(s)}
                style={{background:P.surface,border:`1px solid ${P.border}`,color:P.text,borderRadius:20,padding:"7px 14px",cursor:"pointer",fontSize:12,textAlign:"left",transition:"all 0.15s"}}
                onMouseOver={e=>e.currentTarget.style.borderColor=P.gold}

      {/* Message thread */}

              padding:"12px 16px",fontSize:13,lineHeight:1.65,

            }}>
              {m.role==="assistant"&&(
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6,paddingBottom:6,borderBottom:`1px solid ${P.border}`}}>
                  <div style={{width:20,height:20,borderRadius:"50%",background:P.gold,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"white",fontWeight:700}}>AI</div>
                  <span style={{fontSize:11,color:P.muted,fontWeight:600}}>F&P Financial Assistant</span>
                </div>
              )}
              {m.content}
            </div>
          </div>
        ))}
        {loading&&(
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 16px",background:P.surface,border:`1px solid ${P.border}`,borderRadius:"16px 16px 16px 4px",width:"fit-content"}}>
            <div style={{display:"flex",gap:4}}>
              {[0,1,2].map(i=>(
                <div key={i} style={{width:6,height:6,borderRadius:"50%",background:P.gold,
                  animation:`pulse 1.2s ease-in-out ${i*0.2}s infinite`}}/>
              ))}
            </div>
            <span style={{fontSize:12,color:P.muted}}>Analysing your data…</span>
          </div>
        )}
        {error&&(
          <div style={{background:`${P.red}10`,border:`1px solid ${P.red}44`,borderRadius:10,padding:"10px 14px",fontSize:12,color:P.red}}>
            {error}
          </div>
        )}
        <div ref={bottomRef}/>
      </div>

      {/* Input */}
      <div style={{display:"flex",gap:8,background:P.surface,border:`1px solid ${P.border}`,borderRadius:12,padding:"8px 8px 8px 14px",alignItems:"flex-end"}}>
        <textarea value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
          placeholder={hasData?"Ask anything about your financials — cash, EBITDA, trends, valuations…":"Load your Xero P&L files first, then ask questions"}
          rows={2} disabled={!hasData||loading}
          style={{flex:1,background:"transparent",border:"none",color:P.text,fontSize:13,resize:"none",outline:"none",lineHeight:1.5,padding:"4px 0",fontFamily:"inherit"}}/>
        <button onClick={()=>send()} disabled={!input.trim()||loading||!hasData}
          style={{background:input.trim()&&!loading&&hasData?P.gold:"#E2E2DC",border:"none",color:input.trim()&&!loading&&hasData?"white":P.muted,borderRadius:8,padding:"9px 16px",cursor:input.trim()&&!loading&&hasData?"pointer":"not-allowed",fontSize:13,fontWeight:700,transition:"all 0.15s",flexShrink:0}}>
          {loading?"…":"Ask →"}
        </button>
      </div>
      {messages.length>0&&(
        <button onClick={()=>setMessages([])} style={{background:"none",border:"none",color:P.muted,fontSize:11,cursor:"pointer",marginTop:8,textAlign:"center"}}>
          Clear conversation
        </button>
      )}
      <style>{`@keyframes pulse{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1)}}`}</style>
    </div>
  );
}
