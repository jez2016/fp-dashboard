  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #003B49; font-family: 'DM Sans', sans-serif; }
    #root { min-height: 100%; }
    #login-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: #003B49;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      transition: opacity 0.4s ease;
    }
    #login-screen.fade-out { opacity: 0; pointer-events: none; }
    .login-card { background: #fff; border-radius: 20px; padding: 48px 52px; width: 360px; text-align: center; box-shadow: 0 32px 80px rgba(0,0,0,0.35); }
    .login-logo { font-family: 'DM Serif Display', serif; font-size: 26px; color: #003B49; margin-bottom: 4px; letter-spacing: -0.5px; }
    .login-subtitle { font-size: 12px; color: #6F7C7C; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 36px; }
    .pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 28px; }
    .pin-dot { width: 16px; height: 16px; border-radius: 50%; background: #E2E2DC; border: 2px solid #C8D6EB; transition: all 0.15s ease; }
    .pin-dot.filled { background: #003B49; border-color: #003B49; transform: scale(1.15); }
    .pin-dot.error { background: #F26439; border-color: #F26439; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .key { background: #f8fafb; border: 1.5px solid #E2E2DC; border-radius: 12px; height: 52px; font-size: 20px; font-weight: 600; color: #003B49; cursor: pointer; transition: all 0.1s ease; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; user-select: none; }
    .key:hover { background: #E2E2DC; border-color: #003B49; }
    .key:active { background: #C8D6EB; transform: scale(0.94); }
    .key.del { font-size: 15px; color: #6F7C7C; }
    .key.zero { grid-column: 2; }
    .login-error { color: #F26439; font-size: 13px; min-height: 20px; margin-top: 4px; font-weight: 500; }
    .login-hint { font-size: 11px; color: #6F7C7C; margin-top: 16px; }
    .modal-overlay { position: fixed; inset: 0; z-index: 10000; background: rgba(0,59,73,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; }
    .modal-card { background: #fff; border-radius: 16px; padding: 36px 40px; width: 400px; box-shadow: 0 24px 60px rgba(0,0,0,0.3); }
    .modal-title { font-family: 'DM Serif Display', serif; font-size: 20px; color: #003B49; margin-bottom: 6px; }
    .modal-sub { font-size: 13px; color: #6F7C7C; margin-bottom: 24px; }
    .modal-input { width: 100%; border: 1.5px solid #E2E2DC; border-radius: 10px; padding: 12px 14px; font-size: 20px; letter-spacing: 8px; color: #003B49; font-family: 'DM Sans', sans-serif; text-align: center; outline: none; margin-bottom: 12px; box-sizing: border-box; }
    .modal-input:focus { border-color: #003B49; }
    .modal-btn { width: 100%; padding: 13px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-bottom: 8px; transition: all 0.15s; }
    .modal-btn.primary { background: #003B49; color: #fff; }
    .modal-btn.primary:hover { background: #004d5f; }
    .modal-btn.secondary { background: #E2E2DC; color: #003B49; }
    .modal-status { font-size: 12px; text-align: center; min-height: 18px; margin-top: 4px; }
    @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } #login-screen { display: none !important; } button { display: none !important; } }

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Form &amp; Practice</div>
    <div class="login-subtitle">Financial Dashboard</div>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="keypad">
      <button class="key" onclick="pressKey('1')">1</button>
      <button class="key" onclick="pressKey('2')">2</button>
      <button class="key" onclick="pressKey('3')">3</button>
      <button class="key" onclick="pressKey('4')">4</button>
      <button class="key" onclick="pressKey('5')">5</button>
      <button class="key" onclick="pressKey('6')">6</button>
      <button class="key" onclick="pressKey('7')">7</button>
      <button class="key" onclick="pressKey('8')">8</button>
      <button class="key" onclick="pressKey('9')">9</button>
      <button class="key zero" onclick="pressKey('0')">0</button>
      <button class="key del" onclick="pressDelete()">&#9003;</button>
    </div>
    <div class="login-error" id="login-error"></div>
    <div class="login-hint">Enter your 4-digit PIN</div>
  </div>
</div>

<div id="root" style="display:none"></div>

<div class="modal-overlay" id="pin-modal" style="display:none">
  <div class="modal-card">
    <div class="modal-title">Change Dashboard PIN</div>
    <div class="modal-sub">Enter a new 4-digit PIN. A new file will download — upload it to GitHub as index.html.</div>
    <input class="modal-input" type="password" inputmode="numeric" maxlength="4" id="new-pin-input" placeholder="····" oninput="this.value=this.value.replace(/\D/g,'').slice(0,4)"/>
    <input class="modal-input" type="password" inputmode="numeric" maxlength="4" id="confirm-pin-input" placeholder="····" oninput="this.value=this.value.replace(/\D/g,'').slice(0,4)"/>
    <button class="modal-btn primary" onclick="doChangePin()">Generate New Dashboard File</button>
    <button class="modal-btn secondary" onclick="closePinModal()">Cancel</button>
    <div class="modal-status" id="pin-modal-status"></div>
  </div>
</div>

<script>
const SALT = new Uint8Array([70,38,80,68,65,83,72,50,48,50,54,75,77,82,74,72]);

async function pinToKey(pin) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:SALT, iterations:200000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']
  );
}

async function encryptData(pin, plaintext) {
  const key = await pinToKey(pin);
  const iv  = crypto.getRandomValues(new Uint8Array(12));
  const ct  = await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, new TextEncoder().encode(plaintext));
  const combined = new Uint8Array(iv.byteLength + ct.byteLength);
  combined.set(iv, 0); combined.set(new Uint8Array(ct), iv.byteLength);
  // Safe loop — spread operator blows call stack on large buffers
  let binary = '';
  for (let i = 0; i < combined.length; i++) binary += String.fromCharCode(combined[i]);
  return btoa(binary);
}

async function decryptData(pin, b64) {
  try {
    const key = await pinToKey(pin);
    const combined = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
    const iv = combined.slice(0,12);
    const ct = combined.slice(12);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, ct);
    return new TextDecoder().decode(pt);
  } catch(e) { return null; }
}

let pinBuffer = '', attempts = 0, lockoutUntil = 0;

function pressKey(d) {
  if (Date.now() < lockoutUntil) return;
  if (pinBuffer.length >= 4) return;
  pinBuffer += d;
  updateDots();
  if (pinBuffer.length === 4) setTimeout(tryUnlock, 80);
}
function pressDelete() {
  pinBuffer = pinBuffer.slice(0,-1);
  updateDots();
  document.getElementById('login-error').textContent = '';
}
function updateDots() {
  for (let i=0;i<4;i++) {
    const d = document.getElementById('d'+i);
    d.className = 'pin-dot' + (i < pinBuffer.length ? ' filled' : '');
  }
}

async function tryUnlock() {
  if (Date.now() < lockoutUntil) return;
  const pin = pinBuffer;
  pinBuffer = ''; updateDots();

  // Try owner PIN first
  let plaintext = await decryptData(pin, ENCRYPTED_PAYLOAD);
  let isManager = false;

  // Try manager PIN if owner failed and a manager payload exists
  if (!plaintext && MANAGER_PAYLOAD !== '__MANAGER_PAYLOAD__') {
    plaintext = await decryptData(pin, MANAGER_PAYLOAD);
    if (plaintext) isManager = true;
  }

  if (plaintext) {
    attempts = 0;
    window._fp_pin        = pin;
    window._fp_data       = JSON.parse(plaintext);
    window._fp_manager    = isManager;
    unlockDashboard();
  } else {
    attempts++;
    showPinError(attempts);
  }
}

function showPinError(n) {
  document.querySelectorAll('.pin-dot').forEach(d => {
    d.classList.add('error');
    setTimeout(()=>d.classList.remove('error'), 600);
  });
  if (n >= 5) {
    lockoutUntil = Date.now() + 30000;
    document.getElementById('login-error').textContent = 'Too many attempts — wait 30 seconds';
    setTimeout(()=>{ document.getElementById('login-error').textContent=''; attempts=0; }, 30000);
  } else {
    document.getElementById('login-error').textContent = 'Incorrect PIN';
    setTimeout(()=>document.getElementById('login-error').textContent='', 1500);
  }
}

function unlockDashboard() {
  const screen = document.getElementById('login-screen');
  screen.classList.add('fade-out');
  setTimeout(() => {
    screen.style.display = 'none';
    document.getElementById('root').style.display = 'block';
    document.body.style.background = '#f8fafc';
    if (!window._dashboardLoaded) {
      window._dashboardLoaded = true;
      loadDashboard();
    }
  }, 400);
}

function openPinModal() {
  document.getElementById('pin-modal').style.display = 'flex';
  document.getElementById('new-pin-input').value = '';
  document.getElementById('confirm-pin-input').value = '';
  document.getElementById('pin-modal-status').textContent = '';
}
function closePinModal() {
  document.getElementById('pin-modal').style.display = 'none';
}

async function doChangePin() {
  const np = document.getElementById('new-pin-input').value.trim();
  const cp = document.getElementById('confirm-pin-input').value.trim();
  const status = document.getElementById('pin-modal-status');
  if (np.length !== 4 || !/^\d{4}$/.test(np)) { status.style.color='#F26439'; status.textContent='PIN must be 4 digits'; return; }
  if (np !== cp) { status.style.color='#F26439'; status.textContent='PINs do not match'; return; }
  status.style.color='#6F7C7C'; status.textContent='Encrypting…';
  try {
    const newPayload = await encryptData(np, JSON.stringify(window._fp_data));
    const res = await fetch(window.location.href);
    let src = await res.text();
    src = src.replace(/const ENCRYPTED_PAYLOAD = '[^']*';/, `const ENCRYPTED_PAYLOAD = '${newPayload}';`);
    const blob = new Blob([src],{type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='fp-dashboard.html'; a.click();
    URL.revokeObjectURL(url);
    status.style.color='#059669'; status.textContent='✓ Downloaded — upload to GitHub as index.html';
    window._fp_pin = np;
  } catch(e) { status.style.color='#F26439'; status.textContent='Error: '+e.message; }
}

document.addEventListener('keydown', e=>{
  if (e.key>='0'&&e.key<='9') pressKey(e.key);
  if (e.key==='Backspace') pressDelete();
});

// ── Called by unlockDashboard — evals pre-compiled JS directly ──
function loadDashboard() {
  const code = document.getElementById('dashboard-code').textContent;
  eval(code);
  // eval redefines loadDashboard to the inner version — call it now
  loadDashboard();
}
</script>

// ─── Quarter label parser ─────────────────────────────────────────────────────
// "Oct-Dec 2025" → "Q2 FY26",  "Jul-Sept 2025" → "Q1 FY26", etc.
function colHeaderToQuarter(s) {
  if (!s || typeof s !== "string") return null;
  const m = s.match(/(\w+)\s*[-–]\s*\w*\s*(\d{4})/) || s.match(/(\w+)\s+(\d{4})/);
  if (!m) return null;
  const endMonth = s.match(/[-–]\s*(\w+)\s+(\d{4})/);
  const mon = endMonth ? endMonth[1].toLowerCase().slice(0, 3) : m[1].toLowerCase().slice(0, 3);
  const yr = parseInt(endMonth ? endMonth[2] : m[2]);
  const MAP = {
    sep: ["Q1", 1],
    dec: ["Q2", 1],
    mar: ["Q3", 0],
    jun: ["Q4", 0]
  };
  // Handle "Sept" → "sep"
  const key = mon === "sep" || mon === "sep" ? "sep" : mon;
  const hit = MAP[key];
  if (!hit) return null;
  return `Q${hit[0][1]} FY${String(yr + hit[1]).slice(2)}`;
}
function detectClinic(s) {
  if (!s) return null;
  for (const [rx, name] of CLINIC_NAME_MAP) if (rx.test(String(s))) return name;
  return null;
}
function qKey(q) {
  const m = q?.match(/Q(\d)\s*FY(\d+)/);
  return m ? `FY${m[2]}-Q${m[1]}` : q || "";

    if (clinic) break;

  // Find header row (contains "Account" in col 0)
  let headerRowIdx = -1;

          Feb: 1,
          Mar: 2,
          Apr: 3,
          May: 4,
          Jun: 5,
          Jul: 6,
          Aug: 7,
          Sep: 8,
          Oct: 9,
          Nov: 10,
          Dec: 11

      cashIn,
      cashOut,
      netMove,
      closeBal,
      isToday

    clinic: clinic || "Unknown",
    days

      if (!d) return s;

      ebitda: 0,
