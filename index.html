// ─── Constants ────────────────────────────────────────────────────────────────
const CLINICS = ["Mt Evelyn", "Olinda", "Chirnside Park"];
const OWNER_SALARY_CLINICS = ["Mt Evelyn", "Olinda"];

const CLINIC_NAME_MAP = [[/mt\s*evelyn/i,"Mt Evelyn"],[/olinda/i,"Olinda"],[/chirnside/i,"Chirnside Park"]];

// Account classification patterns
const OWNER_RX    = [/^owners?\s*salary/i,/^owners?\s*super/i,/jerome\s*higgins/i,/kate\s*rae/i,/jerry\s*higgins/i,/owners?\s*salary\s*[-–]\s*(kate|jerome|jerry)/i,/owners?\s*superannuation\s*[-–]\s*(kate|jerome|jerry)/i];
const DA_RX       = [/depreciation/i,/amortis/i,/amortiz/i,/eofy\s*adj.*depn/i,/depn/i];
const INTEREST_RX = [/^interest\s*expense/i,/^loan\s*interest/i,/^finance\s*charge/i];
const INTERCO_RX  = [/^chirnside\s*wages/i,/^chirnside\s*super/i];
// Exclude entirely — not operating expenses
const EXCLUDE_RX  = [/^dividends?\s*paid/i,/^income\s*tax\s*expense/i];
// Flag as non-recurring
const NONRECUR_RX = [/^management\s*fees?/i,/^eofy\s*adj/i,/^minor\s*fit\s*out/i,/^practice\s*set\s*up/i];

const P = {
  bg:"#f8fafc", surface:"#ffffff", alt:"#E2E2DC", border:"#0f172a",
  gold:"#b45309", goldL:"#d97706", green:"#059669", red:"#dc2626",
  blue:"#2563eb", purple:"#7c3aed", orange:"#ea580c", teal:"#0d9488",
  text:"#0f172a", muted:"#64748b", dim:"#cbd5e1",
};
const CC = {"Mt Evelyn":"#003B49","Olinda":"#F26439","Chirnside Park":"#6F7C7C"};
const SVC_COLORS = {
  "Physiotherapy Revenue":P.blue,"Clinical Classes":P.green,
  "Reformer Pilates":P.purple,"Massage Revenue":P.orange,
  "Retail Sales":P.gold,"Sales":P.gold,"Other Revenue":P.teal,

// ─── Quarter label parser ─────────────────────────────────────────────────────
// "Oct-Dec 2025" → "Q2 FY26",  "Jul-Sept 2025" → "Q1 FY26", etc.
function colHeaderToQuarter(s) {
  if (!s || typeof s !== "string") return null;
  const m = s.match(/(\w+)\s*[-–]\s*\w*\s*(\d{4})/) || s.match(/(\w+)\s+(\d{4})/);
  if (!m) return null;
  const endMonth = s.match(/[-–]\s*(\w+)\s+(\d{4})/);
  const mon  = endMonth ? endMonth[1].toLowerCase().slice(0,3) : m[1].toLowerCase().slice(0,3);
  const yr   = parseInt(endMonth ? endMonth[2] : m[2]);
  const MAP  = { sep:["Q1",1], dec:["Q2",1], mar:["Q3",0], jun:["Q4",0] };
  // Handle "Sept" → "sep"
  const key  = mon === "sep" || mon === "sep" ? "sep" : mon;
  const hit  = MAP[key];
  if (!hit) return null;
  return `Q${hit[0][1]} FY${String(yr + hit[1]).slice(2)}`;
}

function detectClinic(s) {
  if (!s) return null;
  for (const [rx,name] of CLINIC_NAME_MAP) if (rx.test(String(s))) return name;
  return null;
}

function qKey(q) {
  const m = q?.match(/Q(\d)\s*FY(\d+)/);
  return m ? `FY${m[2]}-Q${m[1]}` : (q||"");
}

// ─── Multi-column Xero parser ─────────────────────────────────────────────────
// Returns array of { clinic, quarter, accounts } — one per column
function parseXeroMultiCol(arrayBuf) {
  const wb   = XLSX.read(new Uint8Array(arrayBuf), { type:"array" });
  const ws   = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null });

  // Detect clinic from header rows
  let clinic = null;
  for (let i = 0; i < Math.min(5, rows.length); i++) {
    for (const cell of rows[i]) {
      const c = detectClinic(cell);
      if (c) { clinic = c; break; }
    }
    if (clinic) break;
  }

  // Find header row (contains "Account" in col 0)
  let headerRowIdx = -1;
  for (let i = 0; i < rows.length; i++) {
    if (String(rows[i][0]||"").trim().toLowerCase() === "account") { headerRowIdx = i; break; }
  }
  if (headerRowIdx === -1) return [];

  // Parse quarter labels from header row
  const headerRow = rows[headerRowIdx];
  const quarters  = [];
  for (let col = 1; col < headerRow.length; col++) {
    const q = colHeaderToQuarter(String(headerRow[col]||""));
    quarters.push(q);  // may be null for empty cols
  }

  // Build one account map per quarter column
  const numCols = quarters.length;
  const accountsByCol = Array.from({length: numCols}, () => ({}));
  let section = "income";

  for (let ri = headerRowIdx + 1; ri < rows.length; ri++) {
    const row   = rows[ri];
    const label = String(row[0]||"").trim();
    if (!label) continue;

    const low = label.toLowerCase();
    // Section detection
    if (low.match(/^trading income/))       { section="income"; continue; }
    if (low.match(/^other income/))         { section="other";  continue; }
    if (low.match(/^cost of (sales|goods)/)) { section="cogs";  continue; }
    if (low.match(/^gross profit/))         continue;
    if (low.match(/^operating expenses?/))  { section="opex";  continue; }
    if (low.match(/^(total\b|net profit|net loss)/)) continue;
    if (label.match(/^Total /i))            continue;

    // Exclusions — completely skip these rows
    if (EXCLUDE_RX.some(r=>r.test(label))) continue;

    const isInterco  = INTERCO_RX.some(r=>r.test(label));
    const isNonRecur = NONRECUR_RX.some(r=>r.test(label));

    // Read value for each column
    for (let col = 0; col < numCols; col++) {
      const raw = row[col + 1];
      if (raw === null || raw === undefined) continue;
      if (typeof raw === "string" && raw.startsWith("=")) continue;
      const val = typeof raw === "number" ? raw : parseFloat(String(raw).replace(/[$,\s]/g,""));
      if (isNaN(val) || val === 0) continue;

      const key = label.replace(/\W+/g,"_").toLowerCase() + "_" + col;
      accountsByCol[col][key] = { name:label, val, section, isInterco, isNonRecur };
    }
  }

  // Return one record per valid quarter
  return quarters.map((q, i) => {
    if (!q || !clinic) return null;
    const acctCount = Object.keys(accountsByCol[i]).length;
    if (acctCount === 0) return null;
    return { clinic, quarter:q, accounts:accountsByCol[i] };
  }).filter(Boolean);
}

// ─── Metrics ─────────────────────────────────────────────────────────────────
function classify(name, isInterco) {
  if (isInterco)                          return "interco";
  if (OWNER_RX.some(r=>r.test(name)))     return "owner";
  if (DA_RX.some(r=>r.test(name)))        return "da";
  if (INTEREST_RX.some(r=>r.test(name)))  return "interest";
  if (NONRECUR_RX.some(r=>r.test(name)))  return "nonrecur";
  return "normal";
}

function computeMetrics(accounts, clinic) {
  let revenue=0, otherIncome=0, cogs=0, opex=0;
  let ownerSalary=0, ownerSuper=0, da=0, interest=0, interco=0, wages=0, nonRecur=0;
  const expenseDetail=[], incomeDetail=[];

  for (const acct of Object.values(accounts)) {
    const cls = classify(acct.name, acct.isInterco);

    if (acct.section==="income") {
      const v=Math.abs(acct.val); revenue+=v;
      incomeDetail.push({name:acct.name, val:v});
    } else if (acct.section==="other") {
      otherIncome+=Math.abs(acct.val);
    } else if (acct.section==="cogs") {
      cogs+=Math.abs(acct.val);
    } else if (acct.section==="opex") {
      if (cls==="interco") {
        interco+=acct.val;
        expenseDetail.push({name:acct.name, val:acct.val, cls});
        continue;
      }
      const v=Math.abs(acct.val);
      if (cls==="owner" && OWNER_SALARY_CLINICS.includes(clinic)) {
        /super/i.test(acct.name) ? ownerSuper+=v : ownerSalary+=v;
      } else if (cls==="da")       { da+=v; }
        else if (cls==="interest") { interest+=v; }
        else if (cls==="nonrecur") { nonRecur+=v; }
        else { opex+=v; }
      // Owner and nonrecur still count in opex for net profit calc
      if (cls==="owner"||cls==="da"||cls==="interest"||cls==="nonrecur") opex+=v;
      if (/^wages|^salaries/i.test(acct.name) && cls==="normal") wages+=v;
      expenseDetail.push({name:acct.name, val:v, cls});
    }
  }

  const grossProfit = revenue - cogs;
  // Interco credits (negative = MTE reimbursed by Chirnside) are genuine income — include them.
  // Interco expenses (positive) remain excluded to avoid double-counting.
  const netProfit   = grossProfit + otherIncome - opex - Math.min(0, interco);
  const ebitda      = netProfit + interest + da;
  const adjEbitda   = ebitda + ownerSalary + ownerSuper + nonRecur;  // nonRecur = mgmt fees, one-off related-party

  const ownerEarnings   = netProfit + ownerSalary + ownerSuper;
  const revenuePerWage  = wages > 0 ? revenue / wages : null;
  return {
    revenue, otherIncome, cogs, grossProfit, opex, netProfit,
    ownerSalary, ownerSuper, da, interest, interco, wages, nonRecur,
    ebitda, adjEbitda, ownerEarnings, revenuePerWage,
    valuationLow: adjEbitda*3, valuationHigh: adjEbitda*5,
    expenseDetail, incomeDetail,
    ebitdaMargin: revenue ? (adjEbitda/revenue)*100 : 0,
    gpMargin:     revenue ? (grossProfit/revenue)*100 : 0,
    wageRatio:    revenue ? (wages/revenue)*100 : 0,
    opexRatio:    revenue ? (opex/revenue)*100 : 0,
  };
}

// ─── Formatting ───────────────────────────────────────────────────────────────
const fmt  = (n,d=0) => new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD",minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0);
const fmtK = n => Math.abs(n)>=1e6?`$${(n/1e6).toFixed(1)}M`:Math.abs(n)>=1e3?`$${(n/1e3).toFixed(0)}k`:fmt(n);
const pct  = (a,b) => b?((a/b)*100).toFixed(1)+"%":"—";

const TT = ({active,payload,label}) => {

};

// ─── Drop zone ────────────────────────────────────────────────────────────────
function DropZone({onPL, onCash}) {
  const [drag,setDrag] = useState(false);
  const ref = useRef();
  const process = useCallback(async (fileList) => {
    const plResults=[], cfResults=[];
    for (const file of Array.from(fileList)) {
      if (!file.name.match(/\.xlsx?$/i)) continue;
      try {
        const buf = await file.arrayBuffer();
        // Cash manager files: match "cash" anywhere in filename
        const isCash = /cash/i.test(file.name);
        if (isCash) {
          const cf = parseXeroCashManager(buf);
          if (cf) cfResults.push(cf);
        } else {
          const parsed = parseXeroMultiCol(buf);
          plResults.push(...parsed);
        }
      } catch(e) { console.warn(file.name, e); }
    }
    if (plResults.length && onPL) onPL(plResults);
    if (cfResults.length && onCash) onCash(cfResults);
  }, [onPL, onCash]);

  return (
    <div onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)}
      onDrop={e=>{e.preventDefault();setDrag(false);process(e.dataTransfer.files)}}
      onClick={()=>ref.current.click()}
      style={{border:`2px dashed ${drag?P.gold:P.border}`,borderRadius:12,padding:"26px 24px",textAlign:"center",cursor:"pointer",background:drag?`${P.gold}10`:P.surface,transition:"all 0.2s"}}>
      <div style={{fontSize:26,marginBottom:8,opacity:0.5}}>📂</div>
      <div style={{fontSize:14,color:P.muted,marginBottom:3}}>Drop your Xero files here — P&amp;L and Cash Flow Manager files accepted</div>
      <div style={{fontSize:12,color:P.dim}}>Files with "cash" in the filename go to the Cash Flow tab · everything else loads as P&amp;L</div>
      <input ref={ref} type="file" accept=".xlsx,.xls" multiple style={{display:"none"}} onChange={e=>process(e.target.files)}/>
    </div>
  );
}

// ─── Flags ────────────────────────────────────────────────────────────────────
function makeFlags(m, clinic, quarter, allUploads) {
  const flags = [];

  if (m.ebitdaMargin < 10)
    flags.push({type:"risk", msg:`Adj. EBITDA margin is ${m.ebitdaMargin.toFixed(1)}% — below the 10–15% threshold typical for viable physio clinics.`});
  else if (m.ebitdaMargin > 25)
    flags.push({type:"upside", msg:`Strong Adj. EBITDA margin of ${m.ebitdaMargin.toFixed(1)}% — well above sector median, positive for valuation.`});

  if (m.wageRatio > 55 && m.wages > 0)
    flags.push({type:"risk", msg:`Wages-to-revenue ratio is ${m.wageRatio.toFixed(1)}%. Allied health benchmark is typically 45–55%. Review staffing mix and practitioner utilisation.`});

  if (m.ownerSalary===0 && OWNER_SALARY_CLINICS.includes(clinic))
    flags.push({type:"warn", msg:`No owner salary detected for ${clinic}. Confirm with bookkeeper that Jerome/Kate drawings are correctly coded.`});

  if (m.ownerSalary>0 && m.ownerSuper===0 && OWNER_SALARY_CLINICS.includes(clinic))
    flags.push({type:"warn", msg:`Owner salary found (${fmt(m.ownerSalary)}) but no separate owner super account. ~${fmt(m.ownerSalary*0.115)} is likely pooled in the Superannuation line — ask bookkeeper to split it. This understates Adj. EBITDA.`});

  if (Math.abs(m.interco)>500)
    flags.push({type:"info", msg:`Chirnside Wages recharge of ${fmt(Math.abs(m.interco))} detected. Credit kept in EBITDA (MTE receives this from Chirnside). Confirm offsetting entry in Chirnside Park file.`});

  if (m.da>0)
    flags.push({type:"info", msg:`D&A of ${fmt(m.da)} detected this quarter. This is likely a year-end journal (EOFY ADJ). For inter-quarter comparisons, consider spreading it across 4 quarters (~${fmt(m.da/4)}/quarter).`});

  if (m.nonRecur>0)
    flags.push({type:"warn", msg:`Non-recurring / one-off items of ${fmt(m.nonRecur)} detected (e.g. Management Fees, fit-out costs). Excluded from normalised EBITDA above. Verify these are genuine one-offs before including in valuation EBITDA.`});

  if (m.adjEbitda>0)
    flags.push({type:"upside", msg:`Indicative valuation: ${fmt(m.valuationLow)} – ${fmt(m.valuationHigh)} (3–5× annualised Adj. EBITDA of ${fmt(m.adjEbitda*4)}).`});

  // QoQ
  const prev = allUploads.filter(d=>d.clinic===clinic&&d.quarter!==quarter).sort((a,b)=>qKey(a.quarter).localeCompare(qKey(b.quarter)));
  if (prev.length>0) {
    const lm = computeMetrics(prev[prev.length-1].accounts, clinic);
    const rc = lm.revenue?((m.revenue-lm.revenue)/lm.revenue)*100:0;
    if (Math.abs(rc)>10)
      flags.push({type:rc>0?"upside":"risk", msg:`Revenue ${rc>0?"up":"down"} ${Math.abs(rc).toFixed(1)}% vs ${prev[prev.length-1].quarter}. ${rc<0?"Investigate patient volume or fee schedule changes.":"Strong growth — check capacity and practitioner utilisation."}`});
    const em = lm.revenue?(lm.adjEbitda/lm.revenue)*100:0;
    const ed = m.ebitdaMargin-em;
    if (Math.abs(ed)>3)
      flags.push({type:ed>0?"upside":"risk", msg:`EBITDA margin ${ed>0?"improved":"deteriorated"} ${Math.abs(ed).toFixed(1)}pp vs ${prev[prev.length-1].quarter} (${em.toFixed(1)}% → ${m.ebitdaMargin.toFixed(1)}%).`});
  }

  return flags;
}

// ─── GM Report ────────────────────────────────────────────────────────────────
function GMReport({uploads}) {
  const quarters = [...new Set(uploads.map(d=>d.quarter))].sort((a,b)=>qKey(a).localeCompare(qKey(b)));
  const lq = quarters[quarters.length-1];
  const pq = quarters[quarters.length-2];

  const cms = CLINICS.map(c=>{const d=uploads.find(u=>u.clinic===c&&u.quarter===lq);return d?{clinic:c,...computeMetrics(d.accounts,c)}:null;}).filter(Boolean);
  const tot = cms.reduce((a,m)=>({rev:a.rev+m.revenue,ebitda:a.ebitda+m.adjEbitda,opex:a.opex+m.opex,net:a.net+m.netProfit,gp:a.gp+m.grossProfit}),{rev:0,ebitda:0,opex:0,net:0,gp:0});
  const ptot = pq?CLINICS.reduce((a,c)=>{const d=uploads.find(u=>u.clinic===c&&u.quarter===pq);if(!d)return a;const m=computeMetrics(d.accounts,c);return{rev:a.rev+m.revenue,ebitda:a.ebitda+m.adjEbitda};},{rev:0,ebitda:0}):null;

  // Trailing 4Q
  const t4 = quarters.slice(-4).reduce((s,q)=>s+CLINICS.reduce((cs,c)=>{const d=uploads.find(u=>u.clinic===c&&u.quarter===q);return cs+(d?computeMetrics(d.accounts,c).adjEbitda:0)},0),0);

  return (
    <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:12,padding:28}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:24}}>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,color:P.text}}>Form &amp; Practice — Group Performance</div>
          <div style={{fontSize:12,color:P.muted,marginTop:4}}>{lq} · General Manager Report · Ben Croxford</div>
        </div>
        <div style={{fontSize:9,color:P.dim,fontFamily:"monospace",alignSelf:"flex-start",textTransform:"uppercase",letterSpacing:1}}>Confidential · Management Use Only</div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:22}}>
        {[
          {label:"Group Revenue",    value:fmtK(tot.rev),      delta:ptot?.rev?((tot.rev-ptot.rev)/ptot.rev*100):undefined},
          {label:"Group Adj. EBITDA",value:fmtK(tot.ebitda),   color:P.gold, delta:ptot?.ebitda?((tot.ebitda-ptot.ebitda)/Math.abs(ptot.ebitda)*100):undefined},
          {label:"EBITDA Margin",    value:tot.rev?pct(tot.ebitda,tot.rev):"—", color:P.gold},
          {label:"Trailing 4Q Ann.", value:fmtK(t4),           color:P.goldL},
        ].map(c=><Card key={c.label} {...c} small/>)}
      </div>

      <div style={{background:P.alt,borderRadius:10,overflow:"hidden",marginBottom:20}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead>
            <tr style={{borderBottom:`1px solid ${P.border}`}}>
              {["Clinic","Revenue","Gross Profit","OpEx","Net Profit","Adj. EBITDA","Margin"].map(h=>(
                <th key={h} style={{padding:"10px 14px",textAlign:h==="Clinic"?"left":"right",color:P.muted,fontSize:10,textTransform:"uppercase",letterSpacing:0.8}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {cms.map((m,i)=>(
              <tr key={i} style={{borderBottom:`1px solid ${P.border}22`}}>
                <td style={{padding:"10px 14px",color:CC[m.clinic],fontWeight:600}}>{m.clinic}</td>
                {[m.revenue,m.grossProfit,m.opex,m.netProfit].map((v,j)=>(
                  <td key={j} style={{padding:"10px 14px",textAlign:"right",color:P.text,fontVariantNumeric:"tabular-nums"}}>{fmtK(v)}</td>
                ))}

// Aggregates quarters → fiscal years, renders pitch-deck style charts + export
const CURRENT_FY = "FY26"; // update each year

// Verified Adj. EBITDA figures from accountant (Peter Gillis, ROCG)
// Formula: Net Profit + Owner Salary + Owner Super + D&A + Interest + Management Fees (related-party)
// Note: MTE includes Chirnside Park (same legal entity); Olinda separate entity
const VERIFIED_EBITDA = {
  FY23: { "Mt Evelyn": 69042, "Olinda": 74492, "Chirnside Park": null, group: 142178 },
  FY24: { "Mt Evelyn": 80982, "Olinda": 95256, "Chirnside Park": null, group: 157972 },
  FY25: { "Mt Evelyn": 81530, "Olinda": 157683, "Chirnside Park": null, group: 239214 },
  // Note: Chirnside is consolidated into Mt Evelyn in Peter's workings
};

function getFY(quarterLabel) {
  // "Q2 FY26" → "FY26"
  const m = quarterLabel?.match(/FY(\d+)/);
  return m ? `FY${m[1]}` : null;
}

function aggregateToFY(uploads, clinics) {
  // Returns { FY23:{MtEvelyn:{revenue,adjEbitda,...}, Olinda:{...}, group:{...}}, ... }
  const fySet = {};
  for (const d of uploads) {
    const fy = getFY(d.quarter);
    if (!fy) continue;
    if (!fySet[fy]) fySet[fy] = {};
    if (!fySet[fy][d.clinic]) fySet[fy][d.clinic] = { revenue:0, adjEbitda:0, ebitda:0, wages:0, opex:0, netProfit:0, quarters:0 };
    const m = computeMetrics(d.accounts, d.clinic);
    const s = fySet[fy][d.clinic];
    s.revenue   += m.revenue;
    s.adjEbitda += m.adjEbitda;
    s.ebitda    += m.ebitda;
    s.wages     += m.wages;
    s.opex      += m.opex;
    s.netProfit += m.netProfit;
    s.quarters++;
  }
  // Add group totals
  for (const fy of Object.keys(fySet)) {
    const g = { revenue:0, adjEbitda:0, ebitda:0, wages:0, opex:0, netProfit:0, quarters:0 };
    for (const c of clinics) {
      if (fySet[fy][c]) {
        g.revenue   += fySet[fy][c].revenue;
        g.adjEbitda += fySet[fy][c].adjEbitda;
        g.ebitda    += fySet[fy][c].ebitda;
        g.wages     += fySet[fy][c].wages;
        g.opex      += fySet[fy][c].opex;
        g.netProfit += fySet[fy][c].netProfit;
        g.quarters  += fySet[fy][c].quarters;
      }
    }
    fySet[fy]["__group"] = g;
  }
  return fySet;
}

function isFullFY(fyData, clinics) {
  // A "full" FY has 4 quarters for at least one clinic
  return clinics.some(c => fyData[c]?.quarters >= 4);
}

function AnnualOverviewView({ uploads, quarters, loadedClinics }) {
  const [exportMode, setExportMode] = useState(false);
  const printRef = useRef();

  const fyData = useMemo(() => aggregateToFY(uploads, loadedClinics), [uploads, loadedClinics]);
  const fyYears = useMemo(() => Object.keys(fyData).sort(), [fyData]);

  // Split full years vs current YTD
  const fullYears = fyYears.filter(fy => fy !== CURRENT_FY && isFullFY(fyData[fy], loadedClinics));
  const ytdYear   = fyYears.find(fy => fy === CURRENT_FY) || fyYears[fyYears.length-1];
  const ytdQCount = ytdYear ? Math.max(...loadedClinics.map(c => fyData[ytdYear]?.[c]?.quarters||0)) : 0;

  // Build chart rows for annual bar charts
  function buildChartRows(fy, scope) {
    // scope: "__group" or clinic name
    const d = fyData[fy]?.[scope];
    if (!d) return null;
    const full = isFullFY(fyData[fy], loadedClinics);
    // Use verified accountant figure if available (full years only)
    const verifiedKey = scope === "__group" ? "group" : scope;
    const verifiedEbitda = full && VERIFIED_EBITDA[fy]?.[verifiedKey] != null
      ? VERIFIED_EBITDA[fy][verifiedKey]
      : null;
    const adjEbitda = verifiedEbitda ?? d.adjEbitda;
    return {
      fy,
      revenue:   d.revenue,
      adjEbitda,
      adjEbitdaXero: d.adjEbitda,        // keep Xero calc for reference
      verified:  verifiedEbitda != null,  // flag for tooltip/label

  { key:"gpMargin",    label:"GP Margin %",      section:"computed", isPct:true },
  { key:"wageRatio",   label:"Wages % Revenue",  section:"computed", isPct:true },
  { key:"wages",       label:"Wages (total)",    section:"computed" },
  { key:"ownerSalary", label:"Owner Salary",     section:"computed" },
  { key:"da",          label:"D&A",              section:"computed" },
  { key:"interest",    label:"Interest",         section:"computed" },
  { key:"otherIncome", label:"Other Income",     section:"computed" },
  { key:"opex",        label:"Total OpEx",       section:"computed" },
  { key:"cogs",        label:"Cost of Sales",    section:"computed" },
];

const DASH_PATTERNS = ["", "6 3", "2 2", "8 3 2 3", "4 1"];

function getAcctVal(accounts, name) {
  for (const a of Object.values(accounts)) {
    if (a.name === name) return a.val;
  }
  return null;
}

function ExplorerView({ uploads, quarters, loadedClinics }) {
  const [selMetrics,  setSelMetrics]  = useState(["revenue","adjEbitda"]);
  const [selClinics,  setSelClinics]  = useState(loadedClinics.slice());
  const [qFrom,       setQFrom]       = useState(quarters[0]||"");
  const [qTo,         setQTo]         = useState(quarters[quarters.length-1]||"");
  const [chartType,   setChartType]   = useState("line");
  const [acctSearch,  setAcctSearch]  = useState("");
  const [showAccounts,setShowAccounts]= useState(false);

  const validClinics = selClinics.filter(c=>loadedClinics.includes(c));

  const allAccounts = useMemo(()=>{
    const bySection = { income:new Set(), cogs:new Set(), opex:new Set(), other:new Set() };
    for (const d of uploads) {
      for (const a of Object.values(d.accounts)) {
        if (EXCLUDE_RX.some(r=>r.test(a.name))) continue;
        if (bySection[a.section]) bySection[a.section].add(a.name);
      }
    }
    return bySection;
  },[uploads]);

  const filteredAccounts = useMemo(()=>{
    const q = acctSearch.toLowerCase();
    const result = [];
    const SEC_LABELS = {income:"Income",cogs:"Cost of Sales",opex:"Operating Expenses",other:"Other Income"};
    for (const [sec, names] of Object.entries(allAccounts)) {
      const filtered = [...names].filter(n=>!q||n.toLowerCase().includes(q)).sort();
      if (filtered.length) result.push({section:SEC_LABELS[sec], names:filtered});
    }
    return result;
  },[allAccounts, acctSearch]);

  const filteredQ = useMemo(()=>{
    const fi = quarters.indexOf(qFrom), ti = quarters.indexOf(qTo);
    if (fi<0||ti<0) return quarters;
    return quarters.slice(fi, ti+1);
  },[quarters, qFrom, qTo]);

  const series = useMemo(()=>{
    const out = [];
    let dashIdx = 0;
    for (const mk of selMetrics) {
      const built = BUILT_IN_METRICS.find(m=>m.key===mk);
      const isAcct = mk.startsWith("acct:");
      const acctName = isAcct ? mk.slice(5) : null;
      const isPct = built?.isPct||false;
      const dash = DASH_PATTERNS[dashIdx % DASH_PATTERNS.length];
      dashIdx++;
      for (const cl of validClinics) {
        const color = CC[cl]||P.blue;
        const metricLabel = isAcct ? acctName : (built?.label||mk);
        const label = validClinics.length>1 ? `${cl} · ${metricLabel}` : metricLabel;
        out.push({ id:`${cl}__${mk}`, label, clinic:cl, metricKey:mk, isPct, isAcct, acctName, builtFn:built?.fn||null, color, dash });
      }
    }
    return out;
  },[selMetrics, validClinics]);

  const chartData = useMemo(()=>filteredQ.map(q=>{
    const row = { quarter:q };
    for (const s of series) {
      const d = uploads.find(u=>u.clinic===s.clinic&&u.quarter===q);
      if (!d) { row[s.id]=null; continue; }
      if (s.isAcct) {
        row[s.id] = getAcctVal(d.accounts, s.acctName);
      } else {
        const m = computeMetrics(d.accounts, s.clinic);
        row[s.id] = s.builtFn ? s.builtFn(m) : m[s.metricKey];
      }
    }
    return row;
  }),[filteredQ, series, uploads]);

  const hasPct    = series.some(s=>s.isPct);
  const hasDollar = series.some(s=>!s.isPct);
  const toggleMetric = mk => setSelMetrics(p=>p.includes(mk)?p.filter(x=>x!==mk):[...p,mk]);
  const toggleClinic = c  => setSelClinics(p=>p.includes(c)?p.filter(x=>x!==c):[...p,c]);

  const Chip = ({label,active,color,onClick})=>(
    <button onClick={onClick} style={{background:active?`${color}22`:"transparent",border:`1px solid ${active?color:P.border}`,color:active?color:P.muted,borderRadius:20,padding:"4px 12px",cursor:"pointer",fontSize:12,transition:"all 0.15s",whiteSpace:"nowrap"}}>
      {label}
    </button>
  );
  const MetricChip = ({mk,label})=>{
    const active = selMetrics.includes(mk);
    return <Chip label={label} active={active} color={P.teal} onClick={()=>toggleMetric(mk)}/>;
  };

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}>
        <div>
          <div style={{fontSize:16,fontWeight:600,color:P.text,marginBottom:3}}>Data Explorer</div>
          <div style={{fontSize:12,color:P.muted}}>Chart any metric or account · any clinic combination · any date range</div>
        </div>
        <div style={{display:"flex",gap:6}}>
          {["line","bar"].map(t=>(
            <button key={t} onClick={()=>setChartType(t)} style={{background:chartType===t?P.alt:"transparent",border:`1px solid ${chartType===t?P.border:P.dim}`,color:chartType===t?P.text:P.muted,borderRadius:7,padding:"6px 14px",cursor:"pointer",fontSize:12}}>
              {t==="line"?"Line Chart":"Bar Chart"}
            </button>
          ))}
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:18}}>
        <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:10,padding:"14px 16px"}}>
          <div style={{fontSize:10,color:P.muted,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:1.2,marginBottom:10}}>Clinics</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {loadedClinics.map(c=>(
              <Chip key={c} label={c} active={validClinics.includes(c)} color={CC[c]} onClick={()=>toggleClinic(c)}/>
            ))}
            {loadedClinics.length>1&&(
              <Chip label="All" active={validClinics.length===loadedClinics.length} color={P.gold}
                onClick={()=>setSelClinics(validClinics.length===loadedClinics.length?[]:loadedClinics.slice())}/>
            )}
          </div>
        </div>
        <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:10,padding:"14px 16px"}}>
          <div style={{fontSize:10,color:P.muted,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:1.2,marginBottom:10}}>Quarter Range</div>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <select value={qFrom} onChange={e=>setQFrom(e.target.value)} style={{background:P.alt,border:`1px solid ${P.border}`,color:P.text,borderRadius:6,padding:"6px 10px",fontSize:12,flex:1}}>
              {quarters.map(q=><option key={q} value={q}>{q}</option>)}
            </select>
            <span style={{color:P.muted,fontSize:12}}>to</span>
            <select value={qTo} onChange={e=>setQTo(e.target.value)} style={{background:P.alt,border:`1px solid ${P.border}`,color:P.text,borderRadius:6,padding:"6px 10px",fontSize:12,flex:1}}>
              {quarters.map(q=><option key={q} value={q}>{q}</option>)}
            </select>
            <span style={{fontSize:11,color:P.dim,whiteSpace:"nowrap"}}>{filteredQ.length}Q</span>
          </div>
        </div>
      </div>

      <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:10,padding:"14px 16px",marginBottom:18}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div style={{fontSize:10,color:P.muted,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:1.2}}>Metrics &amp; Accounts</div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {selMetrics.length>0&&<span style={{fontSize:11,color:P.teal}}>{selMetrics.length} selected</span>}
            {selMetrics.length>0&&<button onClick={()=>setSelMetrics([])} style={{background:"none",border:"none",color:P.muted,cursor:"pointer",fontSize:11,padding:0}}>Clear all</button>}
          </div>
        </div>
        <div style={{fontSize:10,color:P.dim,textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>Computed Metrics</div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:12}}>
          {BUILT_IN_METRICS.map(m=><MetricChip key={m.key} mk={m.key} label={m.label}/>)}
        </div>
        <div style={{fontSize:10,color:P.dim,textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>Individual Accounts</div>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <input value={acctSearch} onChange={e=>setAcctSearch(e.target.value)}
            placeholder="Search accounts e.g. physio, reformer, wages, cleaning..."
            style={{flex:1,background:P.alt,border:`1px solid ${P.border}`,color:P.text,borderRadius:6,padding:"7px 12px",fontSize:12,outline:"none"}}/>
          <button onClick={()=>setShowAccounts(s=>!s)} style={{background:P.alt,border:`1px solid ${P.border}`,color:P.muted,borderRadius:6,padding:"7px 14px",cursor:"pointer",fontSize:12}}>
            {showAccounts?"Hide":"Browse"}
          </button>
        </div>
        {(showAccounts||acctSearch)&&(
          <div style={{maxHeight:220,overflowY:"auto",border:`1px solid ${P.border}`,borderRadius:8,background:P.alt}}>
            {filteredAccounts.length===0&&<div style={{padding:"12px 16px",color:P.muted,fontSize:12}}>No accounts match.</div>}
            {filteredAccounts.map(group=>(
              <div key={group.section}>
                <div style={{padding:"6px 14px",fontSize:9,color:P.dim,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:1,background:P.bg,position:"sticky",top:0}}>{group.section}</div>
                {group.names.map(name=>{
                  const mk=`acct:${name}`;
                  const active=selMetrics.includes(mk);
                  return (
                    <div key={name} onClick={()=>toggleMetric(mk)}
                      style={{padding:"7px 14px",cursor:"pointer",fontSize:12,color:active?P.teal:P.text,background:active?`${P.teal}12`:"transparent",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:`1px solid ${P.border}14`}}>
                      <span>{name}</span>
                      {active&&<span style={{fontSize:10,color:P.teal}}>✓</span>}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        )}
        {selMetrics.filter(m=>m.startsWith("acct:")).length>0&&(
          <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:8}}>
            {selMetrics.filter(m=>m.startsWith("acct:")).map(mk=>(
              <div key={mk} style={{display:"flex",alignItems:"center",gap:5,background:`${P.teal}18`,border:`1px solid ${P.teal}44`,borderRadius:20,padding:"3px 10px",fontSize:12,color:P.teal}}>
                <span>{mk.slice(5)}</span>
                <span onClick={()=>toggleMetric(mk)} style={{cursor:"pointer",opacity:0.6,lineHeight:1}}>×</span>
              </div>
            ))}
          </div>
        )}
      </div>

      {series.length===0||validClinics.length===0?(
        <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:12,padding:"40px",textAlign:"center",color:P.muted,fontSize:13}}>
          Select at least one metric and one clinic above.
        </div>
      ):(
        <>
          <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:12,padding:"18px 12px 12px",marginBottom:16}}>
            <div style={{fontSize:11,color:P.muted,paddingLeft:8,marginBottom:4}}>{filteredQ[0]} – {filteredQ[filteredQ.length-1]} · {filteredQ.length} quarters · {series.length} series</div>
            <ResponsiveContainer width="100%" height={Math.max(280, 60+series.length*18)}>
              {chartType==="bar"?(
                <BarChart data={chartData} barCategoryGap="18%">
                  <CartesianGrid strokeDasharray="3 3" stroke={P.border}/>
                  <XAxis dataKey="quarter" tick={{fill:P.muted,fontSize:10}} interval={Math.max(0,Math.floor(filteredQ.length/10)-1)}/>
                  {hasDollar&&<YAxis yAxisId="$" tickFormatter={fmtK} tick={{fill:P.muted,fontSize:10}} width={64}/>}
                  {hasPct&&<YAxis yAxisId="%" orientation="right" tickFormatter={v=>`${Number(v).toFixed(0)}%`} tick={{fill:P.muted,fontSize:10}} width={40}/>}
                  <Tooltip content={({active,payload,label})=>{
                    if(!active||!payload?.length) return null;
                    return <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:8,padding:"10px 14px"}}>
                      <div style={{color:P.muted,fontSize:11,marginBottom:6}}>{label}</div>
                      {payload.filter(p=>p.value!=null).map(p=>{
                        const s=series.find(x=>x.id===p.dataKey);
                        return <div key={p.dataKey} style={{color:p.fill,fontSize:12,fontWeight:600,marginBottom:2}}>
                          {p.name}: {s?.isPct?`${Number(p.value).toFixed(1)}%`:fmtK(p.value)}
                        </div>;
                      })}
                    </div>;
                  }}/>
                  <Legend/>
                  {series.map((s,i)=>(
                    <Bar key={s.id} dataKey={s.id} name={s.label} fill={s.color} yAxisId={s.isPct?"%":"$"} opacity={0.75+(i%3)*0.08}/>
                  ))}
                </BarChart>
              ):(
                <LineChart data={chartData}>
                  <CartesianGrid strokeDasharray="3 3" stroke={P.border}/>
                  <XAxis dataKey="quarter" tick={{fill:P.muted,fontSize:10}} interval={Math.max(0,Math.floor(filteredQ.length/10)-1)}/>
                  {hasDollar&&<YAxis yAxisId="$" tickFormatter={fmtK} tick={{fill:P.muted,fontSize:10}} width={64}/>}
                  {hasPct&&<YAxis yAxisId="%" orientation="right" tickFormatter={v=>`${Number(v).toFixed(0)}%`} tick={{fill:P.muted,fontSize:10}} width={40}/>}
                  <Tooltip content={({active,payload,label})=>{
                    if(!active||!payload?.length) return null;
                    return <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:8,padding:"10px 14px",maxWidth:300}}>
                      <div style={{color:P.muted,fontSize:11,marginBottom:6}}>{label}</div>
                      {payload.filter(p=>p.value!=null).map(p=>{
                        const s=series.find(x=>x.id===p.dataKey);
                        return <div key={p.dataKey} style={{color:p.color,fontSize:12,fontWeight:600,marginBottom:2}}>
                          {p.name}: {s?.isPct?`${Number(p.value).toFixed(1)}%`:fmtK(p.value)}
                        </div>;
                      })}
                    </div>;
                  }}/>
                  <Legend/>
                  <ReferenceLine yAxisId="$" y={0} stroke={P.dim} strokeDasharray="3 3"/>
                  {series.map(s=>(
                    <Line key={s.id} type="monotone" dataKey={s.id} name={s.label}
                      stroke={s.color} strokeWidth={2} strokeDasharray={s.dash}
                      yAxisId={s.isPct?"%":"$"} dot={{r:2,fill:s.color}} connectNulls/>
                  ))}
                </LineChart>
              )}
            </ResponsiveContainer>
          </div>

          <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:12,overflow:"auto",marginBottom:16}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,minWidth:500}}>
              <thead>
                <tr style={{borderBottom:`1px solid ${P.border}`,background:P.alt}}>
                  <th style={{padding:"8px 12px",textAlign:"left",color:P.muted,fontSize:10,textTransform:"uppercase",position:"sticky",left:0,background:P.alt,minWidth:180}}>Series</th>
                  {filteredQ.map(q=><th key={q} style={{padding:"8px 10px",textAlign:"right",color:P.muted,fontSize:10,whiteSpace:"nowrap"}}>{q}</th>)}
                </tr>
              </thead>
              <tbody>
                {series.map((s,i)=>(
                  <tr key={s.id} style={{borderBottom:`1px solid ${P.border}14`,background:i%2?`${P.alt}60`:"transparent"}}>
                    <td style={{padding:"7px 12px",color:s.color,fontWeight:600,position:"sticky",left:0,background:i%2?P.alt:P.surface,fontSize:11}}>{s.label}</td>
                    {filteredQ.map(q=>{
                      const v=chartData.find(r=>r.quarter===q)?.[s.id];
                      return <td key={q} style={{padding:"7px 10px",textAlign:"right",color:v==null?P.dim:(v<0?P.red:P.text),fontVariantNumeric:"tabular-nums"}}>
                        {v==null?"—":s.isPct?`${Number(v).toFixed(1)}%`:fmtK(v)}
                      </td>;
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}
    </div>
  );
}


// ─── Pin Gate (Owner Mode) ────────────────────────────────────────────────────
function PinGate({ownerMode, onToggle}) {
  const [show, setShow] = useState(false);
  const [pin,  setPin]  = useState("");
  const [err,  setErr]  = useState(false);
  const OWNER_PIN = localStorage.getItem("fp_owner_pin")||"1234";
  const tryPin = () => {
    if (pin === OWNER_PIN) { onToggle(true); setShow(false); setPin(""); setErr(false); }
    else { setErr(true); setPin(""); }
  };
  if (ownerMode) return (
    <button onClick={()=>onToggle(false)}
      style={{background:`${P.gold}22`,border:`1px solid ${P.gold}`,color:P.gold,borderRadius:7,padding:"6px 13px",cursor:"pointer",fontSize:11,fontWeight:600}}>
      🔓 Owner Mode
    </button>
  );
  return (
    <div style={{position:"relative"}}>
      <button onClick={()=>setShow(s=>!s)}
        style={{background:"transparent",border:`1px solid ${P.border}`,color:P.muted,borderRadius:7,padding:"6px 13px",cursor:"pointer",fontSize:11}}>
        🔒 Owner Mode
      </button>
      {show&&(
        <div style={{position:"absolute",right:0,top:"110%",background:P.surface,border:`1px solid ${P.border}`,borderRadius:10,padding:16,zIndex:50,minWidth:220,boxShadow:"0 8px 32px #00000066"}}>
          <div style={{fontSize:12,color:P.muted,marginBottom:10}}>Enter PIN to unlock owner view</div>
          <input type="password" value={pin} onChange={e=>setPin(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&tryPin()}
            placeholder="PIN" autoFocus
            style={{width:"100%",background:P.alt,border:`1px solid ${err?P.red:P.border}`,color:P.text,borderRadius:6,padding:"8px 12px",fontSize:14,outline:"none",boxSizing:"border-box"}}/>
          {err&&<div style={{fontSize:11,color:P.red,marginTop:4}}>Incorrect PIN</div>}
          <button onClick={tryPin} style={{marginTop:10,width:"100%",background:P.gold,border:"none",color:P.bg,borderRadius:6,padding:"8px",cursor:"pointer",fontWeight:700,fontSize:13}}>Unlock</button>
          <div style={{fontSize:10,color:P.dim,marginTop:8,textAlign:"center"}}>Default PIN: 1234 — change in browser console:<br/><code style={{color:P.muted}}>localStorage.setItem("fp_owner_pin","XXXX")</code></div>
        </div>
      )}
    </div>
  );
}

// ─── Break-Even Calculator ────────────────────────────────────────────────────
function BreakevenCalc({clinicName, latestMetrics}) {
  const saved = JSON.parse(localStorage.getItem("fp_be_"+(clinicName||"new"))||"{}");
  const [fixedCosts, setFixed]  = useState(saved.fixed||30000);
  const [varPct,     setVar]    = useState(saved.varPct||25);
  const [targetProfit, setTP]   = useState(saved.tp||0);
  const [clinicN,    setClinicN]= useState(clinicName||"New Clinic");

  const save = () => localStorage.setItem("fp_be_"+(clinicName||"new"), JSON.stringify({fixed:fixedCosts,varPct,tp:targetProfit}));

  // Break-even revenue = Fixed Costs / (1 - variable cost %)
  const varDec  = varPct / 100;
  const bev     = varDec < 1 ? fixedCosts / (1 - varDec) : null;
  const bevTarget = varDec < 1 ? (fixedCosts + targetProfit) / (1 - varDec) : null;
  const bevMonthly = bev ? bev / 3 : null;  // quarterly → monthly
  const bevTargetMonthly = bevTarget ? bevTarget / 3 : null;

  const currentRev = latestMetrics?.revenue || null;
  const pctOfBE = bev && currentRev ? (currentRev / bev) * 100 : null;

  const Inp = ({label, value, onChange, prefix="$", suffix="", min=0, step=1000}) => (
    <div style={{marginBottom:14}}>
      <div style={{fontSize:10,color:P.muted,textTransform:"uppercase",letterSpacing:1,fontFamily:"monospace",marginBottom:5}}>{label}</div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        {prefix&&<span style={{color:P.muted,fontSize:13}}>{prefix}</span>}
        <input type="number" value={value} onChange={e=>onChange(Number(e.target.value))} min={min} step={step}
          style={{background:P.alt,border:`1px solid ${P.border}`,color:P.text,borderRadius:6,padding:"8px 12px",fontSize:14,width:"100%",outline:"none"}}/>
        {suffix&&<span style={{color:P.muted,fontSize:13}}>{suffix}</span>}
      </div>
    </div>
  );

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}>
        <div>
          <div style={{fontSize:16,fontWeight:600,color:P.text,marginBottom:3}}>Break-Even Calculator</div>
          <div style={{fontSize:12,color:P.muted}}>Per quarter · Useful for new and startup clinics</div>
        </div>
        <button onClick={save} style={{background:`${P.green}22`,border:`1px solid ${P.green}44`,color:P.green,borderRadius:7,padding:"7px 14px",cursor:"pointer",fontSize:12}}>Save inputs</button>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
        {/* Inputs */}
        <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:12,padding:"20px 22px"}}>
          <div style={{fontSize:10,color:P.muted,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:1.2,marginBottom:16}}>Inputs — Quarterly</div>
          <Inp label="Total Fixed Costs (wages, rent, insurance, etc)" value={fixedCosts} onChange={setFixed} step={500}/>
          <Inp label="Variable Costs as % of Revenue (COGS, supplies)" value={varPct} onChange={v=>setVar(Math.min(99,v))} prefix="" suffix="%" step={1} min={0}/>
          <Inp label="Target Profit (quarterly, optional)" value={targetProfit} onChange={setTP} step={500}/>
          <div style={{fontSize:11,color:P.dim,marginTop:8,lineHeight:1.6}}>
            Variable costs are expenses that scale with revenue — COGS, consumables, reception staff on casual hours. Fixed costs are everything else.
          </div>
        </div>

        {/* Results */}
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {[
            {label:"Break-Even Revenue (quarterly)", val:bev?fmtK(bev):"—", color:P.text, sub:"to cover all costs at zero profit"},
            {label:"Monthly Revenue Target", val:bevMonthly?fmtK(bevMonthly):"—", color:P.blue, sub:"to give to your clinic manager"},
            {label:"Break-Even + Target Profit", val:bevTarget?fmtK(bevTarget):"—", color:P.gold, sub:`includes $${(targetProfit/1000).toFixed(0)}k profit target`},

                    <tr key={key+"a"} style={{borderBottom:`1px solid ${P.border}22`}}>
                      <td style={{padding:"8px 16px",color:P.muted,fontSize:11}}>↳ Actual</td>
                      {shownQ.map(q=>{

                        const actual = d ? computeMetrics(d.accounts,clinic)[key] : null;
                        const tgt = targets[clinic]?.[q]?.[key]||null;

                        return <td key={q} style={{padding:"6px 12px",textAlign:"right",color:col,fontVariantNumeric:"tabular-nums",fontSize:12,fontWeight:pct!=null?600:400}}>

      ))}
      <div style={{fontSize:11,color:P.dim,lineHeight:1.7}}>

      </div>
    </div>
  );

// ─── Cash Manager Parser ─────────────────────────────────────────────────────
// Parses Xero Cash Flow Manager Overview export
// Format: Date | Relative date | Opening balance | Cash in | Cash out | Net movement | Closing balance
function parseXeroCashManager(arrayBuf) {
  const wb   = XLSX.read(new Uint8Array(arrayBuf), {type:"array"});
  const ws   = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});

  // Detect clinic from row 1
  let clinic = null;
  for (let i=0; i<4; i++) {
    for (const cell of (rows[i]||[])) {
      const c = detectClinic(cell); if (c) { clinic=c; break; }
    }
    if (clinic) break;
  }

  // Find header row (has "Date" in col 0)
  let hdr = -1;
  for (let i=0; i<rows.length; i++) {
    if (String(rows[i]?.[0]||"").trim().toLowerCase()==="date") { hdr=i; break; }
  }
  if (hdr===-1) return null;

  const days = [];
  for (let ri=hdr+1; ri<rows.length; ri++) {
    const row = rows[ri];
    if (!row || !row[0]) continue;

    // Parse date — Xero exports as Excel serial or "DD Mon YYYY" string
    let dateStr = null;
    const raw = row[0];
    if (typeof raw === "number") {
      // Excel serial date
      const d = new Date(Math.round((raw - 25569) * 86400 * 1000));
      dateStr = d.toISOString().slice(0,10);
    } else if (typeof raw === "string") {
      const m = raw.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
      if (m) {
        const months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
        const mo = months[m[2].slice(0,3)];
        if (mo!==undefined) dateStr = `${m[3]}-${String(mo+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
      }
    } else if (raw instanceof Date) {
      dateStr = raw.toISOString().slice(0,10);
    }
    if (!dateStr) continue;

    const relLabel  = String(row[1]||"");
    const openBal   = typeof row[2]==="number" ? row[2] : 0;
    const cashIn    = typeof row[3]==="number" ? row[3] : 0;
    const cashOut   = typeof row[4]==="number" ? row[4] : 0;
    const netMove   = typeof row[5]==="number" ? row[5] : (cashIn - cashOut);
    const closeBal  = typeof row[6]==="number" ? row[6] : (openBal + netMove);
    const isToday   = /today/i.test(relLabel);

    days.push({ date:dateStr, relLabel, openBal, cashIn, cashOut, netMove, closeBal, isToday });
  }

  return { clinic: clinic||"Unknown", days };
}

// ─── Cash Flow View ───────────────────────────────────────────────────────────
function CashFlowView({cfUploads, loadedClinics}) {
  const [fwdDays,    setFwdDays]   = useState(30);
  const [viewMode,   setViewMode]  = useState("combined"); // "combined"|"clinics"
  const [chBalance,  setChBalance] = useState(()=>Number(localStorage.getItem("fp_ch_bal")||16873));
  const [showChInput,setShowChInput]= useState(false);

  const saveChBal = v => { setChBalance(v); localStorage.setItem("fp_ch_bal",v); };

  // Find today row (date === today or isToday flag)
  const todayStr = new Date().toISOString().slice(0,10);

  // Build combined daily data
  const combined = useMemo(()=>{
    if (cfUploads.length===0) return [];
    // Get all unique dates
    const allDates = [...new Set(cfUploads.flatMap(cf=>cf.days.map(d=>d.date)))].sort();
    return allDates.map(date=>{
      let totalIn=0, totalOut=0, totalClose=0, totalOpen=0;
      const byClinic = {};
      let bigOutflow = false;
      for (const cf of cfUploads) {
        const day = cf.days.find(d=>d.date===date);
        if (day) {
          totalIn    += day.cashIn;
          totalOut   += day.cashOut;
          totalClose += day.closeBal;
          totalOpen  += day.openBal;
          byClinic[cf.clinic] = day;
          if (day.cashOut > 5000) bigOutflow = true;
        }
      }
      // Add Chirnside if missing but we have a manual balance for offset
      const hasCh = cfUploads.some(cf=>cf.clinic==="Chirnside Park");
      if (!hasCh) {
        // Use the screenshot balance as today's known value; project flat (no other data)
        totalClose += chBalance;
      }
      const isToday = date === todayStr || cfUploads.some(cf=>cf.days.find(d=>d.date===date&&d.isToday));
      return { date, totalIn, totalOut, totalClose, totalOpen, byClinic, isToday, bigOutflow };
    });
  },[cfUploads, chBalance, todayStr]);

  // Slice to today + fwdDays
  const todayIdx  = combined.findIndex(d=>d.isToday||d.date>=todayStr);
  const startIdx  = Math.max(0, todayIdx-7); // show 1 week of actuals before today
  const endIdx    = Math.min(combined.length-1, todayIdx + fwdDays);
  const chartData = combined.slice(startIdx, endIdx+1).map(d=>({
    ...d,
    label: new Date(d.date+"T00:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short"}),
    isFuture: d.date > todayStr,
  }));

  // KPI numbers
  const todayRow   = combined.find(d=>d.isToday||d.date===todayStr);
  const fwdRow     = combined[Math.min(combined.length-1, todayIdx+fwdDays)];
  const next7      = combined.slice(todayIdx, todayIdx+7);
  const next7net   = next7.reduce((s,d)=>s+d.totalIn-d.totalOut,0);
  const hasCh      = cfUploads.some(cf=>cf.clinic==="Chirnside Park");
  const clinicToday = (c) => {
    if (c==="Chirnside Park" && !hasCh) return chBalance;
    const cf = cfUploads.find(x=>x.clinic===c);
    return cf?.days.find(d=>d.isToday||d.date===todayStr)?.closeBal || 0;
  };
  const minFwd     = chartData.filter(d=>d.isFuture).reduce((m,d)=>Math.min(m,d.totalClose), Infinity);

  if (cfUploads.length===0) return (
    <div>
      <div style={{display:"flex",alignItems:"flex-start",gap:20,background:P.surface,border:`1px solid ${P.border}`,borderRadius:14,padding:"28px 32px",marginBottom:20}}>
        <div style={{fontSize:32}}>💵</div>
        <div>
          <div style={{fontSize:15,fontWeight:600,color:P.text,marginBottom:8}}>Drop your Xero Cash Flow Manager exports here</div>
          <div style={{fontSize:13,color:P.muted,lineHeight:1.9,marginBottom:12}}>
            In Xero for each clinic:<br/>
            <strong style={{color:P.text}}>Accounting → Cash Flow Manager</strong> → set to 30 or 90 days<br/>
            Click <strong style={{color:P.text}}>Export → New (Excel)</strong> — the "New" button next to Export<br/>
            Name each file with the clinic name and "cash" e.g. <code style={{color:P.teal}}>MtEvelyn-cash.xlsx</code><br/>
            Drop all three here — the dashboard combines them into one view
          </div>
          <div style={{fontSize:11,color:P.dim}}>Files are detected automatically by the word "cash" in the filename.</div>
        </div>
      </div>
      {/* Chirnside manual balance input */}
      <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:10,padding:"16px 20px"}}>
        <div style={{fontSize:12,color:P.muted,marginBottom:8}}>If Chirnside Park file is unavailable, enter today's balance manually:</div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <input type="number" value={chBalance} onChange={e=>saveChBal(Number(e.target.value))}
            style={{background:P.alt,border:`1px solid ${P.border}`,color:P.text,borderRadius:6,padding:"7px 12px",fontSize:14,width:140,outline:"none"}}/>
          <span style={{fontSize:11,color:P.dim}}>Saved locally · used as static offset in combined view</span>
        </div>
      </div>
    </div>
  );

  return (
    <div>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18,flexWrap:"wrap",gap:10}}>

          <div style={{fontSize:16,fontWeight:600,color:P.text,marginBottom:3}}>Cash Flow Manager</div>

            {cfUploads.map(cf=>cf.clinic).join(" · ")}

          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <span style={{fontSize:11,color:P.muted}}>Show ahead:</span>
          {[7,14,30,60,90].map(d=>(
            <button key={d} onClick={()=>setFwdDays(d)}
              style={{background:fwdDays===d?`${P.teal}22`:"transparent",border:`1px solid ${fwdDays===d?P.teal:P.border}`,color:fwdDays===d?P.teal:P.muted,borderRadius:6,padding:"5px 11px",cursor:"pointer",fontSize:11}}>
              {d}d

          ))}
        </div>
      </div>

      {/* KPI strip */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:20}}>

          return (

              <div style={{fontSize:18,fontWeight:700,color:P.text,fontFamily:"'DM Serif Display',serif"}}>{fmtK(bal)}</div>

              </table>

      })()}

      {/* Export length mismatch warning */}
      {(()=>{
        if (cfUploads.length < 2) return null;
        const lengths = cfUploads.map(cf=>cf.days.length);
        const maxLen  = Math.max(...lengths);

              This matters for BAS quarters — a 90–180 day window captures the next 1–2 BAS payments which are your largest irregular cash events.
            </div>
          </div>
        );
      })()}

      {/* Missing clinic notice */}
      {!hasCh&&(
        <div style={{background:`${P.gold}10`,border:`1px solid ${P.gold}44`,borderRadius:10,padding:"12px 16px",display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
          <span style={{color:P.gold,fontSize:14}}>⚠</span>
          <div style={{flex:1,fontSize:12,color:P.muted}}>
            Chirnside Park cash file not loaded — using manual balance of <strong style={{color:P.gold}}>{fmtK(chBalance)}</strong>.

          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <span style={{fontSize:11,color:P.dim}}>Update balance:</span>

          </div>
        </div>
      )}
      {/* BAS timing reminder */}
      {(()=>{
        const BAS_MONTHS = [1,4,7,10]; // Jan, Apr, Jul, Oct — due ~28th each
        const today = new Date();
        const upcoming = [];
        for (let m=0; m<6; m++) {
          const d = new Date(today.getFullYear(), today.getMonth()+m, 28);
          if (BAS_MONTHS.includes(d.getMonth()+1) && d > today) {
            upcoming.push(d.toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"}));
            if (upcoming.length>=2) break;
          }
        }
        if (!upcoming.length) return null;
        return (
          <div style={{background:`${P.gold}08`,border:`1px solid ${P.gold}33`,borderRadius:10,padding:"12px 16px",marginBottom:12,display:"flex",gap:12,alignItems:"flex-start"}}>
            <span style={{color:P.gold,fontSize:14,marginTop:1}}>📅</span>
            <div style={{fontSize:12,color:P.muted,lineHeight:1.7}}>
              <strong style={{color:P.gold}}>BAS/IAS reminder:</strong>{" "}
              Next BAS due dates: <strong style={{color:P.text}}>{upcoming.join(" · ")}</strong>.{" "}
              These are your largest irregular outflows — ensure a 90–180 day export window so Xero's projection captures them.
              If BAS isn't showing in your cash projection, it hasn't been entered as a bill in Xero — do this manually for an accurate forecast.
            </div>
          </div>
        );
      })()}
      <div style={{fontSize:11,color:P.dim,lineHeight:1.7}}>
        ℹ Data sourced from Xero Cash Flow Manager exports — re-export weekly (90–180 day range) for best accuracy. Red dots on the chart = large outflow days (wages, BAS). Xero projects based on scheduled invoices, bills, and repeating transactions. If BAS isn't reflected in the projection, add it as a bill in Xero.
      </div>
    </div>
  );
}
