  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #003B49; font-family: 'DM Sans', sans-serif; }
    #root { min-height: 100%; }
    #login-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: #003B49;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      transition: opacity 0.4s ease;
    }
    #login-screen.fade-out { opacity: 0; pointer-events: none; }
    .login-card { background: #fff; border-radius: 20px; padding: 48px 52px; width: 360px; text-align: center; box-shadow: 0 32px 80px rgba(0,0,0,0.35); }
    .login-logo { font-family: 'DM Serif Display', serif; font-size: 26px; color: #003B49; margin-bottom: 4px; letter-spacing: -0.5px; }
    .login-subtitle { font-size: 12px; color: #6F7C7C; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 36px; }
    .pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 28px; }
    .pin-dot { width: 16px; height: 16px; border-radius: 50%; background: #E2E2DC; border: 2px solid #C8D6EB; transition: all 0.15s ease; }
    .pin-dot.filled { background: #003B49; border-color: #003B49; transform: scale(1.15); }
    .pin-dot.error { background: #F26439; border-color: #F26439; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .key { background: #f8fafb; border: 1.5px solid #E2E2DC; border-radius: 12px; height: 52px; font-size: 20px; font-weight: 600; color: #003B49; cursor: pointer; transition: all 0.1s ease; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; user-select: none; }
    .key:hover { background: #E2E2DC; border-color: #003B49; }
    .key:active { background: #C8D6EB; transform: scale(0.94); }
    .key.del { font-size: 15px; color: #6F7C7C; }
    .key.zero { grid-column: 2; }
    .login-error { color: #F26439; font-size: 13px; min-height: 20px; margin-top: 4px; font-weight: 500; }
    .login-hint { font-size: 11px; color: #6F7C7C; margin-top: 16px; }
    .modal-overlay { position: fixed; inset: 0; z-index: 10000; background: rgba(0,59,73,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; }
    .modal-card { background: #fff; border-radius: 16px; padding: 36px 40px; width: 400px; box-shadow: 0 24px 60px rgba(0,0,0,0.3); }
    .modal-title { font-family: 'DM Serif Display', serif; font-size: 20px; color: #003B49; margin-bottom: 6px; }
    .modal-sub { font-size: 13px; color: #6F7C7C; margin-bottom: 24px; }
    .modal-input { width: 100%; border: 1.5px solid #E2E2DC; border-radius: 10px; padding: 12px 14px; font-size: 20px; letter-spacing: 8px; color: #003B49; font-family: 'DM Sans', sans-serif; text-align: center; outline: none; margin-bottom: 12px; box-sizing: border-box; }
    .modal-input:focus { border-color: #003B49; }
    .modal-btn { width: 100%; padding: 13px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-bottom: 8px; transition: all 0.15s; }
    .modal-btn.primary { background: #003B49; color: #fff; }
    .modal-btn.primary:hover { background: #004d5f; }
    .modal-btn.secondary { background: #E2E2DC; color: #003B49; }
    .modal-status { font-size: 12px; text-align: center; min-height: 18px; margin-top: 4px; }
    @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } #login-screen { display: none !important; } button { display: none !important; } }

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Form &amp; Practice</div>
    <div class="login-subtitle">Financial Dashboard</div>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="keypad">
      <button class="key" onclick="pressKey('1')">1</button>
      <button class="key" onclick="pressKey('2')">2</button>
      <button class="key" onclick="pressKey('3')">3</button>
      <button class="key" onclick="pressKey('4')">4</button>
      <button class="key" onclick="pressKey('5')">5</button>
      <button class="key" onclick="pressKey('6')">6</button>
      <button class="key" onclick="pressKey('7')">7</button>
      <button class="key" onclick="pressKey('8')">8</button>
      <button class="key" onclick="pressKey('9')">9</button>
      <button class="key zero" onclick="pressKey('0')">0</button>
      <button class="key del" onclick="pressDelete()">&#9003;</button>
    </div>
    <div class="login-error" id="login-error"></div>
    <div class="login-hint">Enter your 4-digit PIN</div>
  </div>
</div>

<div id="root" style="display:none"></div>

<div class="modal-overlay" id="pin-modal" style="display:none">
  <div class="modal-card">
    <div class="modal-title">Change Dashboard PIN</div>
    <div class="modal-sub">Enter a new 4-digit PIN. A new file will download — upload it to GitHub as index.html.</div>
    <input class="modal-input" type="password" inputmode="numeric" maxlength="4" id="new-pin-input" placeholder="····" oninput="this.value=this.value.replace(/\D/g,'').slice(0,4)"/>
    <input class="modal-input" type="password" inputmode="numeric" maxlength="4" id="confirm-pin-input" placeholder="····" oninput="this.value=this.value.replace(/\D/g,'').slice(0,4)"/>
    <button class="modal-btn primary" onclick="doChangePin()">Generate New Dashboard File</button>
    <button class="modal-btn secondary" onclick="closePinModal()">Cancel</button>
    <div class="modal-status" id="pin-modal-status"></div>
  </div>
</div>

<script>
const SALT = new Uint8Array([70,38,80,68,65,83,72,50,48,50,54,75,77,82,74,72]);

async function pinToKey(pin) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:SALT, iterations:200000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']
  );
}

async function encryptData(pin, plaintext) {
  const key = await pinToKey(pin);
  const iv  = crypto.getRandomValues(new Uint8Array(12));
  const ct  = await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, new TextEncoder().encode(plaintext));
  const combined = new Uint8Array(iv.byteLength + ct.byteLength);
  combined.set(iv, 0); combined.set(new Uint8Array(ct), iv.byteLength);
  // Safe loop — spread operator blows call stack on large buffers
  let binary = '';
  for (let i = 0; i < combined.length; i++) binary += String.fromCharCode(combined[i]);
  return btoa(binary);
}

async function decryptData(pin, b64) {
  try {
    const key = await pinToKey(pin);
    const combined = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
    const iv = combined.slice(0,12);
    const ct = combined.slice(12);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, ct);
    return new TextDecoder().decode(pt);
  } catch(e) { return null; }
}

let pinBuffer = '', attempts = 0, lockoutUntil = 0;

function pressKey(d) {
  if (Date.now() < lockoutUntil) return;
  if (pinBuffer.length >= 4) return;
  pinBuffer += d;
  updateDots();
  if (pinBuffer.length === 4) setTimeout(tryUnlock, 80);
}
function pressDelete() {
  pinBuffer = pinBuffer.slice(0,-1);
  updateDots();
  document.getElementById('login-error').textContent = '';
}
function updateDots() {
  for (let i=0;i<4;i++) {
    const d = document.getElementById('d'+i);
    d.className = 'pin-dot' + (i < pinBuffer.length ? ' filled' : '');
  }
}

async function tryUnlock() {
  if (Date.now() < lockoutUntil) return;
  const pin = pinBuffer;
  pinBuffer = ''; updateDots();

  // Try owner PIN first
  let plaintext = await decryptData(pin, ENCRYPTED_PAYLOAD);
  let isManager = false;

  // Try manager PIN if owner failed and a manager payload exists
  if (!plaintext && MANAGER_PAYLOAD !== '__MANAGER_PAYLOAD__') {
    plaintext = await decryptData(pin, MANAGER_PAYLOAD);
    if (plaintext) isManager = true;
  }

  if (plaintext) {
    attempts = 0;
    window._fp_pin        = pin;
    window._fp_data       = JSON.parse(plaintext);
    window._fp_manager    = isManager;
    unlockDashboard();
  } else {
    attempts++;
    showPinError(attempts);
  }
}

function showPinError(n) {
  document.querySelectorAll('.pin-dot').forEach(d => {
    d.classList.add('error');
    setTimeout(()=>d.classList.remove('error'), 600);
  });
  if (n >= 5) {
    lockoutUntil = Date.now() + 30000;
    document.getElementById('login-error').textContent = 'Too many attempts — wait 30 seconds';
    setTimeout(()=>{ document.getElementById('login-error').textContent=''; attempts=0; }, 30000);
  } else {
    document.getElementById('login-error').textContent = 'Incorrect PIN';
    setTimeout(()=>document.getElementById('login-error').textContent='', 1500);
  }
}

function unlockDashboard() {
  const screen = document.getElementById('login-screen');
  screen.classList.add('fade-out');
  setTimeout(() => {
    screen.style.display = 'none';
    document.getElementById('root').style.display = 'block';
    document.body.style.background = '#f8fafc';
    if (!window._dashboardLoaded) {
      window._dashboardLoaded = true;
      loadDashboard();
    }
  }, 400);
}

function openPinModal() {
  document.getElementById('pin-modal').style.display = 'flex';
  document.getElementById('new-pin-input').value = '';
  document.getElementById('confirm-pin-input').value = '';
  document.getElementById('pin-modal-status').textContent = '';
}
function closePinModal() {
  document.getElementById('pin-modal').style.display = 'none';
}

async function doChangePin() {
  const np = document.getElementById('new-pin-input').value.trim();
  const cp = document.getElementById('confirm-pin-input').value.trim();
  const status = document.getElementById('pin-modal-status');
  if (np.length !== 4 || !/^\d{4}$/.test(np)) { status.style.color='#F26439'; status.textContent='PIN must be 4 digits'; return; }
  if (np !== cp) { status.style.color='#F26439'; status.textContent='PINs do not match'; return; }
  status.style.color='#6F7C7C'; status.textContent='Encrypting…';
  try {
    const newPayload = await encryptData(np, JSON.stringify(window._fp_data));
    const res = await fetch(window.location.href);
    let src = await res.text();
    src = src.replace(/const ENCRYPTED_PAYLOAD = '[^']*';/, `const ENCRYPTED_PAYLOAD = '${newPayload}';`);
    const blob = new Blob([src],{type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='fp-dashboard.html'; a.click();
    URL.revokeObjectURL(url);
    status.style.color='#059669'; status.textContent='✓ Downloaded — upload to GitHub as index.html';
    window._fp_pin = np;
  } catch(e) { status.style.color='#F26439'; status.textContent='Error: '+e.message; }
}

document.addEventListener('keydown', e=>{
  if (e.key>='0'&&e.key<='9') pressKey(e.key);
  if (e.key==='Backspace') pressDelete();
});

// ── Called by unlockDashboard — evals pre-compiled JS directly ──
function loadDashboard() {
  const code = document.getElementById('dashboard-code').textContent;
  eval(code);
  // eval redefines loadDashboard to the inner version — call it now
  loadDashboard();
}
</script>

// ─── Quarter label parser ─────────────────────────────────────────────────────
// "Oct-Dec 2025" → "Q2 FY26",  "Jul-Sept 2025" → "Q1 FY26", etc.
function colHeaderToQuarter(s) {
  if (!s || typeof s !== "string") return null;
  const m = s.match(/(\w+)\s*[-–]\s*\w*\s*(\d{4})/) || s.match(/(\w+)\s+(\d{4})/);
  if (!m) return null;
  const endMonth = s.match(/[-–]\s*(\w+)\s+(\d{4})/);
  const mon = endMonth ? endMonth[1].toLowerCase().slice(0, 3) : m[1].toLowerCase().slice(0, 3);
  const yr = parseInt(endMonth ? endMonth[2] : m[2]);
  const MAP = {
    sep: ["Q1", 1],
    dec: ["Q2", 1],
    mar: ["Q3", 0],
    jun: ["Q4", 0]
  };
  // Handle "Sept" → "sep"
  const key = mon === "sep" || mon === "sep" ? "sep" : mon;
  const hit = MAP[key];
  if (!hit) return null;
  return `Q${hit[0][1]} FY${String(yr + hit[1]).slice(2)}`;
}
function detectClinic(s) {
  if (!s) return null;
  for (const [rx, name] of CLINIC_NAME_MAP) if (rx.test(String(s))) return name;
  return null;
}

  const m = q?.match(/Q(\d)\s*FY(\d+)/);
  return m ? `FY${m[2]}-Q${m[1]}` : q || "";
}

// ─── Multi-column Xero parser ─────────────────────────────────────────────────
// Returns array of { clinic, quarter, accounts } — one per column
function parseXeroMultiCol(arrayBuf) {
  const wb = XLSX.read(new Uint8Array(arrayBuf), {
    type: "array"
  });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {
    header: 1,
    defval: null
  });

  // Detect clinic from header rows
  let clinic = null;
  for (let i = 0; i < Math.min(5, rows.length); i++) {
    for (const cell of rows[i]) {
      const c = detectClinic(cell);
      if (c) {
        clinic = c;
        break;
      }
    }
    if (clinic) break;
  }

  // Find header row (contains "Account" in col 0)
  let headerRowIdx = -1;
  for (let i = 0; i < rows.length; i++) {
    if (String(rows[i][0] || "").trim().toLowerCase() === "account") {
      headerRowIdx = i;
      break;
    }
  }
  if (headerRowIdx === -1) return [];

  // Parse quarter labels from header row
  const headerRow = rows[headerRowIdx];
  const quarters = [];
  for (let col = 1; col < headerRow.length; col++) {
    const q = colHeaderToQuarter(String(headerRow[col] || ""));
    quarters.push(q); // may be null for empty cols
  }

  // Build one account map per quarter column
  const numCols = quarters.length;
  const accountsByCol = Array.from({
    length: numCols
  }, () => ({}));
  let section = "income";
  for (let ri = headerRowIdx + 1; ri < rows.length; ri++) {
    const row = rows[ri];
    const label = String(row[0] || "").trim();
    if (!label) continue;
    const low = label.toLowerCase();
    // Exclusions first — prevents items like "Income Tax Expense" from corrupting section state
    if (EXCLUDE_RX.some(r => r.test(label))) continue;
    // Section detection
    if (low.match(/^trading income/)) {
      section = "income";
      continue;
    }
    if (low.match(/^other income/)) {
      section = "other";
      continue;
    }
    if (low.match(/^cost of (sales|goods)/)) {
      section = "cogs";
      continue;
    }
    if (low.match(/^gross profit/)) continue;
    if (low.match(/^operating expenses?/)) {
      section = "opex";
      continue;
    }
    if (low.match(/^(total\b|net profit|net loss)/)) continue;
    if (label.match(/^Total /i)) continue;
    const isInterco = INTERCO_RX.some(r => r.test(label));
    const isNonRecur = NONRECUR_RX.some(r => r.test(label));

    // Read value for each column
    for (let col = 0; col < numCols; col++) {
      const raw = row[col + 1];
      if (raw === null || raw === undefined) continue;
      if (typeof raw === "string" && raw.startsWith("=")) continue;
      const val = typeof raw === "number" ? raw : parseFloat(String(raw).replace(/[$,\s]/g, ""));
      if (isNaN(val) || val === 0) continue;
      const key = label.replace(/\W+/g, "_").toLowerCase() + "_" + col;
      accountsByCol[col][key] = {
        name: label,
        val,
        section,
        isInterco,
        isNonRecur
      };
    }
  }

  // Return one record per valid quarter
  return quarters.map((q, i) => {
    if (!q || !clinic) return null;
    const acctCount = Object.keys(accountsByCol[i]).length;
    if (acctCount === 0) return null;
    return {
      clinic,
      quarter: q,
      accounts: accountsByCol[i]
    };
  }).filter(Boolean);
}

  if (DA_RX.some(r => r.test(name))) return "da";

    interest = 0,
    interco = 0,
    wages = 0,
    nonRecur = 0;

    incomeDetail = [];

    const cls = classify(acct.name, acct.isInterco);
    if (acct.section === "income") {
      const v = acct.val;
      revenue += v; // signed: returns are negative
      incomeDetail.push({
        name: acct.name,
        val: Math.abs(v)

      cogs += acct.val; // signed: closing stock is negative

      if (cls === "interco") {
        interco += acct.val;
        expenseDetail.push({
          name: acct.name,
          val: acct.val,
          cls
        });
        continue;

      // Skip dividends paid and income tax — not operating expenses
      if (EXCLUDE_RX.some(r => r.test(acct.name))) continue;

      if (/^wages|^salaries/i.test(acct.name) && cls === "normal") wages += v;

        name: acct.name,
        val: v,
        cls
      });

  // Interco credits (negative = MTE reimbursed by Chirnside) are genuine income — include them.
  // Interco expenses (positive) remain excluded to avoid double-counting.
  const netProfit = grossProfit + otherIncome - opex - Math.min(0, interco);
  const ebitda = netProfit + interest + da;
  const adjEbitda = ebitda + ownerSalary + ownerSuper + nonRecur; // nonRecur = mgmt fees, one-off related-party

  const ownerEarnings = netProfit + ownerSalary + ownerSuper;
  const revenuePerWage = wages > 0 ? revenue / wages : null;
  return {
    revenue,
    otherIncome,
    cogs,
    grossProfit,
    opex,
    netProfit,
    ownerSalary,
    ownerSuper,
    da,
    interest,
    interco,
    wages,
    nonRecur,
    ebitda,
    adjEbitda,
    ownerEarnings,
    revenuePerWage,
    valuationLow: adjEbitda * 3,
    valuationHigh: adjEbitda * 5,
    expenseDetail,
    incomeDetail,
    ebitdaMargin: revenue ? adjEbitda / revenue * 100 : 0,
    gpMargin: revenue ? grossProfit / revenue * 100 : 0,
    wageRatio: revenue ? wages / revenue * 100 : 0,
    opexRatio: revenue ? opex / revenue * 100 : 0
  };
}

  });
  if (m.wageRatio > 60 && m.wages > 0) flags.push({
    type: "risk",
    msg: `Wages-to-revenue ratio is ${m.wageRatio.toFixed(1)}%. Allied health benchmark is typically ≤60%. Review staffing mix and practitioner utilisation.`

    type: "warn",

  });

    type: "info",

  });

  if (prev.length > 0) {

    const rc = lm.revenue ? (m.revenue - lm.revenue) / lm.revenue * 100 : 0;
    if (Math.abs(rc) > 10) flags.push({
      type: rc > 0 ? "upside" : "risk",
      msg: `Revenue ${rc > 0 ? "up" : "down"} ${Math.abs(rc).toFixed(1)}% vs ${prev[prev.length - 1].quarter}. ${rc < 0 ? "Investigate patient volume or fee schedule changes." : "Strong growth — check capacity and practitioner utilisation."}`

      type: ed > 0 ? "upside" : "risk",

// Parses Xero Cash Flow Manager Overview export
// Format: Date | Relative date | Opening balance | Cash in | Cash out | Net movement | Closing balance
function parseXeroCashManager(arrayBuf) {
  const wb = XLSX.read(new Uint8Array(arrayBuf), {

  let clinic = null;

    for (const cell of rows[i] || []) {
      const c = detectClinic(cell);
      if (c) {
        clinic = c;
        break;
      }
    }
    if (clinic) break;
  }

  // Find header row (has "Date" in col 0)
  let hdr = -1;
  for (let i = 0; i < rows.length; i++) {
    if (String(rows[i]?.[0] || "").trim().toLowerCase() === "date") {
      hdr = i;
      break;
    }
  }
  if (hdr === -1) return null;
  const days = [];
  for (let ri = hdr + 1; ri < rows.length; ri++) {
    const row = rows[ri];
    if (!row || !row[0]) continue;

    // Parse date — Xero exports as Excel serial or "DD Mon YYYY" string
    let dateStr = null;
    const raw = row[0];
    if (typeof raw === "number") {
      // Excel serial date
      const d = new Date(Math.round((raw - 25569) * 86400 * 1000));
      dateStr = d.toISOString().slice(0, 10);
    } else if (typeof raw === "string") {
      const m = raw.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
      if (m) {
        const months = {
          Jan: 0,
          Feb: 1,
          Mar: 2,
          Apr: 3,
          May: 4,
          Jun: 5,
          Jul: 6,
          Aug: 7,
          Sep: 8,
          Oct: 9,
          Nov: 10,
          Dec: 11
        };
        const mo = months[m[2].slice(0, 3)];
        if (mo !== undefined) dateStr = `${m[3]}-${String(mo + 1).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
      }
    } else if (raw instanceof Date) {
      dateStr = raw.toISOString().slice(0, 10);
    }
    if (!dateStr) continue;
    const relLabel = String(row[1] || "");
    const openBal = typeof row[2] === "number" ? row[2] : 0;
    const cashIn = typeof row[3] === "number" ? row[3] : 0;
    const cashOut = typeof row[4] === "number" ? row[4] : 0;
    const netMove = typeof row[5] === "number" ? row[5] : cashIn - cashOut;
    const closeBal = typeof row[6] === "number" ? row[6] : openBal + netMove;
    const isToday = /today/i.test(relLabel);
    days.push({
      date: dateStr,
      relLabel,
      openBal,
      cashIn,
      cashOut,
      netMove,
      closeBal,
      isToday
    });
  }
  return {
    clinic: clinic || "Unknown",
    days
  };
}

// ─── AI Assistant ─────────────────────────────────────────────────────────────
function buildFinancialContext(uploads, cfUploads, effectiveOwnerMode) {
  if (!uploads.length) return null;
  const clinics = ["Mt Evelyn", "Olinda", "Chirnside Park"];
  const quarters = [...new Set(uploads.map(d => d.quarter))].sort((a, b) => qKey(a).localeCompare(qKey(b)));

  // Build P&L summary table
  let plLines = ["=== QUARTERLY P&L (all figures in AUD) ===\n"];
  plLines.push(["Quarter", "Clinic", "Revenue", "Gross Profit", "OpEx", "Net Profit", "Adj EBITDA", "EBITDA Margin%", "Wages", "Owner Salary", "Owner Super", "D&A", "Interest"].join("\t"));
  for (const q of quarters) {
    for (const c of clinics) {
      const d = uploads.find(u => u.clinic === c && u.quarter === q);
      if (!d) continue;
      const m = computeMetrics(d.accounts, c);
      plLines.push([q, c, Math.round(m.revenue), Math.round(m.grossProfit), Math.round(m.opex || 0), Math.round(m.netProfit), Math.round(m.adjEbitda), m.ebitdaMargin.toFixed(1), Math.round(m.wages), Math.round(m.ownerSalary), Math.round(m.ownerSuper), Math.round(m.da), Math.round(m.interest)].join("\t"));
    }
  }

  // Group totals
  plLines.push("\n=== GROUP QUARTERLY TOTALS ===");
  plLines.push(["Quarter", "Total Revenue", "Total Adj EBITDA", "Group Margin%"].join("\t"));
  for (const q of quarters) {
    let rev = 0,
      ebitda = 0;
    for (const c of clinics) {
      const d = uploads.find(u => u.clinic === c && u.quarter === q);
      if (!d) continue;
      const m = computeMetrics(d.accounts, c);
      rev += m.revenue;
      ebitda += m.adjEbitda;
    }
    plLines.push([q, Math.round(rev), Math.round(ebitda), rev ? (ebitda / rev * 100).toFixed(1) : "—"].join("\t"));
  }

  // Trailing 4Q annualised per clinic
  plLines.push("\n=== TRAILING 4 QUARTERS (ANNUALISED) ===");
  const last4Q = quarters.slice(-4);
  for (const c of clinics) {
    const t4 = last4Q.reduce((s, q) => {
      const d = uploads.find(u => u.clinic === c && u.quarter === q);
      if (!d) return s;
      const m = computeMetrics(d.accounts, c);
      return {
        rev: s.rev + m.revenue,
        ebitda: s.ebitda + m.adjEbitda,
        ownerCash: s.ownerCash + (m.ownerSalary + m.ownerSuper)
      };
    }, {
      rev: 0,
      ebitda: 0,
      ownerCash: 0
    });
    plLines.push(`${c}: Revenue ${Math.round(t4.rev).toLocaleString()} | Adj EBITDA ${Math.round(t4.ebitda).toLocaleString()} | Owner drawings ${Math.round(t4.ownerCash).toLocaleString()}`);
  }

  // Owner earnings note
  const totalOwnerSalary = quarters.slice(-4).reduce((s, q) => {
    return s + clinics.reduce((cs, c) => {
      const d = uploads.find(u => u.clinic === c && u.quarter === q);
      if (!d) return cs;
      const m = computeMetrics(d.accounts, c);
      return cs + m.ownerSalary + m.ownerSuper;
    }, 0);
  }, 0);
  plLines.push(`\nAnnual owner salary + super (last 4Q): ${Math.round(totalOwnerSalary).toLocaleString()}`);
  plLines.push("Note: Adj EBITDA adds back owner salary, super, D&A, and interest to net profit");
  plLines.push("Note: 'Owner Earnings' = Net Profit + Owner Salary + Owner Super (cash available to owners after tax)");

  // Cash flow section
  let cashLines = ["\n=== CASH FLOW MANAGER (daily, from Xero) ==="];
  if (cfUploads.length) {
    const today = new Date().toISOString().slice(0, 10);
    for (const cf of cfUploads) {
      const todayRow = cf.days.find(d => d.date === today || d.isToday);
      const lastRow = cf.days[cf.days.length - 1];
      cashLines.push(`\n${cf.clinic}:`);
      cashLines.push(`  Today's balance: ${Math.round(todayRow?.closeBal || 0).toLocaleString()}`);
      cashLines.push(`  Projection end (${lastRow?.date}): ${Math.round(lastRow?.closeBal || 0).toLocaleString()}`);
      // Monthly closing balances
      cashLines.push("  Monthly closing balances:");
      const months = {};
      for (const d of cf.days) {
        const mo = d.date.slice(0, 7);
        months[mo] = d.closeBal;
      }
      for (const [mo, bal] of Object.entries(months)) {
        cashLines.push(`    ${mo}: ${Math.round(bal).toLocaleString()}`);
      }
      // Big outflow days
      const bigOut = cf.days.filter(d => d.cashOut > 8000).slice(0, 10);
      if (bigOut.length) {
        cashLines.push("  Large outflow days (wages/BAS/other):");
        for (const d of bigOut) cashLines.push(`    ${d.date}: ${Math.round(d.cashOut).toLocaleString()} out → balance ${Math.round(d.closeBal).toLocaleString()}`);
      }
    }
    // Combined totals by month
    cashLines.push("\n  === COMBINED GROUP CASH BY MONTH ===");
    const allDates = [...new Set(cfUploads.flatMap(cf => cf.days.map(d => d.date)))].sort();
    const groupByMonth = {};
    for (const date of allDates) {
      const mo = date.slice(0, 7);

        if (row) total += row.closeBal;

      cashLines.push(`  ${mo}: ${Math.round(bal).toLocaleString()}`);

- Olinda operates as a separate entity (Form & Practice Olinda Pty Ltd)

- Medfin loans of ~$167k net (studio fit-outs) held under associated entity DRAH — not on F&P books, but relevant for net proceeds in any sale scenario
- Australian financial year: July–September = Q1, October–December = Q2, January–March = Q3, April–June = Q4
- BAS quarters due approximately 28 Oct, 28 Jan, 28 Apr, 28 Jul
- Wages paid fortnightly
