        })}
        {/* Combined */}
        <div style={{background:P.surface,border:`1px solid ${P.gold}44`,borderRadius:10,padding:"13px 16px"}}>

                        <td style={{padding:"9px 14px",textAlign:"right",color:net>=0?P.green:P.red,fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{net>=0?"+":""}{fmtK(net)}</td>

        const maxLen  = Math.max(...lengths);

        if (!shortClinics.length) return null;
        return (

function buildFinancialContext(uploads, cfUploads, effectiveOwnerMode) {
  if (!uploads.length) return null;

  const clinics = ["Mt Evelyn","Olinda","Chirnside Park"];
  const quarters = [...new Set(uploads.map(d=>d.quarter))].sort((a,b)=>qKey(a).localeCompare(qKey(b)));

  // Build P&L summary table
  let plLines = ["=== QUARTERLY P&L (all figures in AUD) ===\n"];
  plLines.push(["Quarter","Clinic","Revenue","Gross Profit","OpEx","Net Profit","Adj EBITDA","EBITDA Margin%","Wages","Owner Salary","Owner Super","D&A","Interest"].join("\t"));
  for (const q of quarters) {
    for (const c of clinics) {
      const d = uploads.find(u=>u.clinic===c&&u.quarter===q);
      if (!d) continue;
      const m = computeMetrics(d.accounts, c);
      plLines.push([q,c,
        Math.round(m.revenue), Math.round(m.grossProfit), Math.round(m.opex||0),
        Math.round(m.netProfit), Math.round(m.adjEbitda),
        m.ebitdaMargin.toFixed(1), Math.round(m.wages),
        Math.round(m.ownerSalary), Math.round(m.ownerSuper),
        Math.round(m.da), Math.round(m.interest)
      ].join("\t"));
    }
  }

  // Group totals
  plLines.push("\n=== GROUP QUARTERLY TOTALS ===");
  plLines.push(["Quarter","Total Revenue","Total Adj EBITDA","Group Margin%"].join("\t"));
  for (const q of quarters) {
    let rev=0, ebitda=0;
    for (const c of clinics) {
      const d = uploads.find(u=>u.clinic===c&&u.quarter===q);
      if (!d) continue;
      const m = computeMetrics(d.accounts, c);
      rev+=m.revenue; ebitda+=m.adjEbitda;
    }
    plLines.push([q, Math.round(rev), Math.round(ebitda), rev?(ebitda/rev*100).toFixed(1):"—"].join("\t"));
  }

  // Trailing 4Q annualised per clinic
  plLines.push("\n=== TRAILING 4 QUARTERS (ANNUALISED) ===");
  const last4Q = quarters.slice(-4);
  for (const c of clinics) {
    const t4 = last4Q.reduce((s,q)=>{
      const d=uploads.find(u=>u.clinic===c&&u.quarter===q);
      if(!d) return s;
      const m=computeMetrics(d.accounts,c);
      return {rev:s.rev+m.revenue, ebitda:s.ebitda+m.adjEbitda, ownerCash:s.ownerCash+(m.ownerSalary+m.ownerSuper)};
    },{rev:0,ebitda:0,ownerCash:0});
    plLines.push(`${c}: Revenue $${Math.round(t4.rev).toLocaleString()} | Adj EBITDA $${Math.round(t4.ebitda).toLocaleString()} | Owner drawings $${Math.round(t4.ownerCash).toLocaleString()}`);
  }

  // Owner earnings note
  const totalOwnerSalary = quarters.slice(-4).reduce((s,q)=>{
    return s+clinics.reduce((cs,c)=>{
      const d=uploads.find(u=>u.clinic===c&&u.quarter===q); if(!d) return cs;
      const m=computeMetrics(d.accounts,c); return cs+m.ownerSalary+m.ownerSuper;
    },0);
  },0);
  plLines.push(`\nAnnual owner salary + super (last 4Q): $${Math.round(totalOwnerSalary).toLocaleString()}`);
  plLines.push("Note: Adj EBITDA adds back owner salary, super, D&A, and interest to net profit");
  plLines.push("Note: 'Owner Earnings' = Net Profit + Owner Salary + Owner Super (cash available to owners after tax)");

  // Cash flow section
  let cashLines = ["\n=== CASH FLOW MANAGER (daily, from Xero) ==="];
  if (cfUploads.length) {
    const today = new Date().toISOString().slice(0,10);
    for (const cf of cfUploads) {
      const todayRow = cf.days.find(d=>d.date===today||d.isToday);
      const lastRow = cf.days[cf.days.length-1];
      cashLines.push(`\n${cf.clinic}:`);
      cashLines.push(`  Today's balance: $${Math.round(todayRow?.closeBal||0).toLocaleString()}`);
      cashLines.push(`  Projection end (${lastRow?.date}): $${Math.round(lastRow?.closeBal||0).toLocaleString()}`);
      // Monthly closing balances
      cashLines.push("  Monthly closing balances:");
      const months = {};
      for (const d of cf.days) {
        const mo = d.date.slice(0,7);
        months[mo] = d.closeBal;
      }
      for (const [mo,bal] of Object.entries(months)) {
        cashLines.push(`    ${mo}: $${Math.round(bal).toLocaleString()}`);
      }
      // Big outflow days
      const bigOut = cf.days.filter(d=>d.cashOut>8000).slice(0,10);
      if (bigOut.length) {
        cashLines.push("  Large outflow days (wages/BAS/other):");
        for (const d of bigOut) cashLines.push(`    ${d.date}: $${Math.round(d.cashOut).toLocaleString()} out → balance $${Math.round(d.closeBal).toLocaleString()}`);
      }
    }
    // Combined totals by month
    cashLines.push("\n  === COMBINED GROUP CASH BY MONTH ===");
    const allDates = [...new Set(cfUploads.flatMap(cf=>cf.days.map(d=>d.date)))].sort();
    const groupByMonth = {};
    for (const date of allDates) {
      const mo = date.slice(0,7);
      let total = 0;
      for (const cf of cfUploads) {
        const row = cf.days.find(d=>d.date===date);
        if (row) total += row.closeBal;
      }
      groupByMonth[mo] = total;
    }
    for (const [mo,bal] of Object.entries(groupByMonth)) {
      cashLines.push(`  ${mo}: $${Math.round(bal).toLocaleString()}`);
    }
  } else {
    cashLines.push("No cash flow data loaded.");
  }

  // Business context
  const context = `
You are a financial analyst assistant for Form & Practice, an Australian physiotherapy and Pilates business with three clinic locations: Mt Evelyn, Olinda, and Chirnside Park (Victoria, Australia).

Business structure:
- Mt Evelyn and Chirnside Park operate under the same legal entity (Form & Practice Mt Evelyn Pty Ltd). Chirnside Park only became profitable in FY26.
- Olinda operates as a separate entity (Form & Practice Olinda Pty Ltd)
- Owner operators: Jerry Higgins and Kate Rae. Owner salaries are drawn from Mt Evelyn and Olinda only (not Chirnside).
- General Manager: Ben Croxford
- Accountant: Peter Gillis at ROCG Business Services
- Medfin loans of ~$167k net (studio fit-outs) held under associated entity DRAH — not on F&P books, but relevant for net proceeds in any sale scenario
- Australian financial year: July–September = Q1, October–December = Q2, January–March = Q3, April–June = Q4
- BAS quarters due approximately 28 Oct, 28 Jan, 28 Apr, 28 Jul
- Wages paid fortnightly

Valuation context: Allied health practices typically sell at 3–5× trailing 12-month Adj. EBITDA for an asset sale. Any sale would require repaying Medfin (~$167k) from proceeds.

When answering questions:
- Be direct and specific — use actual dollar figures from the data
- When asked about projections, clearly distinguish between Xero-derived cash flow projections (near-term, based on scheduled transactions) and trend-based estimates (longer-term)
- When asked about EBITDA "adjusted for owner incomes", this means Adj EBITDA which already adds back owner salary and super
- Flag any data limitations clearly (e.g. if cash flow data only goes to a certain date)
- Keep answers concise — 2–4 short paragraphs maximum unless a table is genuinely helpful
- Use Australian dollar formatting

${plLines.join("\n")}
${cashLines.join("\n")}
`.trim();

  return context;
}

// ─── Main ─────────────────────────────────────────────────────────────────────

// ─── Cash Flow Forecast Engine ────────────────────────────────────────────────
// Generates a 6-month probabilistic cash flow forecast from historical P&L data.
// Revenue modelled via linear trend + quarterly seasonality.
// Wages fortnightly (% of projected revenue).
// BAS = net GST (taxable supplies × 10% less input credits), quarterly.
// IAS = PAYG withholding on wages (~28%), quarterly.
// Super = 11.5% of wages, quarterly on ATO due dates.
// Payroll tax = monthly (VIC: 4.85% of wages above threshold).
// Rent/subs = monthly fixed from historical average.

// ── Helpers ─────────────────────────────────────────────────────────────────
function addDays(d, n) {
  const r = new Date(d); r.setDate(r.getDate() + n); return r;
}
function isoDate(d) { return d.toISOString().slice(0,10); }
function monthStart(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function nextNthOfMonth(from, nth) {
  let d = new Date(from.getFullYear(), from.getMonth(), nth);
  if (d <= from) d = new Date(from.getFullYear(), from.getMonth()+1, nth);
  return d;
}
// Returns next ATO quarterly due date from a given date
// BAS: 28 Oct, 28 Feb, 28 Apr, 28 Jul
// Super: 28 Oct, 28 Jan, 28 Apr, 28 Jul
function nextQuarterlyDate(from, type) {
  const basMonths  = [1, 3, 6, 9];  // Feb, Apr, Jul, Oct (0-indexed)
  const superMonths= [0, 3, 6, 9];  // Jan, Apr, Jul, Oct
  const months = type==='super' ? superMonths : basMonths;
  const candidates = [];
  for (let y = from.getFullYear(); y <= from.getFullYear()+1; y++) {
    for (const m of months) {
      const d = new Date(y, m, 28);
      if (d > from) candidates.push(d);
    }
  }
  candidates.sort((a,b)=>a-b);
  return candidates[0];
}

// ── Historical extraction from uploads ──────────────────────────────────────
function extractClinicHistory(uploads, clinic) {
  // Returns per-quarter arrays of {quarter, revenue, wages, super, rent,
  //   payrollTax, subscriptions, gstTaxable, otherOpex, ownerSalary}
  const REVENUE_ACCTS = ['Clinical Classes','Massage Revenue','Physiotherapy Revenue',
    'Reformer Pilates','Osteopathy Revenue','Osteo Revenue','Retail Sales','Sales'];
  const GST_TAXABLE   = ['Reformer Pilates','Retail Sales','Sales'];
  const WAGE_ACCTS    = ['Wages and Salaries'];
  const SUPER_ACCTS   = ['Superannuation'];
  const PTAX_ACCTS    = ['Payroll Tax','WorkCover'];
  const RENT_ACCTS    = ['Rent','Rent - Outgoings','Rent - Rates','Rent - Water','Water Rates','Rates & Land Tax'];
  const SUBS_ACCTS    = ['Subscriptions'];
  const OWNER_SAL     = /^owners?\s*salary/i;
  const OWNER_SUP     = /^owners?\s*super/i;
  const EXCL          = /^(dividends?\s*paid|income\s*tax|chirnside\s*wages|chirnside\s*super|depreciation|interest\s*expense|management\s*fees?|borrowing)/i;

  const quarters = uploads.filter(u => u.clinic === clinic);
  return quarters.map(q => {
    let revenue=0, gstTaxable=0, wages=0, superAmt=0, rent=0,
        payrollTax=0, subs=0, ownerSalary=0, ownerSuper=0, otherOpex=0;
    const acctList = Array.isArray(q.accounts) ? q.accounts : Object.values(q.accounts||{});
    for (const a of acctList) {
      if (EXCL.test(a.name)) continue;
      const v = Math.abs(a.val||0);
      if (a.section==='income') {
        revenue += v;
        if (GST_TAXABLE.some(n=>a.name===n)) gstTaxable += v;
      } else if (a.section==='opex') {
        if (REVENUE_ACCTS.includes(a.name) && a.section==='income') { revenue+=v; }
        if (WAGE_ACCTS.includes(a.name))  { wages+=v; }
        else if (SUPER_ACCTS.includes(a.name)) { superAmt+=v; }
        else if (PTAX_ACCTS.includes(a.name))  { payrollTax+=v; }
        else if (RENT_ACCTS.includes(a.name))  { rent+=v; }
        else if (SUBS_ACCTS.includes(a.name))  { subs+=v; }
        else if (OWNER_SAL.test(a.name)) { ownerSalary+=v; }
        else if (OWNER_SUP.test(a.name)) { ownerSuper+=v; }
        else { otherOpex+=v; }
      }
    }
    return { quarter:q.quarter, revenue, gstTaxable, wages, superAmt,
             payrollTax, rent, subs, ownerSalary, ownerSuper, otherOpex };
  }).filter(h=>h.revenue>0);
}

// ── Linear trend + seasonality ───────────────────────────────────────────────
function fitTrend(history, key) {
  const vals = history.map(h=>h[key]);
  const n=vals.length; if(n<2) return {slope:0, intercept:vals[0]||0, vals};
  const x=[...Array(n).keys()];
  const sx=x.reduce((a,v)=>a+v,0), sy=vals.reduce((a,v)=>a+v,0);
  const sxy=x.reduce((a,v,i)=>a+v*vals[i],0), sxx=x.reduce((a,v)=>a+v*v,0);
  const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx);
  const intercept=(sy-slope*sx)/n;
  return {slope, intercept, vals};
}

function seasonalIndex(history) {
  // Map quarter label → fiscal quarter number (1=Jul-Sep, 2=Oct-Dec, 3=Jan-Mar, 4=Apr-Jun)
  function qNum(label) {
    const m=label?.match(/Q(\d)/); return m?parseInt(m[1]):0;
  }
  const buckets={1:[],2:[],3:[],4:[]};
  const avg = history.reduce((s,h)=>s+h.revenue,0)/history.length;
  for (const h of history) {
    const q=qNum(h.quarter);
    if(q && avg>0) buckets[q].push(h.revenue/avg);
  }
  return {
    1: buckets[1].length ? buckets[1].reduce((a,v)=>a+v,0)/buckets[1].length : 1,
    2: buckets[2].length ? buckets[2].reduce((a,v)=>a+v,0)/buckets[2].length : 1,
    3: buckets[3].length ? buckets[3].reduce((a,v)=>a+v,0)/buckets[3].length : 1,
    4: buckets[4].length ? buckets[4].reduce((a,v)=>a+v,0)/buckets[4].length : 1,
  };
}

function getQuarterNum(date) {
  const m = date.getMonth(); // 0-indexed
  // Fiscal: Q1=Jul(6)-Sep(8), Q2=Oct(9)-Dec(11), Q3=Jan(0)-Mar(2), Q4=Apr(3)-Jun(5)
  if(m>=6&&m<=8) return 1;
  if(m>=9&&m<=11) return 2;
  if(m>=0&&m<=2) return 3;
  return 4;
}

// ── Main forecast generator ──────────────────────────────────────────────────
function generateForecast(uploads, cfUploads, scenarioMultiplier, startingBalances) {
  // scenarioMultiplier: {revenue: 1.0, cost: 1.0}
  const clinics = ['Mt Evelyn','Olinda','Chirnside Park'];
  const today = new Date(); today.setHours(0,0,0,0);
  const endDate = addDays(today, 183); // ~6 months

  // Per-clinic event streams
  const events = []; // {date, clinic, label, amount, type, scenario}

  for (const clinic of clinics) {
    const history = extractClinicHistory(uploads, clinic);
    if(history.length < 2) continue;

    // Fit trends on last 6 quarters (or all if fewer)
    const recent = history.slice(-6);
    const revTrend   = fitTrend(recent, 'revenue');
    const wageRatios = recent.filter(h=>h.wages>0).map(h=>h.wages/h.revenue);
    const wageRatio  = wageRatios.length ? wageRatios.reduce((a,v)=>a+v,0)/wageRatios.length : 0.62;
    const superRatios= recent.filter(h=>h.superAmt>0).map(h=>h.superAmt/h.wages||0);
    const superRatio = superRatios.length ? superRatios.reduce((a,v)=>a+v,0)/superRatios.length : 0.115;
    const ptaxRatios = recent.filter(h=>h.payrollTax>0&&h.wages>0).map(h=>h.payrollTax/h.wages);
    const ptaxRatio  = ptaxRatios.length ? ptaxRatios.reduce((a,v)=>a+v,0)/ptaxRatios.length : 0.026;
    const rentAvg    = recent.filter(h=>h.rent>0).reduce((s,h)=>s+h.rent,0) /
                       (recent.filter(h=>h.rent>0).length||1);
    const subsAvg    = recent.filter(h=>h.subs>0).reduce((s,h)=>s+h.subs,0) /
                       (recent.filter(h=>h.subs>0).length||1);
    const gstTaxableRatio = recent.filter(h=>h.revenue>0)
                              .map(h=>h.gstTaxable/h.revenue)
                              .reduce((a,v)=>a+v,0)/(recent.filter(h=>h.revenue>0).length||1);
    const otherOpexRatio  = recent.filter(h=>h.revenue>0)
                              .map(h=>h.otherOpex/h.revenue)
                              .reduce((a,v)=>a+v,0)/(recent.filter(h=>h.revenue>0).length||1);
    const ownerSalAvg     = recent.reduce((s,h)=>s+h.ownerSalary,0)/(recent.length||1);
    const seasonal        = seasonalIndex(recent);

    // We'll accumulate quarterly buckets for BAS/Super/IAS
    // Track which ATO quarters we've already scheduled to avoid duplicates
    const scheduledBAS   = new Set();
    const scheduledIAS   = new Set();
    const scheduledSuper = new Set();

    // Quarterly projection offset: where are we in the trend?
    const baseIdx = revTrend.vals.length;

    // Walk day by day
    let d = new Date(today);
    let qIdx = 0; // increments each time we cross a quarter boundary
    let currentQStart = new Date(today.getFullYear(), today.getMonth() - (today.getMonth()%3), 1);
    let qRevAccum = 0;  // accumulated revenue in current quarter (for BAS calc)
    let qWageAccum = 0; // accumulated wages in current quarter (for super/IAS calc)

    // Next fortnightly wage date (assume last payday was ~7 days ago)
    let nextWage = addDays(today, 14 - (today.getDate()%14)||7);
    if(nextWage <= today) nextWage = addDays(nextWage, 14);

    while(d < endDate) {
      const q = getQuarterNum(d);
      const trendRev = (revTrend.intercept + revTrend.slope*(baseIdx+qIdx)) * (seasonal[q]||1) * scenarioMultiplier.revenue;
      const dailyRev = Math.max(0, trendRev/91);

      // ── Daily revenue inflow ──
      events.push({ date:isoDate(d), clinic, label:'Revenue', amount:dailyRev, type:'revenue' });

      // ── Fortnightly wages ──
      if(isoDate(d) === isoDate(nextWage)) {
        const qWages = Math.max(0, trendRev * wageRatio * scenarioMultiplier.cost);
        const fortnightWages = qWages / 6.5;
        const ownerFortnight = ownerSalAvg / 6.5;
        events.push({ date:isoDate(d), clinic, label:'Wages (fortnightly)', amount:-(fortnightWages+ownerFortnight), type:'wages' });
        qWageAccum += fortnightWages;
        nextWage = addDays(d, 14);
      }

      // ── Monthly rent (1st of month) ──
      if(d.getDate()===1) {
        const monthlyRent = (rentAvg/3) * scenarioMultiplier.cost;
        events.push({ date:isoDate(d), clinic, label:'Rent', amount:-monthlyRent, type:'rent' });
      }

      // ── Monthly subscriptions (1st) ──
      if(d.getDate()===1) {
        const monthlySubs = (subsAvg/3) * scenarioMultiplier.cost;
        if(monthlySubs>0) events.push({ date:isoDate(d), clinic, label:'Subscriptions', amount:-monthlySubs, type:'subs' });
      }

      // ── Monthly other opex (15th — staggered from rent) ──
      if(d.getDate()===15) {
        const qOther = Math.max(0, trendRev * otherOpexRatio * scenarioMultiplier.cost);
        events.push({ date:isoDate(d), clinic, label:'Operating expenses', amount:-(qOther/3), type:'opex' });
      }

      // ── Monthly payroll tax (7th of month, VIC) ──
      if(d.getDate()===7 && wageRatio>0) {
        const qWages2 = trendRev * wageRatio * scenarioMultiplier.cost;
        const monthlyPTax = qWages2 * ptaxRatio / 3;
        if(monthlyPTax>0) events.push({ date:isoDate(d), clinic, label:'Payroll tax', amount:-monthlyPTax, type:'tax' });
      }

      // ── Quarterly BAS (GST net) — 28 Oct, 28 Feb, 28 Apr, 28 Jul ──
      const basKey = `${d.getFullYear()}-${d.getMonth()}-${clinic}`;
      if(d.getDate()===28 && [0,1,3,6,9].includes(d.getMonth()) && !scheduledBAS.has(basKey)) {
        scheduledBAS.add(basKey);
        const qRev = trendRev * scenarioMultiplier.revenue;
        const gstCollected = qRev * gstTaxableRatio * 0.10;
        // GST credits: ~10% of non-wage opex
        const qNonWageOpex = qRev * (otherOpexRatio + 0.05) * scenarioMultiplier.cost;
        const gstCredits = qNonWageOpex * 0.10;
        const netBAS = gstCollected - gstCredits;
        if(Math.abs(netBAS)>100)
          events.push({ date:isoDate(d), clinic, label:'BAS (net GST)', amount:-Math.max(0,netBAS), type:'bas' });
      }

      // ── Quarterly IAS (PAYG withholding) — same dates as BAS ──
      const iasKey = `${d.getFullYear()}-${d.getMonth()}-${clinic}-ias`;
      if(d.getDate()===28 && [0,1,3,6,9].includes(d.getMonth()) && !scheduledIAS.has(iasKey) && wageRatio>0) {
        scheduledIAS.add(iasKey);
        const qWages3 = trendRev * wageRatio * scenarioMultiplier.cost;
        const ias = qWages3 * 0.28; // ~28% PAYG rate
        events.push({ date:isoDate(d), clinic, label:'IAS (PAYG withholding)', amount:-ias, type:'ias' });
      }

      // ── Quarterly super — 28 Oct, 28 Jan, 28 Apr, 28 Jul ──
      const superKey = `${d.getFullYear()}-${d.getMonth()}-${clinic}-super`;
      if(d.getDate()===28 && [0,3,6,9].includes(d.getMonth()) && !scheduledSuper.has(superKey) && wageRatio>0) {
        scheduledSuper.add(superKey);
        const qWages4 = trendRev * wageRatio * scenarioMultiplier.cost;
        const superAmt = qWages4 * (superRatio||0.115);
        events.push({ date:isoDate(d), clinic, label:'Superannuation (quarterly)', amount:-superAmt, type:'super' });
      }

      // Quarter boundary
      const nextDay = addDays(d, 1);
      if(getQuarterNum(nextDay) !== getQuarterNum(d)) { qIdx++; qRevAccum=0; qWageAccum=0; }
      d = nextDay;
    }
  }

  return events;
}

// ── Cash Flow Forecast View ───────────────────────────────────────────────────
function CashFlowForecastView({ uploads, cfUploads, loadedClinics }) {
  const [horizon,    setHorizon]    = useState(90);   // days
  const [viewMode,   setViewMode]   = useState('group'); // 'group'|clinic name
  const [showEvents, setShowEvents] = useState(false);
  const [growthAdj,  setGrowthAdj]  = useState(0);   // manual ±% override

  // Starting balances from Xero CF data
  const startingBal = useMemo(() => {
    const today = new Date().toISOString().slice(0,10);
    const bal = {};
    for (const cf of (cfUploads||[])) {
      const todayRow = cf.days?.find(d=>d.isToday) || cf.days?.[cf.days.findIndex(d=>d.date>=today)];
      bal[cf.clinic] = todayRow?.openBal ?? todayRow?.closeBal ?? 0;
    }
    return bal;
  }, [cfUploads]);

  const totalStartBal = useMemo(() =>
    Object.values(startingBal).reduce((s,v)=>s+v,0), [startingBal]);

  // Generate 3 scenarios
  const scenarios = useMemo(() => {
    if(!uploads?.length) return null;
    const extra = growthAdj/100;
    const defs = [
      { name:'Pessimistic', revenue:0.90+extra, cost:1.00, color:'#F26439', dash:'5 3' },
      { name:'Base',        revenue:1.00+extra, cost:1.00, color:'#003B49', dash:'0'   },
      { name:'Optimistic',  revenue:1.15+extra, cost:0.97, color:'#059669', dash:'5 3' },
    ];
    return defs.map(sc => {
      const events = generateForecast(uploads, cfUploads, {revenue:sc.revenue, cost:sc.cost}, startingBal);
      // Accumulate daily balances per clinic
      const today = new Date(); today.setHours(0,0,0,0);
      const clinics = [...new Set(events.map(e=>e.clinic))];
      const balByClinic = {};
      for (const c of clinics) {
        let bal = startingBal[c]||0;
        const clinicEvents = events.filter(e=>e.clinic===c).sort((a,b)=>a.date.localeCompare(b.date));
        const daily = {};
        for (const ev of clinicEvents) {
          daily[ev.date] = (daily[ev.date]||0) + ev.amount;
        }
        const days = [];
        let d = new Date(today);
        for(let i=0; i<=horizon; i++) {
          const key = isoDate(d);
          bal += (daily[key]||0);
          days.push({ date:key, balance:Math.round(bal) });
          d = addDays(d,1);
        }
        balByClinic[c] = days;
      }
      // Group total
      const groupDays = [];
      const today2 = new Date(); today2.setHours(0,0,0,0);
      for(let i=0; i<=horizon; i++) {
        const key = isoDate(addDays(today2,i));
        const tot = clinics.reduce((s,c)=>s+(balByClinic[c]?.[i]?.balance||0),0);
        groupDays.push({ date:key, balance:tot });
      }
      // Key events (BAS, super, IAS, wages lump)
      const bigEvents = events.filter(e=>['bas','ias','super'].includes(e.type))
        .reduce((acc,e)=>{
          const k=`${e.date}-${e.type}-${e.clinic}`;
          acc[k]=(acc[k]||{...e,amount:0});
          acc[k].amount+=e.amount;
          return acc;
        },{});
      return { ...sc, balByClinic, groupDays,
               keyEvents: Object.values(bigEvents).sort((a,b)=>a.date.localeCompare(b.date)) };
    });
  }, [uploads, cfUploads, startingBal, horizon, growthAdj]);

  if(!uploads?.length) return (
    <div style={{padding:40,textAlign:'center',color:P.muted}}>Load P&amp;L files to generate forecast</div>
  );

  const base = scenarios?.[1];
  const pess = scenarios?.[0];
  const opti = scenarios?.[2];

  // Chart data — weekly points to keep chart readable
  const chartData = useMemo(() => {
    if(!base) return [];
    const src = viewMode==='group' ? base.groupDays : base.balByClinic[viewMode]||[];
    const weekly = src.filter((_,i)=>i%7===0);
    return weekly.map((row,i)=>{
      const pi = Math.min(i*7, (pess?.groupDays||pess?.balByClinic[viewMode]||[]).length-1);
      const oi = Math.min(i*7, (opti?.groupDays||opti?.balByClinic[viewMode]||[]).length-1);
      const pessRow = viewMode==='group' ? pess?.groupDays?.[pi] : pess?.balByClinic[viewMode]?.[pi];
      const optiRow = viewMode==='group' ? opti?.groupDays?.[oi] : opti?.balByClinic[viewMode]?.[oi];
      const label = new Date(row.date+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'});
      return {
        date: label,
        base: row.balance,
        pessimistic: pessRow?.balance,
        optimistic: optiRow?.balance,
      };
    });
  }, [base, pess, opti, viewMode]);

  // End-of-period summary
  const endBase = viewMode==='group' ? base?.groupDays?.slice(-1)[0]?.balance
                : base?.balByClinic[viewMode]?.slice(-1)[0]?.balance;
  const endPess = viewMode==='group' ? pess?.groupDays?.slice(-1)[0]?.balance
                : pess?.balByClinic[viewMode]?.slice(-1)[0]?.balance;
  const endOpti = viewMode==='group' ? opti?.groupDays?.slice(-1)[0]?.balance
                : opti?.balByClinic[viewMode]?.slice(-1)[0]?.balance;

  const startBal = viewMode==='group' ? totalStartBal : (startingBal[viewMode]||0);
  const clinics3 = ['Mt Evelyn','Olinda','Chirnside Park'];

  // Upcoming key payment events (next 90 days, base scenario)
  const upcomingEvents = useMemo(()=>{
    if(!base) return [];
    const today=new Date().toISOString().slice(0,10);
    const cutoff=isoDate(addDays(new Date(),Math.min(horizon,90)));
    return base.keyEvents.filter(e=>e.date>=today&&e.date<=cutoff)
      .sort((a,b)=>a.date.localeCompare(b.date));
  },[base, horizon]);

  const TYPE_LABEL = {bas:'BAS (net GST)',ias:'IAS (PAYG)',super:'Superannuation',wages:'Wages'};
  const TYPE_COLOR = {bas:'#7c3aed',ias:'#2563eb',super:'#059669',wages:'#003B49',rent:'#6F7C7C'};

  const fmt = v => v==null?'—':`$${Math.abs(v).toLocaleString('en-AU',{maximumFractionDigits:0})}`;
  const fmtBal = v => v==null?'—':`$${v.toLocaleString('en-AU',{maximumFractionDigits:0})}`;

  return (
    <div style={{padding:'20px 24px',maxWidth:1200}}>

      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20,flexWrap:'wrap',gap:12}}>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:P.text,marginBottom:2}}>
            Cash Flow Forecast
          </div>
          <div style={{fontSize:12,color:P.muted}}>
            Modelled from historical P&amp;L · Revenue trend + seasonality · Wage, BAS, IAS &amp; super timing
          </div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          {/* Horizon selector */}
          <div style={{display:'flex',gap:4}}>
            {[30,60,90,120,180].map(h=>(
              <button key={h} onClick={()=>setHorizon(h)}
                style={{padding:'5px 11px',borderRadius:6,border:`1px solid ${horizon===h?P.text:P.dim}`,
                        background:horizon===h?P.text:'transparent',
                        color:horizon===h?'#fff':P.muted,fontSize:12,cursor:'pointer',fontWeight:horizon===h?600:400}}>
                {h===30?'1M':h===60?'2M':h===90?'3M':h===120?'4M':'6M'}
              </button>
            ))}
          </div>
          {/* Scope selector */}
          <select value={viewMode} onChange={e=>setViewMode(e.target.value)}
            style={{padding:'6px 10px',borderRadius:6,border:`1px solid ${P.dim}`,fontSize:12,color:P.text,background:'#fff'}}>
            <option value="group">Group (combined)</option>
            {clinics3.filter(c=>loadedClinics?.includes(c)).map(c=>(
              <option key={c} value={c}>{c}</option>
            ))}
          </select>
        </div>
      </div>

      {/* Growth override */}
      <div style={{background:P.alt,borderRadius:10,padding:'12px 16px',marginBottom:20,
                   display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
        <div style={{fontSize:12,fontWeight:600,color:P.text}}>Revenue growth adjustment</div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <input type="range" min={-20} max={30} step={1} value={growthAdj}
            onChange={e=>setGrowthAdj(Number(e.target.value))}
            style={{width:160,accentColor:P.text}}/>
          <span style={{fontSize:14,fontWeight:700,color:growthAdj>=0?P.green:P.red,minWidth:44}}>
            {growthAdj>=0?'+':''}{growthAdj}%
          </span>
        </div>
        <div style={{fontSize:11,color:P.muted}}>
          Applied on top of modelled trend · Shifts all three scenarios
        </div>
        {growthAdj!==0&&<button onClick={()=>setGrowthAdj(0)}
          style={{fontSize:11,color:P.muted,background:'none',border:`1px solid ${P.dim}`,
                  borderRadius:5,padding:'3px 8px',cursor:'pointer'}}>Reset</button>}
      </div>

      {/* KPI strip */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:20}}>
        {[
          {label:`Current balance (${viewMode==='group'?'Group':viewMode})`,
           val:fmtBal(startBal), color:P.text, sub:'From Xero today'},
          {label:`Base case ${horizon}d`, val:fmtBal(endBase),
           color:endBase>0?P.green:P.red, sub:`${endBase>startBal?'▲':'▼'} ${fmt(endBase-startBal)} vs now`},
          {label:`Pessimistic ${horizon}d`, val:fmtBal(endPess),
           color:endPess>0?P.gold:P.red, sub:'−10% revenue'},
          {label:`Optimistic ${horizon}d`, val:fmtBal(endOpti),
           color:P.green, sub:'+15% revenue, −3% costs'},
        ].map((k,i)=>(
          <div key={i} style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:10,padding:'14px 16px'}}>
            <div style={{fontSize:9,color:P.muted,textTransform:'uppercase',letterSpacing:1.1,marginBottom:4,fontFamily:'monospace'}}>{k.label}</div>
            <div style={{fontSize:20,fontWeight:700,color:k.color,fontFamily:"'DM Serif Display',serif"}}>{k.val}</div>
            {k.sub&&<div style={{fontSize:10,color:P.muted,marginTop:3}}>{k.sub}</div>}
          </div>
        ))}
      </div>

      {/* Main chart */}
      <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:12,padding:'20px 16px',marginBottom:20}}>
        <div style={{fontSize:12,fontWeight:700,color:P.text,marginBottom:4}}>
          Projected Cash Balance — {viewMode==='group'?'Group':viewMode}
        </div>
        <div style={{fontSize:11,color:P.muted,marginBottom:16}}>
          Sensitivity band shows pessimistic (−10% rev) to optimistic (+15% rev) range
        </div>

            <YAxis tick={{fontSize:10,fill:P.muted}} tickLine={false} axisLine={false}
              tickFormatter={v=>`$${Math.abs(v)>=1000?(v/1000).toFixed(0)+'k':v}`}/>

              contentStyle={{fontSize:11,borderRadius:8,border:`1px solid ${P.border}`}}/>

          <div style={{fontSize:11,color:P.muted,lineHeight:1.9}}>
            {[
              {label:'Revenue', val:'Linear trend + quarterly seasonality from last 6 quarters'},
              {label:'Wages', val:`Fortnightly · ~${(()=>{
                const rs=uploads?.filter(u=>u.clinic==='Mt Evelyn')?.slice(-4)
                  ?.map(u=>{const m=extractClinicHistory([u],'Mt Evelyn')[0];return m?.wages/m?.revenue;})
                  ?.filter(Boolean)||[];
                const avg=rs.length?rs.reduce((a,v)=>a+v,0)/rs.length:0.62;

              {label:'Super', val:'11.5% of wages · Due 28 Oct / 28 Jan / 28 Apr / 28 Jul'},
              {label:'BAS (GST)', val:'10% on taxable supplies less input credits · Quarterly'},
              {label:'IAS', val:'28% PAYG on wages · Lodged with BAS quarterly'},
              {label:'Rent', val:'Monthly · Fixed from 4Q average per clinic'},
              {label:'Payroll tax', val:'VIC monthly · ~2.5% of wages'},
              {label:'Starting balance', val:cfUploads?.length?'From Xero today':'Estimated'},
              {label:'Sensitivity', val:'Pessimistic −10% rev · Optimistic +15% rev, −3% costs'},
            ].map((r,i)=>(
              <div key={i} style={{display:'flex',gap:6,paddingBottom:3,borderBottom:`1px solid ${P.dim}`}}>
                <span style={{fontWeight:600,color:P.text,minWidth:90}}>{r.label}:</span>
                <span>{r.val}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Clinic comparison strip */}
      {viewMode==='group'&&(
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
          {clinics3.filter(c=>loadedClinics?.includes(c)).map(c=>{
            const endBal = base?.balByClinic[c]?.slice(-1)[0]?.balance;
            const sb = startingBal[c]||0;
            const pBal = pess?.balByClinic[c]?.slice(-1)[0]?.balance;
            const oBal = opti?.balByClinic[c]?.slice(-1)[0]?.balance;
            return (
              <div key={c} onClick={()=>setViewMode(c)}
                style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:10,
                        padding:'14px 16px',cursor:'pointer',transition:'box-shadow 0.15s'}}
                onMouseEnter={e=>e.currentTarget.style.boxShadow='0 4px 12px rgba(0,0,0,0.08)'}
                onMouseLeave={e=>e.currentTarget.style.boxShadow='none'}>
                <div style={{fontSize:11,fontWeight:700,color:CC[c]||P.text,marginBottom:6}}>{c}</div>
                <div style={{fontSize:11,color:P.muted}}>Now: <strong style={{color:P.text}}>{fmtBal(sb)}</strong></div>
                <div style={{fontSize:11,color:P.muted}}>Base {horizon}d: <strong style={{color:endBal>0?P.green:P.red}}>{fmtBal(endBal)}</strong></div>
                <div style={{fontSize:10,color:P.muted,marginTop:4}}>
                  Range: {fmtBal(pBal)} → {fmtBal(oBal)}
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div style={{marginTop:16,fontSize:10,color:P.muted,lineHeight:1.5}}>
        ⚠ Forecast is indicative only. Revenue modelled from historical trend — actual results will vary with patient volumes, staffing, and one-off items. BAS and IAS estimates based on modelled revenue and wage ratios. Consult your accountant for tax planning.
      </div>
    </div>
  );
}


function FPDashboard({ preloadedData, onChangePinClick, managerOnly } = {}) {
  const [uploads,     setUploads]     = useState(() => {
    if (preloadedData?.uploads) return preloadedData.uploads;
    return [];
  });
  const [clinic,      setClinic]      = useState("__all");
  const [view,        setView]        = useState("overview");
  const [gmMode,      setGmMode]      = useState(false);
  const [notice,      setNotice]      = useState("");
  const [ownerMode,   setOwnerMode]   = useState(false);
  // managerOnly mode: suppress owner-mode UI and financials
  const effectiveOwnerMode = managerOnly ? false : ownerMode;
  const [cfUploads,   setCfUploads]   = useState(() => {
    if (preloadedData?.cashflow) return preloadedData.cashflow; // pre-parsed [{clinic,days}]
    return [];
  }); // cash flow statement uploads
  const [debtService, setDebtService] = useState(()=>Number(localStorage.getItem("fp_ds")||40000));
  const saveDS = v => { setDebtService(v); localStorage.setItem("fp_ds", v); };
  // URL hash clinic manager mode: #manager-chirnside etc.
  const urlHash    = typeof window!=="undefined"?window.location.hash:"";
  const managerClinic = (() => {
    const m = urlHash.match(/#manager-(.+)/i);
    if (!m) return null;
    return CLINICS.find(c=>c.toLowerCase().replace(/\s+/g,"-")===m[1].toLowerCase())||null;
  })();
  const isManagerMode = !!managerClinic;

  const handleFiles = useCallback((files) => {
    // Try to detect if file is a cash flow statement (has "cash flow" in filename or content)
    // parseXeroCashFlow returns null if not a CF file
    // We attempt both parsers and route accordingly
    const handleRaw = async (fileList) => {
      const cfResults=[], plResults=[];
      for (const file of Array.from(fileList)) {
        if (!file.name.match(/\.xlsx?$/i)) continue;
        const buf = await file.arrayBuffer();
        const isCF = file.name.toLowerCase().match(/cash.?flow|cashflow|statement.of.cash/);
        if (isCF) {
          const cf = parseXeroCashFlow(buf);
          if (cf) cfResults.push(cf);
        } else {
          const pl = parseXeroMultiCol(buf);
          plResults.push(...pl.filter(Boolean));
        }
      }
      if (cfResults.length) {
        setCfUploads(prev=>{
          const next=[...prev];
          for (const cf of cfResults) {
            const idx=next.findIndex(d=>d.clinic===cf.clinic);
            idx>=0?next[idx]=cf:next.push(cf);
          }
          return next;
        });
      }
      if (plResults.length) {
        setUploads(prev => {
          const next=[...prev];
          for (const p of plResults) {
            const idx=next.findIndex(d=>d.clinic===p.clinic&&d.quarter===p.quarter);
            idx>=0?next[idx]=p:next.push(p);
          }
          return next;
        });
      }
    };
    handleRaw(files);
  }, []);
  // end handlePLFiles


  const handleCashFiles = useCallback((cfResults) => {
    setCfUploads(prev=>{
      const next=[...prev];
      for (const cf of cfResults) {
        const idx=next.findIndex(d=>d.clinic===cf.clinic);
        idx>=0?next[idx]=cf:next.push(cf);
      }
      setNotice(`✓ Cash flow loaded for: ${cfResults.map(c=>c.clinic).join(", ")}`);
      return next;
    });
  }, []);

  const handlePLFiles = useCallback((parsed) => {
    setUploads(prev => {
      const next = [...prev];
      let added=0, skipped=[];
      for (const p of parsed) {
        if (!p.clinic||!p.quarter) { skipped.push(p.filename||"unknown"); continue; }
        const idx = next.findIndex(d=>d.clinic===p.clinic&&d.quarter===p.quarter);
        idx>=0 ? next[idx]=p : next.push(p);
        added++;
      }
      setNotice(`✓ ${added} quarters loaded · ${next.length} total`+(skipped.length?` · ⚠ Skipped: ${skipped.join(", ")}`:""));
      return next;
    });
  }, []);

  const quarters      = useMemo(()=>[...new Set(uploads.map(d=>d.quarter))].sort((a,b)=>qKey(a).localeCompare(qKey(b))),[uploads]);
  const loadedClinics = useMemo(()=>CLINICS.filter(c=>uploads.some(d=>d.clinic===c)),[uploads]);

  const effectiveClinic = isManagerMode ? (managerClinic||clinic) : clinic;

  const clinicData    = useMemo(()=>
    (effectiveClinic==="__all"?[]:uploads.filter(d=>d.clinic===effectiveClinic)).sort((a,b)=>qKey(a.quarter).localeCompare(qKey(b.quarter))),
  [uploads,clinic,effectiveClinic]);

  const clinicMetrics = useMemo(()=>
    clinicData.map(d=>({...computeMetrics(d.accounts,d.clinic),quarter:d.quarter,clinic:d.clinic})),
  [clinicData]);

  const latest = clinicMetrics[clinicMetrics.length-1]||null;
  const prevM  = clinicMetrics[clinicMetrics.length-2]||null;
  const dQoQ   = key=>(latest&&prevM&&prevM[key])?((latest[key]-prevM[key])/Math.abs(prevM[key]))*100:undefined;

  const trailing4Q = useMemo(()=>{
    if (clinic==="__all") return quarters.slice(-4).reduce((s,q)=>s+CLINICS.reduce((cs,c)=>{const d=uploads.find(u=>u.clinic===c&&u.quarter===q);return cs+(d?computeMetrics(d.accounts,c).adjEbitda:0)},0),0);
    return clinicMetrics.slice(-4).reduce((s,m)=>s+m.adjEbitda,0);
  },[clinic,quarters,uploads,clinicMetrics]);

  const groupTrend = useMemo(()=>quarters.map(q=>{
    const row={quarter:q}; let gR=0,gE=0,gW=0;
    for (const c of CLINICS) {
      const d=uploads.find(u=>u.clinic===c&&u.quarter===q); if(!d) continue;
      const m=computeMetrics(d.accounts,c);
      row[c+"_rev"]=m.revenue; row[c+"_ebitda"]=m.adjEbitda;
      gR+=m.revenue; gE+=m.adjEbitda; gW+=m.wages;
    }
    row.gRev=gR; row.gEbitda=gE;
    row.gMargin=gR?(gE/gR)*100:0;
    return row;
  }),[quarters,uploads]);

  const seasonality = useMemo(()=>{
    if(clinic==="__all") return [];
    const byQ={Q1:[],Q2:[],Q3:[],Q4:[]};
    for(const m of clinicMetrics){const qn=m.quarter?.match(/Q(\d)/)?.[1];if(qn)byQ[`Q${qn}`].push(m);}
    return ["Q1","Q2","Q3","Q4"].map(q=>({
      quarter:q, label:{Q1:"Jul–Sep",Q2:"Oct–Dec",Q3:"Jan–Mar",Q4:"Apr–Jun"}[q],
      avgRev:   byQ[q].length?byQ[q].reduce((s,x)=>s+x.revenue,0)/byQ[q].length:0,
      avgEbitda:byQ[q].length?byQ[q].reduce((s,x)=>s+x.adjEbitda,0)/byQ[q].length:0,
      avgMargin:byQ[q].length?byQ[q].reduce((s,x)=>s+x.ebitdaMargin,0)/byQ[q].length:0,
      n:byQ[q].length,
    })).filter(x=>x.n>0);
  },[clinic,clinicMetrics]);

  const flags = useMemo(()=>{
    if(!latest) return [];
    return makeFlags(latest, clinic, latest.quarter, uploads);
  },[latest,clinic,uploads]);

  const hasData = uploads.length>0;
  const TAB=(id,label)=>(
    <button onClick={()=>setView(id)} style={{background:view===id?P.alt:"transparent",border:`1px solid ${view===id?P.border:"transparent"}`,color:view===id?P.text:P.muted,borderRadius:7,padding:"7px 14px",cursor:"pointer",fontSize:12,transition:"all 0.15s",whiteSpace:"nowrap"}}>
      {label}
    </button>
  );

  return (
    <div style={{minHeight:"100vh",background:P.bg,color:P.text,fontFamily:"'DM Sans','Segoe UI',sans-serif"}}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap');*{box-sizing:border-box}::-webkit-scrollbar{width:5px;background:${P.bg}}::-webkit-scrollbar-thumb{background:${P.dim};border-radius:3px}body{background:${P.bg}}`}</style>

      {/* Header */}
      <div style={{background:P.surface,borderBottom:`2px solid ${P.border}`,padding:"13px 28px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"baseline",gap:12}}>
          <span style={{fontFamily:"'DM Serif Display',serif",fontSize:20}}>Form &amp; Practice</span>
          <span style={{fontSize:10,color:P.muted,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:1.5}}>Financial Analyser</span>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          {hasData&&<span style={{fontSize:11,color:P.muted,background:P.alt,padding:"5px 10px",borderRadius:6}}>{uploads.length} periods · {loadedClinics.length} clinics · {quarters.length} quarters</span>}
          {hasData&&!isManagerMode&&!managerOnly&&<button onClick={()=>setGmMode(g=>!g)} style={{background:gmMode?`${P.green}22`:"transparent",border:`1px solid ${gmMode?P.green:P.border}`,color:gmMode?P.green:P.muted,borderRadius:7,padding:"6px 14px",cursor:"pointer",fontSize:12}}>
            {gmMode?"← Analysis":"GM Report →"}
          </button>}
          {!isManagerMode&&!managerOnly&&<PinGate ownerMode={effectiveOwnerMode} onToggle={setOwnerMode}/>}
          {!isManagerMode&&effectiveOwnerMode&&onChangePinClick&&<button
              onClick={onChangePinClick}
              style={{background:"none",border:`1px solid ${P.border}`,borderRadius:7,
                      padding:"6px 12px",fontSize:12,color:P.muted,cursor:"pointer",marginLeft:4}}>
              🔑 PIN
            </button>}
        </div>
      </div>

      <div style={{maxWidth:1200,margin:"0 auto",padding:"22px 20px"}}>

        {!gmMode&&(
          <div style={{marginBottom:20}}>
            {!preloadedData && <DropZone onPL={handlePLFiles} onCash={handleCashFiles}/>}
            {notice&&<div style={{fontSize:12,color:notice.startsWith("✓")?P.green:P.muted,marginTop:8,paddingLeft:2}}>{notice}</div>}
            {hasData&&(
              <div style={{marginTop:10,display:"flex",flexWrap:"wrap",gap:5}}>
                {loadedClinics.map(c=>{
                  const qs=uploads.filter(d=>d.clinic===c).sort((a,b)=>qKey(a.quarter).localeCompare(qKey(b.quarter)));
                  const first=qs[0]?.quarter, last=qs[qs.length-1]?.quarter;
                  return <div key={c} style={{display:"flex",alignItems:"center",gap:6,background:P.alt,borderRadius:6,padding:"5px 12px",fontSize:12,color:P.muted,border:`1px solid ${CC[c]}44`}}>
                    <span style={{width:8,height:8,borderRadius:"50%",background:CC[c],flexShrink:0}}/>
                    <span style={{color:CC[c],fontWeight:600}}>{c}</span>
                    <span>{first} → {last} ({qs.length}Q)</span>
                    <button onClick={()=>setUploads(p=>p.filter(d=>d.clinic!==c))} style={{background:"none",border:"none",color:P.dim,cursor:"pointer",fontSize:13,lineHeight:1,padding:0,marginLeft:2}}>×</button>
                  </div>;
                })}
              </div>
            )}
          </div>
        )}

        {gmMode&&hasData&&<GMReport uploads={uploads}/>}

        {!gmMode&&hasData&&(
          <>
            {/* Clinic tabs */}
            <div style={{display:"flex",gap:4,marginBottom:18,flexWrap:"wrap",alignItems:"center"}}>
              <button onClick={()=>setClinic("__all")} style={{background:clinic==="__all"?`${P.gold}22`:"transparent",border:`1px solid ${clinic==="__all"?P.gold:P.border}`,color:clinic==="__all"?P.gold:P.muted,borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:13,fontWeight:600}}>Group</button>
              {loadedClinics.map(c=>(
                <button key={c} onClick={()=>setClinic(c)} style={{background:clinic===c?`${CC[c]}22`:"transparent",border:`1px solid ${clinic===c?CC[c]:P.border}`,color:clinic===c?CC[c]:P.muted,borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:13,fontWeight:600}}>
                  {c} <span style={{opacity:.6,fontSize:11}}>({uploads.filter(d=>d.clinic===c).length}Q)</span>
                </button>
              ))}
              <div style={{width:1,height:24,background:P.border,margin:"0 4px"}}/>
              <button onClick={()=>setClinic("__annual")} style={{background:clinic==="__annual"?`${P.gold}22`:"transparent",border:`1px solid ${clinic==="__annual"?P.gold:P.border}`,color:clinic==="__annual"?P.gold:P.muted,borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:13,fontWeight:600}}>
                ★ Annual Overview
              </button>
              <button onClick={()=>setClinic("__cashflow")} style={{background:clinic==="__cashflow"?`${P.green}22`:"transparent",border:`1px solid ${clinic==="__cashflow"?P.green:P.border}`,color:clinic==="__cashflow"?P.green:P.muted,borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:13,fontWeight:600}}>
                ⬡ Cash Flow

              <button onClick={()=>setClinic("__forecast")} style={{background:clinic==="__forecast"?`${P.teal}22`:"transparent",border:`1px solid ${clinic==="__forecast"?P.teal:P.border}`,color:clinic==="__forecast"?P.teal:P.muted,borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:13,fontWeight:600}}>
                ◈ Forecast
              </button>
              <button onClick={()=>setClinic("__explorer")} style={{background:clinic==="__explorer"?`${P.teal}22`:"transparent",border:`1px solid ${clinic==="__explorer"?P.teal:P.border}`,color:clinic==="__explorer"?P.teal:P.muted,borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:13,fontWeight:600}}>
                ⬡ Explorer
              </button>
              <button onClick={()=>setClinic("__ai")} style={{background:clinic==="__ai"?`${P.gold}22`:"transparent",border:`1px solid ${clinic==="__ai"?P.gold:P.border}`,color:clinic==="__ai"?P.gold:P.muted,borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:13,fontWeight:600}}>
                ✦ Ask AI

            </div>

            {/* ─── GROUP VIEW ─── */}
            {clinic==="__all"&&clinic!=="__annual"&&clinic!=="__explorer"&&clinic!=="__cashflow"&&clinic!=="__forecast"&&clinic!=="__ai"&&(()=>{
              const lq=quarters[quarters.length-1], pq=quarters[quarters.length-2];
              if(!lq) return null;
              const gm=CLINICS.reduce((a,c)=>{const d=uploads.find(u=>u.clinic===c&&u.quarter===lq);if(!d)return a;const m=computeMetrics(d.accounts,c);return{rev:a.rev+m.revenue,ebitda:a.ebitda+m.adjEbitda};},{rev:0,ebitda:0});
              const pg=pq?CLINICS.reduce((a,c)=>{const d=uploads.find(u=>u.clinic===c&&u.quarter===pq);if(!d)return a;const m=computeMetrics(d.accounts,c);return{rev:a.rev+m.revenue,ebitda:a.ebitda+m.adjEbitda};},{rev:0,ebitda:0}):null;
              return (
                <>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12,marginBottom:20}}>

                    <Card label="Group Adj. EBITDA" value={fmtK(gm.ebitda)} color={P.gold} delta={pg?.ebitda?((gm.ebitda-pg.ebitda)/Math.abs(pg.ebitda)*100):undefined}/>
                    <Card label="EBITDA Margin" value={gm.rev?pct(gm.ebitda,gm.rev):"—"} color={P.gold}/>
                    <Card label="Trailing 4Q EBITDA" value={fmtK(trailing4Q)} sub="sum, not annualised"/>
                    <Card label="Indicative Value" value={`${fmtK(trailing4Q*3)}–${fmtK(trailing4Q*5)}`} sub="3–5× trailing 4Q" color={P.green}/>

                  {groupTrend.length>1&&<>
                    <SH>Group Revenue by Clinic</SH>
                    <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:12,padding:"18px 12px 12px",marginBottom:16}}>
                      <ResponsiveContainer width="100%" height={220}>
                        <BarChart data={groupTrend} barCategoryGap="22%">

                          <XAxis dataKey="quarter" tick={{fill:P.muted,fontSize:10}} interval={1}/>

                          <Tooltip content={<TT/>}/>
                          <Legend/>
                          {loadedClinics.map(c=><Bar key={c} dataKey={`${c}_rev`} name={c} fill={CC[c]} stackId="a" opacity={0.85}/>)}

                          <XAxis dataKey="quarter" tick={{fill:P.muted,fontSize:10}} interval={1}/>
                          <YAxis tickFormatter={fmtK} tick={{fill:P.muted,fontSize:10}} width={64}/>
                          <Tooltip content={<TT/>}/>
                          <Legend/>
                          {loadedClinics.map(c=><Line key={c} type="monotone" dataKey={`${c}_ebitda`} name={c} stroke={CC[c]} strokeWidth={2} dot={{r:2,fill:CC[c]}}/>)}
                          <Line type="monotone" dataKey="gEbitda" name="Group Total" stroke={P.gold} strokeWidth={2.5} strokeDasharray="5 3" dot={{r:3,fill:P.gold}}/>

                      </ResponsiveContainer>
                    </div>

                    <SH>Group EBITDA Margin %</SH>

                          <XAxis dataKey="quarter" tick={{fill:P.muted,fontSize:10}} interval={1}/>
                          <YAxis tickFormatter={v=>`${v.toFixed(0)}%`} tick={{fill:P.muted,fontSize:10}} width={40}/>
                          <Tooltip formatter={v=>`${Number(v).toFixed(1)}%`}/>
                          <Area type="monotone" dataKey="gMargin" name="EBITDA Margin %" stroke={P.gold} fill="url(#mg)" strokeWidth={2}/>

            {clinic!=="__all"&&clinic!=="__explorer"&&clinic!=="__cashflow"&&clinic!=="__forecast"&&clinic!=="__annual"&&clinic!=="__ai"&&latest&&(

                            <div style={{fontSize:22,fontWeight:700,color:latest.wageRatio<=55?P.green:latest.wageRatio<=65?P.gold:P.red,fontFamily:"'DM Serif Display',serif"}}>{latest.wageRatio.toFixed(1)}%</div>

                            <div style={{fontSize:22,fontWeight:700,color:dsc>=2?P.green:dsc>=1.25?P.gold:P.red,fontFamily:"'DM Serif Display',serif"}}>{dsc.toFixed(2)}×</div>

                    {(latest.ownerSalary+latest.ownerSuper+latest.da+latest.interest)>0&&(

                        <div style={{display:"flex",flexWrap:"wrap",gap:16,alignItems:"flex-end"}}>
                          {[
                            {l:"Net Profit",v:latest.netProfit,c:P.text},

                            {l:"+ Interest",v:latest.interest,c:P.purple},
                            {l:"= EBITDA",v:latest.ebitda,c:P.text,sep:true},
                            {l:"+ Owner Salary",v:latest.ownerSalary,c:P.gold},

                    <>
                      {/* Service line trend */}
                      {clinicMetrics.length>1&&<>
                        <SH>Service Line Trend — {clinic}</SH>

                          <ResponsiveContainer width="100%" height={220}>

                        <SH>Wages % Revenue — {clinic}</SH>

                              <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor={P.orange} stopOpacity={0.3}/><stop offset="95%" stopColor={P.orange} stopOpacity={0}/></linearGradient></defs>

                      {clinicMetrics.length>1&&<>
                        <SH>Revenue Mix Trend</SH>

                {/* EXPENSES */}
                {view==="expenses"&&(
                  <>
                    <SH>Expense Breakdown — {latest.quarter}</SH>
                    <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:12,overflow:"auto",marginBottom:16}}>
                      <ExpTable items={latest.expenseDetail} total={latest.opex}/>
                    </div>
                    {clinicMetrics.length>1&&<>
                      <SH>Cost Ratios Over Time</SH>
                      <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:12,padding:"18px 12px 12px",marginBottom:16}}>
                        <ResponsiveContainer width="100%" height={200}>
                          <LineChart data={clinicMetrics}>
                            <CartesianGrid strokeDasharray="3 3" stroke={P.border}/>
                            <XAxis dataKey="quarter" tick={{fill:P.muted,fontSize:10}} interval={1}/>
                            <YAxis tickFormatter={v=>`${v.toFixed(0)}%`} tick={{fill:P.muted,fontSize:10}} width={40}/>
                            <Tooltip formatter={v=>`${Number(v).toFixed(1)}%`}/>
                            <Legend/>
                            <Line type="monotone" dataKey="wageRatio" name="Wages % Rev" stroke={P.red} strokeWidth={2} dot={{r:2}}/>

                {view==="seasonality"&&(
                  <>
                    <SH>Seasonality — {clinic} ({clinicMetrics.length} quarters)</SH>

                          const best  = seasonality.reduce((b,s)=>s.avgRev>b.avgRev?s:b,seasonality[0]);
                          const worst = seasonality.reduce((b,s)=>s.avgRev<b.avgRev?s:b,seasonality[0]);
                          const spread = worst.avgRev?((best.avgRev-worst.avgRev)/worst.avgRev*100):0;
                          return (
                            <>
                              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:16}}>
                                {seasonality.map(s=>(
                                  <Card key={s.quarter} small label={`${s.quarter} (${s.label})`} value={fmtK(s.avgRev)}

                              </div>
                            </>

                        })()

                {view==="breakeven"&&(

                {view==="valuation"&&(
                  <>
                    <SH>Indicative Valuation — {clinic}</SH>
                    <div style={{background:P.surface,border:`1px solid ${P.border}`,borderRadius:12,padding:24,marginBottom:16}}>
                      <p style={{fontSize:13,color:P.muted,marginBottom:20,lineHeight:1.7}}>
                        Physio clinic transactions typically price on 3–5× Adj. EBITDA. Trailing 4Q smooths the year-end D&A spike and seasonality, and is more defensible than a single quarter in a sale process.
                        {!OWNER_SALARY_CLINICS.includes(clinic)&&" No owner salary add-back at Chirnside Park."}
                      </p>
                      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14,marginBottom:22}}>

                      </div>
                      <div style={{marginBottom:20}}>
                        <div style={{fontSize:9,color:P.muted,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:1.2,marginBottom:10}}>Valuation Range (3–5× Trailing {Math.min(4,clinicMetrics.length)}Q Adj. EBITDA)</div>
                        <div style={{display:"flex",height:52,borderRadius:8,overflow:"hidden"}}>
                          {[3,3.5,4,4.5,5].map((mult,i)=>(
                            <div key={mult} style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",background:`hsl(${200+i*14},55%,${20+i*5}%)`,borderRight:i<4?`1px solid ${P.bg}`:"none"}}>
                              <span style={{fontSize:9,color:P.muted,fontFamily:"monospace"}}>{mult}×</span>
                              <span style={{fontSize:12,fontWeight:600,color:P.text}}>{fmtK(trailing4Q*mult)}</span>

                          ))}
                        </div>
                      </div>
                      {clinicMetrics.length>=5&&(()=>{
                        const vdata=clinicMetrics.slice(3).map((m,i)=>({quarter:m.quarter,val:clinicMetrics.slice(i,i+4).reduce((s,x)=>s+x.adjEbitda,0)}));
                        return (
                          <>
                            <div style={{fontSize:9,color:P.muted,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:1.2,marginBottom:10}}>Rolling 4Q Adj. EBITDA Trajectory</div>
                            <div style={{background:P.alt,borderRadius:10,padding:"14px 10px"}}>
                              <ResponsiveContainer width="100%" height={140}>
                                <AreaChart data={vdata}>
                                  <defs><linearGradient id="vg" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor={P.green} stopOpacity={0.3}/><stop offset="95%" stopColor={P.green} stopOpacity={0}/></linearGradient></defs>
                                  <CartesianGrid strokeDasharray="3 3" stroke={P.border}/>
                                  <XAxis dataKey="quarter" tick={{fill:P.muted,fontSize:10}} interval={1}/>
                                  <YAxis tickFormatter={fmtK} tick={{fill:P.muted,fontSize:10}} width={64}/>
                                  <Tooltip formatter={v=>fmtK(v)} labelFormatter={l=>`Rolling 4Q to ${l}`}/>
                                  <Area type="monotone" dataKey="val" name="Ann. Adj. EBITDA" stroke={P.green} fill="url(#vg)" strokeWidth={2}/>
                                </AreaChart>
                              </ResponsiveContainer>
                            </div>
                          </>
                        );
                      })()}
                      <div style={{marginTop:18,padding:"12px 16px",background:`${P.gold}10`,border:`1px solid ${P.gold}28`,borderRadius:8,fontSize:12,color:P.muted,lineHeight:1.7}}>
                        ⚠ Indicative only. Actual value depends on lease WALE, staff tenure, key-person risk, patient concentration, payer mix (Medicare/DVA/WorkCover/private), growth trajectory, and buyer type. Note: D&A is posted as a year-end journal at Mt Evelyn — for valuation, the trailing 4Q EBITDA will include one quarter's D&A add-back, which may slightly understate true EBITDA if annualising a non-year-end period. Engage a healthcare M&A adviser for a formal valuation.
                      </div>
                      {(clinic==="Mt Evelyn"||clinic==="__all")&&(
                        <div style={{marginTop:12,padding:"12px 16px",background:`${P.blue}08`,border:`1px solid ${P.blue}28`,borderRadius:8,fontSize:12,color:P.muted,lineHeight:1.7}}>
                          ℹ <strong style={{color:P.text}}>Medfin fit-out loans:</strong> Two Medfin loans are secured against the studio fit-outs — Mt Evelyn #9748 (~$66.5k net) and Chirnside Park #7932 (~$100.4k net) — totalling approximately <strong style={{color:P.text}}>$167k</strong> as at June 2025. Both loans are held in the name of <strong style={{color:P.text}}>Dandenong Ranges Allied Health (DRAH)</strong>, an associated entity that is not part of Form & Practice's operations and would not be included in any sale. Any sale is most likely structured as an <strong style={{color:P.text}}>asset sale</strong> — the buyer acquires business assets (goodwill, equipment, patient list) not company shares — so these liabilities <strong style={{color:P.text}}>do not reduce the purchase price</strong>. They remain with DRAH and must be repaid by the vendor from sale proceeds. Factor ~$167k in loan repayments when modelling your net-of-debt proceeds.
                        </div>
                      )}
                    </div>
                  </>
                )}
              </>
            )}

            {clinic==="__annual"&&(
              <AnnualOverviewView uploads={uploads} quarters={quarters} loadedClinics={loadedClinics}/>
            )}

            {clinic==="__cashflow"&&(
              <CashFlowView cfUploads={cfUploads} plUploads={uploads} loadedClinics={loadedClinics}/>
            )}

            {clinic==="__forecast"&&(
              <CashFlowForecastView uploads={uploads} cfUploads={cfUploads} loadedClinics={loadedClinics}/>
            )}

            {clinic==="__explorer"&&(
              <ExplorerView uploads={uploads} quarters={quarters} loadedClinics={loadedClinics}/>
            )}
            {clinic==="__ai"&&(
              <AIAssistant uploads={uploads} cfUploads={cfUploads} ownerMode={ownerMode}/>
            )}

            {clinic!=="__all"&&clinic!=="__explorer"&&clinic!=="__cashflow"&&clinic!=="__forecast"&&clinic!=="__annual"&&clinic!=="__ai"&&!latest&&(
              <div style={{textAlign:"center",padding:"48px",color:P.muted}}>No data for {clinic} — drop the XLSX files above.</div>
            )}
          </>
        )}

        {!hasData&&!gmMode&&(
          <div style={{textAlign:"center",padding:"60px 20px"}}>
            <div style={{fontSize:30,marginBottom:14,opacity:0.2}}>📊</div>
            <div style={{fontSize:15,color:P.dim,marginBottom:8}}>Drop your 3 Xero comparison files above</div>
            <div style={{fontSize:13,color:P.dim,maxWidth:480,margin:"0 auto",lineHeight:1.7}}>
              One file per clinic · 14 quarters each · all three at once.<br/>
              Clinic names and all 14 quarters are auto-detected from each file.
            </div>
          </div>
        )}
      </div>
    </div>
  );
}


  function FPDashboardWithData() {
    React.useEffect(() => { window.openPinModal = openPinModal; }, []);
    return React.createElement(FPDashboard, {
      preloadedData:    window._fp_data,
      managerOnly:      window._fp_manager || false,
      onChangePinClick: window._fp_manager ? null : () => openPinModal(),
    });
  }

  function loadDashboard() {
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(FPDashboardWithData));
  }
</script>

</body>
</html>
